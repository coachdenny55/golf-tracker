<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Round Log">
<meta name="theme-color" content="#1F3D2E">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Round Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2EEE2;
    --paper-raised:#FBF9F2;
    --line:#D8D2BE;
    --line-strong:#B9B29A;
    --ink:#26261F;
    --ink-soft:#5B5A4E;
    --green-deep:#1F3D2E;
    --green-mid:#3F6B4F;
    --green-pale:#DCE6DC;
    --red:#A8402C;
    --red-pale:#F1DAD3;
    --gold:#A6822F;
    --gold-pale:#EFE4C4;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--paper), var(--paper)),
      repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(31,61,46,0.035) 28px);
    background-color:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .app{max-width:480px;margin:0 auto;padding:0 0 40px;}

  /* Masthead */
  header.mast{
    background:var(--green-deep);
    color:var(--paper-raised);
    padding:20px 20px 16px;
    border-bottom:4px solid var(--gold);
  }
  header.mast .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold-pale);
    opacity:0.85;
  }
  header.mast h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:30px;
    margin:2px 0 12px;
    letter-spacing:-0.01em;
  }
  .mast-row{display:flex;gap:10px;}
  .mast-input{
    flex:1;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.25);
    border-radius:6px;
    color:var(--paper-raised);
    padding:8px 10px;
    font-family:'Inter',sans-serif;
    font-size:13px;
  }
  .mast-input::placeholder{color:rgba(251,249,242,0.5);}

  /* Tabs */
  nav.tabs{
    display:flex;
    border-bottom:1px solid var(--line-strong);
    background:var(--paper-raised);
  }
  nav.tabs button{
    flex:1;
    padding:12px 2px;
    border:none;
    background:none;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--ink-soft);
    border-bottom:3px solid transparent;
    cursor:pointer;
  }

  /* ---- My Bag ---- */
  .bag-row{
    display:flex;align-items:center;gap:8px;
    background:var(--paper-raised);border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;margin-bottom:6px;
  }
  .bag-row .bn{flex:1;font-size:13.5px;font-weight:500;}
  .bag-row .by{
    width:64px;padding:6px 4px;text-align:center;
    font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;
    border:1px solid var(--line-strong);border-radius:6px;
    background:var(--paper);color:var(--green-deep);
  }
  .bag-row .beff{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;
    color:var(--gold);width:58px;text-align:right;line-height:1.25;
  }
  .bag-row .brm{
    background:none;border:none;color:var(--line-strong);
    font-size:18px;cursor:pointer;padding:0 2px;line-height:1;
  }
  .bag-add{display:flex;gap:6px;margin-top:10px;}
  .bag-add input{
    flex:1;padding:8px 10px;border:1px solid var(--line-strong);
    border-radius:6px;background:var(--paper-raised);font-size:13px;
  }
  .bag-add input.num{flex:0 0 70px;text-align:center;font-family:'IBM Plex Mono',monospace;}
  .bag-add button{
    flex:0 0 54px;border:none;border-radius:6px;background:var(--green-deep);
    color:var(--paper-raised);font-weight:600;font-size:13px;cursor:pointer;
  }
  .gap-flag{
    font-family:'IBM Plex Mono',monospace;font-size:11px;
    padding:3px 0 3px 10px;border-left:2px solid var(--red);
    color:var(--ink-soft);margin:2px 0 6px 8px;
  }
  .gap-flag.ok{border-left-color:var(--green-mid);}
  table.matrix{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:12px;}
  table.matrix th{
    font-size:10px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);
    padding:6px 4px;border-bottom:1px solid var(--line-strong);font-weight:500;
  }
  table.matrix td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line);}
  table.matrix td.cname{text-align:left;font-family:'Inter',sans-serif;font-size:12.5px;}

  /* ---- Caddie ---- */
  .target-box{
    background:var(--green-deep);color:var(--paper-raised);
    padding:16px 20px;text-align:center;
  }
  .target-box .tlabel{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;
    letter-spacing:0.12em;text-transform:uppercase;color:var(--gold-pale);
  }
  .target-box .tinput{
    width:120px;background:transparent;border:none;border-bottom:2px solid var(--gold);
    color:var(--paper-raised);font-family:'IBM Plex Mono',monospace;
    font-size:42px;font-weight:600;text-align:center;padding:2px 0;
  }
  .target-steps{display:flex;justify-content:center;gap:8px;margin-top:10px;}
  .target-steps button{
    padding:6px 12px;border-radius:6px;border:1px solid rgba(255,255,255,0.3);
    background:rgba(255,255,255,0.08);color:var(--paper-raised);
    font-family:'IBM Plex Mono',monospace;font-size:12px;cursor:pointer;
  }
  .plays-like{
    background:var(--gold-pale);border-bottom:1px solid var(--gold);
    padding:12px 20px;text-align:center;
  }
  .plays-like .pl-num{
    font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:600;color:var(--green-deep);
  }
  .plays-like .pl-lbl{
    font-size:10.5px;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-soft);
  }
  .breakdown{
    display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:8px;
  }
  .breakdown span{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;
    background:var(--paper-raised);border:1px solid var(--line);
    border-radius:4px;padding:2px 6px;color:var(--ink-soft);
  }
  .rec-card{
    background:var(--paper-raised);border:1px solid var(--line);
    border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;
    display:flex;align-items:center;gap:12px;
  }
  .rec-card.primary{border:2px solid var(--green-deep);background:var(--green-pale);}
  .rec-rank{
    font-family:'IBM Plex Mono',monospace;font-size:10px;
    width:22px;height:22px;border-radius:50%;flex:0 0 22px;
    display:flex;align-items:center;justify-content:center;
    background:var(--green-deep);color:var(--paper-raised);
  }
  .rec-card.primary .rec-rank{background:var(--gold);color:var(--green-deep);}
  .rec-body{flex:1;}
  .rec-club{font-family:'Fraunces',serif;font-size:16px;font-weight:600;}
  .rec-swing{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:0.05em;margin-top:1px;
  }
  .rec-yards{text-align:right;font-family:'IBM Plex Mono',monospace;}
  .rec-yards .ry{font-size:19px;font-weight:600;color:var(--green-deep);}
  .rec-yards .rd{font-size:10.5px;color:var(--ink-soft);}
  .lie-note{
    font-size:12.5px;line-height:1.5;color:var(--ink);
    background:var(--red-pale);border-left:3px solid var(--red);
    padding:9px 12px;border-radius:0 6px 6px 0;margin-bottom:10px;
  }
  .compact-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .mini-input{
    width:100%;padding:8px;border:1px solid var(--line-strong);border-radius:6px;
    background:var(--paper-raised);font-family:'IBM Plex Mono',monospace;
    font-size:13px;text-align:center;
  }
  nav.tabs button.active{color:var(--green-deep);border-bottom-color:var(--green-deep);font-weight:600;}

  section{padding:18px 20px;}

  /* Score-to-par big readout */
  .headline-stats{
    display:flex;
    gap:10px;
    padding:16px 20px 4px;
  }
  .stat-tile{
    flex:1;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:10px 6px;
    text-align:center;
  }
  .stat-tile .num{
    font-family:'IBM Plex Mono',monospace;
    font-size:22px;
    font-weight:600;
    color:var(--green-deep);
  }
  .stat-tile .lbl{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--ink-soft);
    margin-top:2px;
  }

  /* Hole navigator */
  .hole-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px 6px;
  }
  .hole-nav button.arrow{
    width:38px;height:38px;
    border-radius:50%;
    border:1px solid var(--line-strong);
    background:var(--paper-raised);
    font-size:16px;
    color:var(--green-deep);
    cursor:pointer;
  }
  .hole-nav button.arrow:disabled{opacity:0.3;cursor:default;}
  .hole-badge{
    font-family:'Fraunces',serif;
    font-size:15px;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .hole-badge .hnum{
    font-size:34px;
    font-weight:700;
    color:var(--ink);
    line-height:1;
  }
  .hole-dots{display:flex;gap:3px;flex-wrap:wrap;max-width:120px;}
  .hole-dots span{
    width:7px;height:7px;border-radius:50%;
    background:var(--line-strong);
  }
  .hole-dots span.done{background:var(--green-mid);}
  .hole-dots span.current{background:var(--red);}

  /* Score display with golf scoring convention shapes */
  .score-display{
    display:flex;justify-content:center;align-items:center;
    padding:6px 20px 14px;
  }
  .score-shape{
    width:64px;height:64px;
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:26px;font-weight:600;
    position:relative;
  }
  .score-shape .core{
    width:52px;height:52px;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
  }
  .shape-eagle .core{border:2px solid var(--gold);border-radius:50%;box-shadow:0 0 0 4px var(--paper) inset, 0 0 0 5px var(--gold);}
  .shape-birdie .core{border:2px solid var(--gold);border-radius:50%;}
  .shape-par .core{border:none;}
  .shape-bogey .core{border:2px solid var(--red);border-radius:4px;}
  .shape-double .core{border:2px solid var(--red);border-radius:4px;box-shadow:0 0 0 4px var(--paper) inset, 0 0 0 5px var(--red);}
  .score-caption{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.08em;
    text-align:center;margin-top:-6px;
  }
  .score-steppers{display:flex;justify-content:center;gap:16px;margin-top:8px;}
  .score-steppers button{
    width:34px;height:34px;border-radius:50%;
    border:1px solid var(--line-strong);background:var(--paper-raised);
    font-size:18px;color:var(--green-deep);cursor:pointer;
  }

  /* Field groups */
  .field{margin-bottom:16px;}
  .field-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;text-transform:uppercase;letter-spacing:0.08em;
    color:var(--ink-soft);margin-bottom:6px;display:block;
  }
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}
  .btn-row button{
    flex:1;
    min-width:56px;
    padding:9px 6px;
    border-radius:8px;
    border:1px solid var(--line-strong);
    background:var(--paper-raised);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:13px;font-weight:500;
    cursor:pointer;
  }
  .btn-row button.sel{
    background:var(--green-deep);
    border-color:var(--green-deep);
    color:var(--paper-raised);
  }
  .btn-row button.sel.bad{background:var(--red);border-color:var(--red);}
  select.field-select{
    width:100%;padding:9px 10px;border-radius:8px;
    border:1px solid var(--line-strong);background:var(--paper-raised);
    font-family:'Inter',sans-serif;font-size:13px;color:var(--ink);
  }
  .na-note{font-size:12px;color:var(--ink-soft);font-style:italic;padding:8px 2px;}

  .save-btn{
    width:100%;padding:13px;border-radius:8px;border:none;
    background:var(--green-deep);color:var(--paper-raised);
    font-family:'Inter',sans-serif;font-weight:600;font-size:14px;
    cursor:pointer;margin-top:6px;
  }
  .finish-btn{
    width:100%;padding:13px;border-radius:8px;border:2px solid var(--gold);
    background:var(--gold-pale);color:var(--green-deep);
    font-family:'Inter',sans-serif;font-weight:700;font-size:14px;
    cursor:pointer;margin-top:10px;
  }

  /* Ledger table */
  .ledger-wrap{padding:8px 20px 4px;overflow-x:auto;}
  table.ledger{
    width:100%;border-collapse:collapse;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
  }
  table.ledger th{
    text-align:center;color:var(--ink-soft);font-weight:500;
    padding:5px 3px;border-bottom:1px solid var(--line-strong);
    text-transform:uppercase;font-size:9.5px;letter-spacing:0.02em;
  }
  table.ledger td{
    text-align:center;padding:6px 3px;border-bottom:1px solid var(--line);
  }
  table.ledger tr.current-row td{background:var(--green-pale);}
  table.ledger td.score-over{color:var(--red);font-weight:600;}
  table.ledger td.score-under{color:var(--gold);font-weight:600;}

  /* Insights */
  .insights-panel{
    margin:18px 20px 4px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-left:4px solid var(--green-deep);
    border-radius:0 var(--radius) var(--radius) 0;
    padding:14px 16px;
  }
  .insights-panel h3{
    font-family:'Fraunces',serif;font-size:15px;margin:0 0 8px;color:var(--green-deep);
  }
  .insights-panel ul{margin:0;padding-left:18px;}
  .insights-panel li{font-size:13.5px;line-height:1.5;margin-bottom:8px;color:var(--ink);}
  .insights-panel li b{color:var(--green-deep);}
  .insights-panel .empty{font-size:13px;color:var(--ink-soft);font-style:italic;}

  /* History */
  .round-card{
    background:var(--paper-raised);border:1px solid var(--line);
    border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;
    display:flex;justify-content:space-between;align-items:center;
  }
  .round-card .rc-left .rc-course{font-family:'Fraunces',serif;font-size:15px;}
  .round-card .rc-left .rc-date{font-size:11px;color:var(--ink-soft);}
  .round-card .rc-right{text-align:right;font-family:'IBM Plex Mono',monospace;}
  .round-card .rc-score{font-size:20px;font-weight:600;}
  .round-card .rc-topar{font-size:11px;color:var(--ink-soft);}
  .sparkline-block{margin-top:20px;}
  .sparkline-block h4{
    font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;
    letter-spacing:0.08em;color:var(--ink-soft);margin-bottom:6px;
  }
  .empty-state{
    text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:13.5px;
  }
  .empty-state b{display:block;font-family:'Fraunces',serif;font-size:17px;color:var(--ink);margin-bottom:6px;font-weight:600;}

  .rc-del{
    background:none;border:none;color:var(--red);font-size:11px;
    font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:0.05em;
    cursor:pointer;padding:4px 0;margin-top:6px;
  }
  .round-card{flex-wrap:wrap;}
  .round-card .rc-right{display:flex;flex-direction:column;align-items:flex-end;}

  /* Home screen */
  .career-stats{
    display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
    padding:16px 20px 4px;
  }
  .career-tile{
    background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 12px;
  }
  .career-tile .num{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;color:var(--green-deep);}
  .career-tile .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);margin-top:2px;}

  .action-card{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--green-deep);color:var(--paper-raised);
    border-radius:var(--radius);padding:16px 18px;margin:16px 20px 0;cursor:pointer;
    border:none;width:calc(100% - 40px);text-align:left;
  }
  .action-card.secondary{
    background:var(--paper-raised);color:var(--ink);border:1px solid var(--line-strong);
  }
  .action-card .ac-title{font-family:'Fraunces',serif;font-size:16px;font-weight:600;}
  .action-card .ac-sub{font-size:11.5px;opacity:0.75;margin-top:2px;}
  .action-card .ac-arrow{font-size:20px;}

  .home-section-title{
    font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;
    letter-spacing:0.08em;color:var(--ink-soft);margin:22px 20px 8px;
  }
  .view-all{
    display:block;text-align:center;font-size:12.5px;color:var(--green-mid);
    font-family:'Inter',sans-serif;font-weight:600;padding:6px 20px 4px;cursor:pointer;
  }

  /* Focus system */
  .focus-card{
    background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);
    margin:0 20px 10px;overflow:hidden;
  }
  .focus-card.root{border-left:4px solid var(--red);}
  .focus-card.symptom{border-left:4px solid var(--green-mid);}
  .fc-head{padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;}
  .fc-tag{
    font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:0.05em;
    padding:2px 6px;border-radius:4px;flex:0 0 auto;
  }
  .fc-tag.root{background:var(--red-pale);color:var(--red);}
  .fc-tag.symptom{background:var(--green-pale);color:var(--green-deep);}
  .fc-line{font-size:13px;line-height:1.4;flex:1;}
  .fc-chev{font-size:14px;color:var(--ink-soft);flex:0 0 auto;}
  .fc-body{padding:0 14px 14px;border-top:1px solid var(--line);}
  .fc-body p{font-size:13px;line-height:1.5;margin:10px 0;}
  .drill-box{
    background:var(--gold-pale);border-radius:8px;padding:10px 12px;margin:8px 0;
  }
  .drill-box .dtitle{font-family:'Fraunces',serif;font-weight:600;font-size:13.5px;color:var(--green-deep);margin-bottom:4px;}
  .drill-box .dbody{font-size:12.5px;line-height:1.5;}
  .log-practice-btn{
    width:100%;padding:9px;border-radius:6px;border:1px solid var(--green-deep);
    background:none;color:var(--green-deep);font-weight:600;font-size:12.5px;
    cursor:pointer;margin-top:6px;
  }
  .before-after{
    font-family:'IBM Plex Mono',monospace;font-size:12px;margin-top:8px;
    background:var(--paper);border-radius:6px;padding:8px 10px;
  }
  .practice-entry{font-size:11.5px;color:var(--ink-soft);padding:3px 0;border-bottom:1px solid var(--line);}

  /* Inline caddie in round flow */
  .get-club-btn{
    width:100%;padding:10px;border-radius:8px;border:1px dashed var(--green-mid);
    background:var(--green-pale);color:var(--green-deep);font-weight:600;font-size:13px;
    cursor:pointer;margin-top:6px;
  }
  .inline-caddie{
    background:var(--paper);border:1px solid var(--line-strong);border-radius:var(--radius);
    padding:12px;margin-top:8px;
  }
  .mini-plays-like{
    text-align:center;font-family:'IBM Plex Mono',monospace;
    background:var(--green-deep);color:var(--paper-raised);border-radius:8px;
    padding:8px;margin-bottom:8px;
  }
  .mini-plays-like .mpl-num{font-size:22px;font-weight:600;}
  .use-club-btn{
    width:100%;text-align:left;background:var(--paper-raised);border:1px solid var(--line);
    border-radius:8px;padding:9px 12px;margin-bottom:6px;cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;
  }
  .use-club-btn .ucb-name{font-family:'Fraunces',serif;font-size:14px;font-weight:600;}
  .use-club-btn .ucb-sub{font-size:10.5px;color:var(--ink-soft);}

<body>
<div class="app" id="app"></div>

<script>
const CLUBS = ["Driver","Fairway Wood","Hybrid","Long Iron (3-5)","Mid Iron (6-7)","Short Iron (8-9)","Wedge"];
const APPROACH_RANGES = ["<50","50-100","100-150","150-200","200+"];

function blankHole(par){
  return {
    par: par||4, score: par||4, fir:null, approach:null, approachYards:null,
    club:null, gir:null, ud:null, putts:2, puttDist:null,
    blowup:null, recClub:null, recSwing:null, followedRec:null
  };
}
function newRound(){
  return {course:"", date: new Date().toISOString().slice(0,10), slope:"", rating:"", courseId:null, teeId:null, holes: Array.from({length:18},()=>blankHole(4))};
}
function blankCourseHoles(){
  return Array.from({length:18},()=>({par:4, yardage:null}));
}
function approachBucketFromYards(y){
  if(y==null || isNaN(y)) return null;
  if(y<50) return "<50";
  if(y<100) return "50-100";
  if(y<150) return "100-150";
  if(y<200) return "150-200";
  return "200+";
}

// ---------- Bag & Caddie model ----------
const SWINGS = [
  {id:'half',  label:'½ swing',  short:'½',    mult:0.75, penalty:5, knock:0.35},
  {id:'three', label:'¾ swing',  short:'¾',    mult:0.88, penalty:2, knock:0.65},
  {id:'full',  label:'Full',     short:'Full', mult:1.00, penalty:0, knock:1.00},
  {id:'extra', label:'Extra',    short:'Extra',mult:1.05, penalty:7, knock:1.15}
];
const CLUB_CATS = [
  {id:'wood',   label:'Wood'},
  {id:'hybrid', label:'Hybrid'},
  {id:'iron',   label:'Iron'},
  {id:'wedge',  label:'Wedge'}
];
const BAG_PRESET = [
  {name:'Driver',        yards:250, cat:'wood'},
  {name:'3 Hybrid',      yards:205, cat:'hybrid'},
  {name:'4 Iron',        yards:194, cat:'iron'},
  {name:'5 Iron',        yards:182, cat:'iron'},
  {name:'6 Iron',        yards:171, cat:'iron'},
  {name:'7 Iron',        yards:159, cat:'iron'},
  {name:'8 Iron',        yards:147, cat:'iron'},
  {name:'9 Iron',        yards:134, cat:'iron'},
  {name:'Pitching Wedge',yards:122, cat:'wedge'},
  {name:'Approach Wedge',yards:110, cat:'wedge'},
  {name:'52° Wedge',     yards:98,  cat:'wedge'},
  {name:'56° Wedge',     yards:86,  cat:'wedge'},
  {name:'60° Wedge',     yards:74,  cat:'wedge'}
];
const LIES = [
  {id:'fairway',   label:'Fairway',      mult:1.00, note:''},
  {id:'tee',       label:'Tee',          mult:0.98, note:''},
  {id:'lightrough',label:'Light rough',  mult:0.98, note:'Flier risk. Less spin means it can jump 5–10 yards and release hard on landing — take the shorter end of the range.'},
  {id:'heavyrough',label:'Heavy rough',  mult:1.15, note:'Expect a knuckler with no spin. Steeper angle of attack, more club, and plan for it to run out.'},
  {id:'bunker',    label:'Fairway bunker',mult:1.08,note:'Pick it clean, stay tall, feet dug in lightly. Take one more club and swing at 80% — contact matters more than power.'},
  {id:'hardpan',   label:'Hardpan / bare',mult:1.02,note:'Ball comes out low and hot. Play it back, hands ahead, expect significant release.'},
  {id:'straw',     label:'Straw / leaves',mult:1.04,note:'Ball can slip off the face. Hover the club, grip lighter, no digging.'}
];
const SLOPES = [
  {id:'flat',    label:'Flat',           mult:1.00, note:''},
  {id:'uphill',  label:'Uphill lie',     mult:1.06, note:'Adds loft and launch, costs distance. Ball tends to go left — aim right of target.'},
  {id:'downhill',label:'Downhill lie',   mult:0.95, note:'De-lofts the club, lower flight and more roll. Ball tends to leak right — aim left.'},
  {id:'above',   label:'Ball above feet',mult:1.02, note:'Flatter swing plane pulls the ball left. Choke down and aim right.'},
  {id:'below',   label:'Ball below feet',mult:1.04, note:'More upright, ball fades right. Extra knee flex, stay down through it, aim left.'}
];

let bag = [];
let inBagSetupWizard = false;
let bagSetupStep = 'choice'; // 'choice' | 'editing'
let shot = {target:150, elev:0, windDir:'none', windMph:0, lie:'fairway', slope:'flat', tempF:70, alt:900, trouble:'none', mustCarry:false};
let newClubName = '', newClubYards = '', newClubCat = null;
let practiceLog = []; // {id, date, focusKey, focusLabel, note}
let focusExpanded = {}; // {key: bool}
let cachedFocus = []; // computed candidates, refreshed on load/save
let caddieOpenHole = null; // which hole index has the inline Get Club panel open

// Learned yardage PER SWING TYPE: blends stock*swingMult (a prior worth ~3 shots)
// with actual logged shots hit at that specific swing length. Falls back to the
// full-swing learned number scaled by the swing multiplier when a swing bucket
// has no data of its own yet.
function effectiveYardageForSwing(club, swingId){
  const sw = SWINGS.find(s=>s.id===swingId) || SWINGS.find(s=>s.id==='full');
  const allShots = (club.shots||[]).filter(s => s.strike==='flush' || s.strike==='solid');
  const bucketShots = allShots.filter(s => s.swing===swingId);
  const PRIOR = 3;
  if(bucketShots.length){
    let num = club.yards*sw.mult*PRIOR, den = PRIOR;
    const recent = bucketShots.slice(-15);
    recent.forEach((s,i)=>{
      const strikeW = s.strike==='flush' ? 1 : 0.4;
      const recencyW = 0.5 + 0.5*((i+1)/recent.length);
      const w = strikeW*recencyW;
      num += s.neutral*w; den += w;
    });
    return num/den;
  }
  // No data for this swing bucket specifically — fall back to full-swing learned value, scaled.
  return effectiveYardage(club) * sw.mult;
}
// Learned yardage: blends your entered stock number with real logged shots,
// weighting recent + flush strikes highest. Stock acts as a prior worth ~4 shots.
function effectiveYardage(club){
  const shots = (club.shots||[]).filter(s => s.strike==='flush' || s.strike==='solid');
  if(!shots.length) return club.yards;
  const PRIOR = 4;
  let num = club.yards * PRIOR, den = PRIOR;
  const recent = shots.slice(-20);
  recent.forEach((s,i)=>{
    const strikeW = s.strike==='flush' ? 1 : 0.4;
    const recencyW = 0.5 + 0.5*((i+1)/recent.length);
    const w = strikeW * recencyW;
    num += s.neutral * w; den += w;
  });
  return num/den;
}
function clubDispersion(club){
  const shots = (club.shots||[]).filter(s => s.strike==='flush' || s.strike==='solid');
  if(shots.length < 3) return null;
  const v = shots.map(s=>s.neutral);
  const mean = v.reduce((a,b)=>a+b,0)/v.length;
  const sd = Math.sqrt(v.reduce((a,b)=>a+Math.pow(b-mean,2),0)/v.length);
  return {sd, n:v.length};
}
// Chronic short/long bias vs. the number you were actually trying to hit
function clubBias(club){
  const shots = (club.shots||[]).filter(s => typeof s.target === 'number');
  if(shots.length < 3) return null;
  const diffs = shots.map(s => s.actual - s.target);
  return {bias: diffs.reduce((a,b)=>a+b,0)/diffs.length, n:diffs.length};
}
// Average roll-out after landing, so we can estimate carry = neutral - roll
function clubRoll(club){
  const shots = (club.shots||[]).filter(s => typeof s.roll === 'number');
  if(shots.length < 3) return null;
  return {roll: shots.reduce((a,s)=>a+s.roll,0)/shots.length, n:shots.length};
}
// Miss-direction tendency: only counts shots where a direction other than 'center' was logged
function clubDirectionBias(club){
  const shots = (club.shots||[]).filter(s => s.direction);
  if(shots.length < 5) return null;
  const misses = shots.filter(s=>s.direction!=='center');
  if(misses.length < 3) return {n:shots.length, dominant:null};
  const left = misses.filter(s=>s.direction==='left').length;
  const right = misses.filter(s=>s.direction==='right').length;
  const dom = left>right ? 'left' : right>left ? 'right' : null;
  const domPct = dom ? Math.round(Math.max(left,right)/misses.length*100) : 0;
  return {n:shots.length, missN:misses.length, dominant: domPct>=60 ? dom : null, domPct};
}
// Compound pattern: a specific lie tends to produce a specific miss direction/short-long result
function lieShotPattern(lieId){
  let shots = [];
  bag.forEach(c=>(c.shots||[]).forEach(s=>{ if(s.lie===lieId && s.direction) shots.push(s); }));
  if(shots.length < 5) return null;
  const misses = shots.filter(s=>s.direction!=='center');
  if(misses.length < 4) return null;
  const left = misses.filter(s=>s.direction==='left').length;
  const right = misses.filter(s=>s.direction==='right').length;
  const dom = left>right ? 'left' : right>left ? 'right' : null;
  const domPct = dom ? Math.round(Math.max(left,right)/misses.length*100) : 0;
  const shortCount = shots.filter(s=>typeof s.target==='number' && (s.actual-s.target) < -3).length;
  const shortPct = Math.round(shortCount/shots.length*100);
  return {n:shots.length, dominant: domPct>=60?dom:null, domPct, shortPct};
}
function allShotsCount(){
  return bag.reduce((n,c)=>n+((c.shots||[]).length),0);
}

// Condition multiplier for a given swing's trajectory. Wind is the only component
// that's trajectory-dependent — a knockdown ¾ swing flies lower and holds wind better,
// so its wind term is attenuated by the swing's knockdown factor.
function conditionMultiplier(s, swingId){
  const sw = SWINGS.find(x=>x.id===swingId) || {knock:1};
  const lie = LIES.find(l=>l.id===s.lie) || LIES[0];
  const slope = SLOPES.find(l=>l.id===s.slope) || SLOPES[0];
  let m = 1;
  const knock = sw.knock!==undefined ? sw.knock : 1;
  if(s.windDir==='head')      m *= (1 + 0.010*s.windMph*knock);
  else if(s.windDir==='tail') m *= (1 - 0.005*s.windMph*knock);
  else if(s.windDir==='cross')m *= (1 + 0.0015*s.windMph*knock);
  m *= lie.mult;
  m *= slope.mult;
  m *= (1 + 0.0015*(70 - s.tempF));      // cold air = plays longer
  m /= (1 + 0.02*(s.alt/1000));          // altitude = plays shorter
  return m;
}
function computePlaysLike(s, swingId){
  const elevYds = s.elev/3;              // ~1 yard per 3 feet
  const m = conditionMultiplier(s, swingId||'full');
  const pl = (s.target + elevYds) * m;
  const parts = [];
  if(Math.abs(elevYds) >= 1) parts.push(`${s.elev>0?'Uphill':'Downhill'} ${s.elev>0?'+':''}${Math.round(elevYds)}y`);
  if(s.windDir!=='none' && s.windMph>0){
    const sw = SWINGS.find(x=>x.id===(swingId||'full'));
    const knock = sw ? sw.knock : 1;
    const w = (s.windDir==='head' ? 0.010 : s.windDir==='tail' ? -0.005 : 0.0015) * knock;
    parts.push(`${s.windDir==='head'?'Into':s.windDir==='tail'?'Down':'Cross'} ${s.windMph}mph ${w>0?'+':''}${Math.round(s.target*w*s.windMph)}y`);
  }
  const lie = LIES.find(l=>l.id===s.lie);
  if(lie && lie.mult!==1) parts.push(`${lie.label} ${lie.mult>1?'+':''}${Math.round(s.target*(lie.mult-1))}y`);
  const slope = SLOPES.find(l=>l.id===s.slope);
  if(slope && slope.mult!==1) parts.push(`${slope.label} ${slope.mult>1?'+':''}${Math.round(s.target*(slope.mult-1))}y`);
  if(s.tempF!==70) parts.push(`${s.tempF}°F ${s.tempF<70?'+':''}${Math.round(s.target*0.0015*(70-s.tempF))}y`);
  if(s.alt>0) parts.push(`${s.alt}ft alt −${Math.round(s.target*0.02*(s.alt/1000))}y`);
  return {playsLike: pl, parts};
}

function recommendClubs(shotState){
  let opts = [];
  bag.forEach(club=>{
    SWINGS.forEach(sw=>{
      // Half swings are a wedge shot. Three-quarters works for wedges and short irons.
      // Nobody manufactures a half 5-iron, so don't offer one.
      const stockEff = effectiveYardageForSwing(club, sw.id);
      if(sw.id==='half'  && club.cat!=='wedge') return;
      if(sw.id==='three' && !(club.cat==='wedge' || (club.cat==='iron' && stockEff <= 150))) return;
      if(sw.id==='extra' && (club.cat==='wood' || club.cat==='hybrid')) return;

      const y = stockEff;
      const {playsLike} = computePlaysLike(shotState, sw.id);
      const diff = y - playsLike;
      let score = Math.abs(diff)*1.0 + sw.penalty;
      const n = (club.shots||[]).length;
      score += Math.max(0, 3-n) * 1.5;                          // trust well-tested clubs more
      if(shotState.trouble!=='none' && sw.id==='extra') score += 6;  // no hero swings near trouble
      const roll = clubRoll(club);
      const carryY = roll ? y - roll.roll : null;
      if(shotState.mustCarry && carryY!==null){
        if(shotState.trouble==='short' && carryY < playsLike+2) score += 10;
      } else {
        if(shotState.trouble==='short' && diff < 2)  score += 10;
        if(shotState.trouble==='long'  && diff > -2) score += 10;
      }
      opts.push({club, swing:sw, yards:y, diff, score, playsLike, carryY});
    });
  });
  opts.sort((a,b)=>a.score-b.score);
  const seen = new Set(); const out = [];
  for(const o of opts){
    if(seen.has(o.club.name)) continue;
    seen.add(o.club.name); out.push(o);
    if(out.length===3) break;
  }
  return out;
}

function gapAnalysis(){
  const sorted = bag.map(c=>({name:c.name, y:effectiveYardage(c)})).sort((a,b)=>b.y-a.y);
  const flags = [];
  for(let i=0;i<sorted.length-1;i++){
    const gap = sorted[i].y - sorted[i+1].y;
    if(gap > 16) flags.push({type:'hole', text:`${Math.round(gap)}y gap between ${sorted[i].name} and ${sorted[i+1].name} — that's a yardage you can't cover with a full swing.`});
    else if(gap < 6) flags.push({type:'dupe', text:`Only ${Math.round(gap)}y between ${sorted[i].name} and ${sorted[i+1].name} — those two clubs overlap.`});
  }
  return flags;
}

// ---------- Focus engine ----------
const BENCH = { gir:44, putts:32, scrambling:50, threePutt:15, shortPutt:80 };
let cachedFullRounds = [];

function causeToDrill(cause){
  switch(cause){
    case 'penalty': return 'Before your next round, pick the 2 clubs you trust most off the tee on tight driving holes and commit to only those when trouble is in play.';
    case 'shortgame': return 'Run the up-and-down circuit (9 balls: rough / bunker / tight lie, one shot each) twice this week.';
    case 'threeputt': return 'Run the lag putting ladder (30/40/50ft, 5 balls each) twice this week.';
    case 'teeshot': return 'Hit 10 tee shots with 3-wood or hybrid instead of driver and compare the dispersion — a lot of blow-ups start from trouble off the tee.';
    default: return 'Watch for the pattern over your next few rounds — what specifically tends to repeat on these holes?';
  }
}
const BLOWUP_LABELS = {penalty:'penalty/OB', shortgame:'a missed short-game shot', threeputt:'a 3-putt', teeshot:'a bad tee shot', other:'something else'};

function domainsLinked(d1, d2){
  if(d1.startsWith('clubBias:') || d1.startsWith('clubDirection:')){
    const clubId = d1.split(':').slice(1).join(':');
    const club = bag.find(c=>c.id===clubId);
    if(!club) return false;
    if(club.cat==='wedge' && (d2==='shortgame' || d2.startsWith('girBucket:<50') || d2.startsWith('girBucket:50-100'))) return true;
    if(club.cat==='iron' && d2.startsWith('girBucket:')) return true;
    return false;
  }
  if(d1.startsWith('lieDirection:')){
    if(d2==='shortgame' || d2.startsWith('girBucket:')) return true;
    return false;
  }
  return false;
}

function computeFocusCandidates(fullRounds){
  const coldStart = history.length < 8;
  let candidates = [];

  let girByBucket = {}, girHitTotal=0, girAttemptsTotal=0;
  let scrambleHit=0, scrambleAttempts=0;
  let puttsIn10={made:0,total:0}, putts25={threePlus:0,total:0};
  let blowupCounts = {}, blowupTotal = 0;
  let parStats = {3:{n:0,sumToPar:0},4:{n:0,sumToPar:0},5:{n:0,sumToPar:0}};

  fullRounds.forEach(r=>{
    (r.holes||[]).forEach(h=>{
      if(h.gir!==null){
        girAttemptsTotal++;
        if(h.gir==='hit') girHitTotal++;
        if(h.approach){
          girByBucket[h.approach] = girByBucket[h.approach]||{hit:0,total:0};
          girByBucket[h.approach].total++;
          if(h.gir==='hit') girByBucket[h.approach].hit++;
        }
        if(h.gir==='miss' && h.ud!==null){
          scrambleAttempts++;
          if(h.ud==='yes') scrambleHit++;
        }
      }
      if(h.puttDist==='in10'){ puttsIn10.total++; if(h.putts===1) puttsIn10.made++; }
      if(h.puttDist==='25plus'){ putts25.total++; if(h.putts>=3) putts25.threePlus++; }
      if(h.blowup){ blowupTotal++; blowupCounts[h.blowup] = (blowupCounts[h.blowup]||0)+1; }
      if(parStats[h.par]){ parStats[h.par].n++; parStats[h.par].sumToPar += (h.score-h.par); }
    });
  });

  const girOverallPct = girAttemptsTotal? girHitTotal/girAttemptsTotal*100 : null;

  Object.entries(girByBucket).forEach(([bucket,v])=>{
    if(v.total<5) return;
    const pct = v.hit/v.total*100;
    const baseline = coldStart ? BENCH.gir : (girOverallPct!==null?girOverallPct:BENCH.gir);
    const deficit = baseline - pct;
    if(deficit>=12){
      candidates.push({
        key:`girBucket:${bucket}`, tier:'symptom', domain:`girBucket:${bucket}`,
        severity: deficit*Math.sqrt(v.total), n:v.total,
        line:`Approach shots from ${bucket}y are your weak spot — ${Math.round(pct)}% GIR vs ${coldStart?'the':'your own'} ${Math.round(baseline)}% ${coldStart?'benchmark':'average'}.`,
        detail:`Over your last ${fullRounds.length} rounds, you've hit ${v.hit} of ${v.total} greens from ${bucket} yards (${Math.round(pct)}%) — below ${coldStart?'the 44% benchmark for breaking 80':'your own overall GIR rate of '+Math.round(baseline)+'%'}.`,
        drillTitle:`Approach drill — ${bucket}y`,
        drillBody:`Hit 10 balls from ${bucket} yards. Log the carry distance and miss direction for every one — no mulligans.`,
        reassessLabel:`GIR% from ${bucket}y`
      });
    }
  });

  if(scrambleAttempts>=5){
    const pct = scrambleHit/scrambleAttempts*100;
    if(BENCH.scrambling - pct >= 12){
      candidates.push({
        key:'scrambling', tier:'symptom', domain:'shortgame',
        severity:(BENCH.scrambling-pct)*Math.sqrt(scrambleAttempts), n:scrambleAttempts,
        line:`Scrambling is costing you strokes — ${Math.round(pct)}% up-and-down vs a ${BENCH.scrambling}% target.`,
        detail:`You've saved par ${scrambleHit} of ${scrambleAttempts} times you missed the green over your last ${fullRounds.length} rounds (${Math.round(pct)}%). Solid amateur scrambling sits closer to ${BENCH.scrambling}%.`,
        drillTitle:'Up-and-down circuit',
        drillBody:'9 balls around the practice green — 3 from light rough, 3 from a bunker, 3 from a tight fairway lie. One shot each. Count how many finish inside a 6-foot circle.',
        reassessLabel:'Scrambling%'
      });
    }
  }

  if(putts25.total>=5){
    const pct = putts25.threePlus/putts25.total*100;
    if(pct - BENCH.threePutt >= 10){
      candidates.push({
        key:'threePutt', tier:'symptom', domain:'puttingLong',
        severity:(pct-BENCH.threePutt)*Math.sqrt(putts25.total), n:putts25.total,
        line:`Lag putting is leaking strokes — ${Math.round(pct)}% of your 25ft+ putts turn into 3-putts.`,
        detail:`From 25+ feet, ${putts25.threePlus} of your last ${putts25.total} first putts led to a 3-putt (${Math.round(pct)}%) — above the ~${BENCH.threePutt}% you'd expect with decent speed control.`,
        drillTitle:'Lag putting ladder',
        drillBody:'Putt 5 balls from 30, 40, and 50 feet. Count how many finish inside a 3-foot circle. Aim for 4 of 5 at each distance.',
        reassessLabel:'3-putt rate from 25+ feet'
      });
    }
  }

  if(puttsIn10.total>=5){
    const pct = puttsIn10.made/puttsIn10.total*100;
    if(BENCH.shortPutt - pct >= 15){
      candidates.push({
        key:'shortPutt', tier:'symptom', domain:'puttingShort',
        severity:(BENCH.shortPutt-pct)*Math.sqrt(puttsIn10.total), n:puttsIn10.total,
        line:`Short putts aren't dropping — ${Math.round(pct)}% made from inside 10 feet.`,
        detail:`You've holed ${puttsIn10.made} of ${puttsIn10.total} first putts from inside 10 feet (${Math.round(pct)}%), below the ~${BENCH.shortPutt}% mark that separates rounds in the 70s.`,
        drillTitle:'5-foot circuit',
        drillBody:'Putt 10 straight 5-footers in a row. Track makes out of 10. Miss one — start the count back over from 0.',
        reassessLabel:'Make rate from inside 10 feet'
      });
    }
  }

  if(blowupTotal>=3){
    const worst = Object.entries(blowupCounts).sort((a,b)=>b[1]-a[1])[0];
    const [cause,count] = worst;
    const pct = count/blowupTotal*100;
    if(pct>=40){
      const causeLabel = BLOWUP_LABELS[cause]||cause;
      candidates.push({
        key:`blowup:${cause}`, tier:'symptom', domain:`blowup:${cause}`,
        severity: pct*Math.sqrt(blowupTotal)*0.6, n:blowupTotal,
        line:`Your blow-up holes have a pattern — ${causeLabel} is behind ${count} of your last ${blowupTotal}.`,
        detail:`When you card a double-bogey or worse, it traces back to ${causeLabel} ${Math.round(pct)}% of the time over your last ${fullRounds.length} rounds.`,
        drillTitle:`Blow-up prevention — ${causeLabel}`,
        drillBody: causeToDrill(cause),
        reassessLabel:`Frequency of "${causeLabel}" blow-up holes`
      });
    }
  }

  const parEntries = Object.entries(parStats).filter(([,v])=>v.n>=5);
  if(parEntries.length>=2){
    parEntries.forEach(([par,v])=>{
      const others = parEntries.filter(([p])=>p!==par);
      if(!others.length) return;
      const othersAvg = others.reduce((a,[,ov])=>a+ov.sumToPar/ov.n,0)/others.length;
      const thisAvg = v.sumToPar/v.n;
      const gap = thisAvg - othersAvg;
      if(gap>=0.35){
        candidates.push({
          key:`parSplit:${par}`, tier:'symptom', domain:`parSplit:${par}`,
          severity: gap*10*Math.sqrt(v.n), n:v.n,
          line:`Par ${par}s are quietly costing you shots — averaging ${thisAvg>=0?'+':''}${thisAvg.toFixed(1)} vs ${othersAvg>=0?'+':''}${othersAvg.toFixed(1)} elsewhere.`,
          detail:`Across ${v.n} par-${par} holes in your last ${fullRounds.length} rounds, you're averaging ${thisAvg>=0?'+':''}${thisAvg.toFixed(1)} to par — about ${gap.toFixed(1)} strokes worse per hole than your other par types.`,
          drillTitle:`Par ${par} focus`,
          drillBody:`Track your next 5 par-${par} holes specifically — club and result off the tee, and where any miss happens. Look for one repeated mistake.`,
          reassessLabel:`Avg score to par on Par ${par}s`
        });
      }
    });
  }

  bag.forEach(c=>{
    const b = clubBias(c);
    if(b && b.n>=5 && Math.abs(b.bias)>=4){
      candidates.push({
        key:`clubBias:${c.id}`, tier:'root', domain:`clubBias:${c.id}`,
        severity: Math.abs(b.bias)*Math.sqrt(b.n)*0.8, n:b.n,
        line:`Your ${c.name} is running ${b.bias>0?'long':'short'} — averaging ${b.bias>0?'+':''}${b.bias.toFixed(1)}y vs. target.`,
        detail:`Over ${b.n} logged shots, your ${c.name} has averaged ${b.bias>0?'+':''}${b.bias.toFixed(1)} yards vs. the number you aimed at. ${b.bias<0?'Chronically short — the stock number is optimistic.':'Consistently flying it past the target.'}`,
        drillTitle:`${c.name} distance check`,
        drillBody:`Hit 10 ${c.name} shots, flush strikes only. Log actual carry every time — no eyeballing it.`,
        reassessLabel:`${c.name} distance bias`
      });
    }
    const d = clubDirectionBias(c);
    if(d && d.dominant){
      candidates.push({
        key:`clubDirection:${c.id}`, tier:'root', domain:`clubDirection:${c.id}`,
        severity: d.domPct*Math.sqrt(d.missN)*0.5, n:d.missN,
        line:`Your ${c.name} misses ${d.dominant} ${d.domPct}% of the time it misses.`,
        detail:`Across ${d.n} logged ${c.name} shots, ${d.missN} were off-center, and ${d.domPct}% of those missed ${d.dominant}. Worth favoring the opposite side of the target until it's fixed.`,
        drillTitle:`${c.name} start-line drill`,
        drillBody:`Set two alignment sticks as a gate just outside the ball on your target line. Hit 10 balls with your ${c.name} — the ball has to start through the gate. Track how many still miss ${d.dominant}.`,
        reassessLabel:`${c.name} miss direction`
      });
    }
  });

  LIES.forEach(lie=>{
    const p = lieShotPattern(lie.id);
    if(p && p.dominant){
      const shortNote = p.shortPct>=50 ? ` and comes up short ${p.shortPct}% of the time` : '';
      candidates.push({
        key:`lieDirection:${lie.id}`, tier:'root', domain:`lieDirection:${lie.id}`,
        severity: p.domPct*Math.sqrt(p.n)*0.55, n:p.n,
        line:`Shots from ${lie.label.toLowerCase()} consistently miss ${p.dominant}${shortNote}.`,
        detail:`Across ${p.n} logged shots from ${lie.label.toLowerCase()}, misses skew ${p.dominant} ${p.domPct}% of the time${shortNote}. Worth knowing before the shot, not just after.`,
        drillTitle:`${lie.label} lie drill`,
        drillBody:`Drop 9 balls in ${lie.label.toLowerCase()} — one swing each, log carry distance and direction. Compare the pattern to your fairway numbers with the same club.`,
        reassessLabel:`${lie.label} miss tendency`
      });
    }
  });

  candidates.sort((a,b)=>b.severity-a.severity);
  if(!candidates.length) return [];
  // Root-cause candidates take priority over symptom candidates for the #1 slot,
  // regardless of raw severity — that was the explicit call: fix the swing pattern
  // before chasing the scoreboard number it produces.
  const roots = candidates.filter(c=>c.tier==='root');
  const symptoms = candidates.filter(c=>c.tier==='symptom');
  const first = roots.length ? roots[0] : symptoms[0];
  const picked = [first];
  for(const c of candidates){
    if(c===first) continue;
    if(domainsLinked(first.domain, c.domain)) continue;
    picked.push(c);
    break;
  }
  return picked;
}

function computeMetricValue(key, roundsSubset){
  if(key.startsWith('girBucket:')){
    const bucket = key.split(':')[1];
    let hit=0,total=0;
    roundsSubset.forEach(r=>(r.holes||[]).forEach(h=>{ if(h.approach===bucket && h.gir!==null){ total++; if(h.gir==='hit') hit++; } }));
    return total>=1 ? {value:hit/total*100,n:total} : null;
  }
  if(key==='scrambling'){
    let hit=0,total=0;
    roundsSubset.forEach(r=>(r.holes||[]).forEach(h=>{ if(h.gir==='miss' && h.ud!==null){ total++; if(h.ud==='yes') hit++; } }));
    return total>=1?{value:hit/total*100,n:total}:null;
  }
  if(key==='threePutt'){
    let tp=0,total=0;
    roundsSubset.forEach(r=>(r.holes||[]).forEach(h=>{ if(h.puttDist==='25plus'){ total++; if(h.putts>=3) tp++; } }));
    return total>=1?{value:tp/total*100,n:total}:null;
  }
  if(key==='shortPutt'){
    let made=0,total=0;
    roundsSubset.forEach(r=>(r.holes||[]).forEach(h=>{ if(h.puttDist==='in10'){ total++; if(h.putts===1) made++; } }));
    return total>=1?{value:made/total*100,n:total}:null;
  }
  if(key.startsWith('blowup:')){
    const cause = key.split(':')[1];
    let count=0, totalBlow=0;
    roundsSubset.forEach(r=>(r.holes||[]).forEach(h=>{ if(h.blowup){ totalBlow++; if(h.blowup===cause) count++; } }));
    return totalBlow>=1?{value:count/totalBlow*100,n:totalBlow}:null;
  }
  if(key.startsWith('parSplit:')){
    const par = Number(key.split(':')[1]);
    let n=0,sum=0;
    roundsSubset.forEach(r=>(r.holes||[]).forEach(h=>{ if(h.par===par){ n++; sum+=(h.score-h.par); } }));
    return n>=1?{value:sum/n,n}:null;
  }
  return null;
}
function computeClubMetric(key, dateFilterFn){
  if(key.startsWith('clubBias:')){
    const clubId = key.split(':').slice(1).join(':');
    const club = bag.find(c=>c.id===clubId);
    if(!club) return null;
    const shots = (club.shots||[]).filter(s=>typeof s.target==='number' && dateFilterFn(s.date));
    if(!shots.length) return null;
    const diffs = shots.map(s=>s.actual-s.target);
    return {value: diffs.reduce((a,b)=>a+b,0)/diffs.length, n:shots.length};
  }
  if(key.startsWith('clubDirection:') || key.startsWith('lieDirection:')){
    let shots=[];
    if(key.startsWith('clubDirection:')){
      const clubId = key.split(':').slice(1).join(':');
      const club = bag.find(c=>c.id===clubId);
      if(club) shots = (club.shots||[]).filter(s=>s.direction && dateFilterFn(s.date));
    } else {
      const lieId = key.split(':')[1];
      bag.forEach(c=>(c.shots||[]).forEach(s=>{ if(s.lie===lieId && s.direction && dateFilterFn(s.date)) shots.push(s); }));
    }
    if(!shots.length) return null;
    const misses = shots.filter(s=>s.direction!=='center');
    return {value: misses.length/shots.length*100, n:shots.length};
  }
  return null;
}
function beforeAfterFor(key){
  const entries = practiceLog.filter(p=>p.focusKey===key);
  if(!entries.length) return null;
  const firstDate = entries.map(e=>e.date).sort()[0];
  const isClubLevel = key.startsWith('clubBias:') || key.startsWith('clubDirection:') || key.startsWith('lieDirection:');
  if(isClubLevel){
    return {before: computeClubMetric(key, d=>d<firstDate), after: computeClubMetric(key, d=>d>=firstDate), firstDate};
  }
  const beforeRounds = cachedFullRounds.filter(r=>r.date<firstDate);
  const afterRounds = cachedFullRounds.filter(r=>r.date>=firstDate);
  return {before: computeMetricValue(key, beforeRounds), after: computeMetricValue(key, afterRounds), firstDate};
}

// ---------- IndexedDB-backed storage (matches the artifact window.storage shape) ----------
const DB_NAME = 'round-log-db', DB_VERSION = 1, STORE_NAME = 'kv';
let _dbPromise = null;
function openDB(){
  if(_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(STORE_NAME, {keyPath:'key'}); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return _dbPromise;
}
window.storage = {
  async get(key){
    const db = await openDB();
    return new Promise((resolve, reject)=>{
      const req = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).get(key);
      req.onsuccess = ()=> resolve(req.result ? {key: req.result.key, value: req.result.value} : null);
      req.onerror = ()=> reject(req.error);
    });
  },
  async set(key, value){
    const db = await openDB();
    return new Promise((resolve, reject)=>{
      const req = db.transaction(STORE_NAME, 'readwrite').objectStore(STORE_NAME).put({key, value});
      req.onsuccess = ()=> resolve();
      req.onerror = ()=> reject(req.error);
    });
  },
  async delete(key){
    const db = await openDB();
    return new Promise((resolve, reject)=>{
      const req = db.transaction(STORE_NAME, 'readwrite').objectStore(STORE_NAME).delete(key);
      req.onsuccess = ()=> resolve();
      req.onerror = ()=> reject(req.error);
    });
  },
  async list(prefix){
    const db = await openDB();
    return new Promise((resolve, reject)=>{
      const results = [];
      const req = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).openCursor();
      req.onsuccess = e=>{
        const cursor = e.target.result;
        if(cursor){
          if(!prefix || cursor.value.key.startsWith(prefix)) results.push({key: cursor.value.key, value: cursor.value.value});
          cursor.continue();
        } else resolve(results);
      };
      req.onerror = ()=> reject(req.error);
    });
  }
};

function careerStats(hist){
  if(hist.length===0) return null;
  const scores = hist.map(h=>h.score);
  const girs = hist.map(h=>h.girPct);
  const putts = hist.map(h=>h.puttsAvg*18);
  const toPars = hist.map(h=>h.toPar);
  const avg = arr => arr.reduce((a,b)=>a+b,0)/arr.length;
  return {
    rounds: hist.length,
    best: Math.min(...scores),
    bestToPar: toPars[scores.indexOf(Math.min(...scores))],
    avgScore: avg(scores),
    avgGir: Math.round(avg(girs)),
    avgPutts: avg(putts)
  };
}

// ---------- Stat computation ----------
function computeStats(r){
  let totalScore=0, totalPar=0, girHit=0, girAttempts=0, firHit=0, firAttempts=0;
  let putts=0, udHit=0, udAttempts=0;
  let scoreOnGirHit=[], scoreOnGirMiss=[];
  r.holes.forEach(h=>{
    totalScore += Number(h.score)||0;
    totalPar += Number(h.par)||0;
    if(h.gir!==null){
      girAttempts++;
      if(h.gir==='hit'){ girHit++; scoreOnGirHit.push(h.score-h.par); }
      else { scoreOnGirMiss.push(h.score-h.par); if(h.ud!==null){ udAttempts++; if(h.ud==='yes') udHit++; } }
    }
    if(h.par!==3 && h.fir!==null){ firAttempts++; if(h.fir==='hit') firHit++; }
    putts += Number(h.putts)||0;
  });
  const avg = arr => arr.length? (arr.reduce((a,b)=>a+b,0)/arr.length) : null;
  return {
    totalScore, totalPar, toPar: totalScore-totalPar,
    girHit, girAttempts, girPct: girAttempts? Math.round(girHit/girAttempts*100):0,
    firHit, firAttempts, firPct: firAttempts? Math.round(firHit/firAttempts*100):0,
    putts, puttsAvg: (putts/18),
    udHit, udAttempts, udPct: udAttempts? Math.round(udHit/udAttempts*100):0,
    avgOnGirHit: avg(scoreOnGirHit), avgOnGirMiss: avg(scoreOnGirMiss)
  };
}

// Rough, heuristic "where did the strokes go" split — not a rigorous strokes-gained
// model (that needs distance-based PGA baseline tables), just a proportional estimate
// against the same benchmarks used elsewhere, so it's directionally honest, not exact.
function computeStrokesSummary(stats){
  const driving = stats.firAttempts>=3 ? (stats.firPct-60)/100*stats.firAttempts*0.25 : 0;
  const approach = stats.girAttempts>=3 ? (stats.girPct-BENCH.gir)/100*18*0.45 : 0;
  const missedGir = stats.girAttempts - stats.girHit;
  const shortGame = missedGir>0 ? (stats.udPct-BENCH.scrambling)/100*missedGir*0.9 : 0;
  const putting = stats.putts>0 ? (BENCH.putts - stats.putts)*0.85 : 0;
  return {driving, approach, shortGame, putting};
}

function scoreShapeClass(score, par){
  const diff = score - par;
  if(diff<=-2) return 'shape-eagle';
  if(diff===-1) return 'shape-birdie';
  if(diff===0) return 'shape-par';
  if(diff===1) return 'shape-bogey';
  return 'shape-double';
}
function scoreCaption(score,par){
  const diff=score-par;
  if(diff<=-2) return 'Eagle or better';
  if(diff===-1) return 'Birdie';
  if(diff===0) return 'Par';
  if(diff===1) return 'Bogey';
  return diff===2? 'Double bogey' : diff+' over par';
}

// ---------- Insights ----------
function buildInsights(r, stats, hist){
  const holesEntered = r.holes.filter(h=>h.gir!==null).length;
  if(holesEntered < 3){
    return null;
  }
  const insights = [];

  // GIR vs break-80 benchmark
  const girTarget = 8;
  if(stats.girAttempts>0){
    if(stats.girHit < girTarget){
      insights.push(`You've hit <b>${stats.girHit} of ${stats.girAttempts}</b> greens so far (${stats.girPct}%). Rounds in the 70s tend to average around <b>8 of 18</b> — you need roughly ${Math.max(girTarget-stats.girHit,0)} more today to hit that pace.`);
    } else {
      insights.push(`You're at <b>${stats.girHit} of ${stats.girAttempts}</b> greens (${stats.girPct}%) — right in the range that supports scores in the 70s. Keep feeding approach shots.`);
    }
  }

  // Putts benchmark
  if(stats.putts>0){
    const projected = Math.round(stats.puttsAvg*18);
    if(projected>32){
      insights.push(`You're averaging <b>${stats.puttsAvg.toFixed(1)} putts/hole</b>, projecting to about <b>${projected} for 18</b>. Breaking 80 usually means getting closer to <b>31-32 total putts</b>.`);
    } else {
      insights.push(`Your putting pace (<b>~${projected} for 18</b>) is already inside the range that supports low-80s/70s scoring.`);
    }
  }

  // The correlation the user is looking for: GIR vs actual scoring result
  if(stats.avgOnGirHit!==null && stats.avgOnGirMiss!==null){
    const gap = (stats.avgOnGirMiss - stats.avgOnGirHit);
    insights.push(`Here's the correlation: when you hit the green, you're averaging <b>${stats.avgOnGirHit>=0?'+':''}${stats.avgOnGirHit.toFixed(1)} to par</b> on that hole. When you miss it, you're averaging <b>${stats.avgOnGirMiss>=0?'+':''}${stats.avgOnGirMiss.toFixed(1)} to par</b> — a <b>${gap.toFixed(1)}-stroke gap</b>. That gap is your scrambling tax.`);
  }

  // Scrambling
  if(stats.udAttempts>=2){
    insights.push(`Scrambling: you've saved par <b>${stats.udHit} of ${stats.udAttempts}</b> times you missed the green (${stats.udPct}%). Tour average is around 50-60%.`);
  }

  // FIR correlation to GIR
  if(stats.firAttempts>=3){
    const firHoles = r.holes.filter(h=>h.par!==3 && h.fir!==null);
    const hitFir = firHoles.filter(h=>h.fir==='hit');
    const missFir = firHoles.filter(h=>h.fir==='miss');
    const girRate = arr => arr.length? Math.round(arr.filter(h=>h.gir==='hit').length/arr.length*100):null;
    const g1=girRate(hitFir), g2=girRate(missFir);
    if(g1!==null && g2!==null){
      insights.push(`When you find the fairway, your GIR rate is <b>${g1}%</b>. When you miss it, that drops to <b>${g2}%</b>. ${g1-g2>=15?'Driving accuracy is clearly feeding your approach game today.':'The gap is smaller than most golfers assume — your irons may matter more than the driver right now.'}`);
    }
  }

  // Approach distance pattern
  const distBuckets = {};
  r.holes.forEach(h=>{
    if(h.approach && h.gir!==null){
      distBuckets[h.approach] = distBuckets[h.approach]||{hit:0,total:0};
      distBuckets[h.approach].total++;
      if(h.gir==='hit') distBuckets[h.approach].hit++;
    }
  });
  const bucketEntries = Object.entries(distBuckets).filter(([,v])=>v.total>=2);
  if(bucketEntries.length){
    let worst = bucketEntries.reduce((a,b)=> (a[1].hit/a[1].total) < (b[1].hit/b[1].total) ? a : b);
    const pct = Math.round(worst[1].hit/worst[1].total*100);
    if(pct<50){
      insights.push(`Your weakest approach range today is <b>${worst[0]} yards</b> — only ${pct}% GIR from there. That's worth range time this week.`);
    }
  }

  // Cross-round trend
  if(hist.length>=2){
    const recent = hist.slice(0,3);
    const girTrend = recent.map(x=>x.girPct);
    const puttsTrend = recent.map(x=>x.puttsAvg);
    if(girTrend.length>=2){
      const delta = girTrend[0]-girTrend[girTrend.length-1];
      insights.push(`Across your last ${girTrend.length} saved rounds, GIR% has ${delta>0?'improved':delta<0?'dropped':'held steady'} (${girTrend.slice().reverse().join('% → ')}%).`);
    }
  }

  return insights;
}

  const stats = computeStats(round);

// ---------- My Bag ----------
function renderClubRows(){
  const sorted = [...bag].sort((a,b)=>effectiveYardage(b)-effectiveYardage(a));
  return sorted.map(c=>{
    const eff = effectiveYardage(c);
    const disp = clubDispersion(c);
    const drift = eff - c.yards;
    return `
    <div class="bag-row">
      <div class="bn">${escapeHtml(c.name)}</div>
      <input class="by" type="number" inputmode="numeric" data-clubyards="${escapeHtml(c.id)}" value="${c.yards}">
      <div class="beff">
        ${(c.shots||[]).length ? `${Math.round(eff)}y real<br>${Math.abs(drift)>=2?`${drift>0?'+':''}${Math.round(drift)} drift`:'on stock'}${disp?`<br>±${Math.round(disp.sd)}`:''}` : `<span style="color:var(--line-strong)">no data</span>`}
      </div>
      <button class="brm" data-removeclub="${escapeHtml(c.id)}">&times;</button>
    </div>`;
  }).join('');
}
function renderAddClubForm(){
  return `
    <div class="bag-add">
      <input id="newClubName" placeholder="Club name" value="${escapeHtml(newClubName)}">
      <input id="newClubYards" class="num" type="number" inputmode="numeric" placeholder="Yds" value="${escapeHtml(String(newClubYards))}">
    </div>
    <div class="field" style="margin-top:8px;">
      <span class="field-label">Category</span>
      <div class="btn-row" id="newClubCatRow" style="gap:6px;">
        ${CLUB_CATS.map(cc=>`<button data-newclubcat="${cc.id}" class="${newClubCat===cc.id?'sel':''}" style="flex:0 0 auto;padding:8px 10px;font-size:12px;">${cc.label}</button>`).join('')}
      </div>
    </div>
    <button class="save-btn" id="addClubBtn" style="margin-top:8px;">Add Club</button>
  `;
}
function wireClubListHandlers(){
  document.querySelectorAll('[data-clubyards]').forEach(inp=>inp.onchange = async ()=>{
    const c = bag.find(x=>x.id===inp.dataset.clubyards);
    if(c){ c.yards = Number(inp.value)||c.yards; await saveBag(); render(); }
  });
  document.querySelectorAll('[data-removeclub]').forEach(b=>b.onclick = async ()=>{
    const c = bag.find(x=>x.id===b.dataset.removeclub);
    if(c && confirm(`Remove ${c.name} from your bag?`)){
      bag = bag.filter(x=>x.id!==b.dataset.removeclub);
      await saveBag(); await refreshFocus(); render();
    }
  });
  const nn = document.getElementById('newClubName');
  if(nn) nn.oninput = e => newClubName = e.target.value;
  const ny = document.getElementById('newClubYards');
  if(ny) ny.oninput = e => newClubYards = e.target.value;
  document.querySelectorAll('[data-newclubcat]').forEach(b=>b.onclick = ()=>{
    newClubCat = b.dataset.newclubcat; render();
  });
  const addBtn = document.getElementById('addClubBtn');
  if(addBtn) addBtn.onclick = async ()=>{
    if(!newClubName.trim() || !Number(newClubYards) || !newClubCat) return;
    const nm = newClubName.trim();
    bag.push({id: nm+'-'+Date.now(), name:nm, yards:Number(newClubYards), cat:newClubCat, shots:[]});
    newClubName=''; newClubYards=''; newClubCat=null;
    await saveBag(); render();
  };
}

function renderBagView(){
  const flags = gapAnalysis();
  const sorted = [...bag].sort((a,b)=>effectiveYardage(b)-effectiveYardage(a));
  const wedges = sorted.filter(c=>c.cat==='wedge' || c.cat==='iron').slice(-6);
  const shotCount = allShotsCount();
  return `
    <div class="home-section-title">Your Clubs — stock yardage, and what the data says</div>
    <section style="padding-top:4px;">
      ${renderClubRows()}
      ${renderAddClubForm()}
      <div class="na-note">Yellow column is your <b>learned</b> yardage — it blends the number you typed with every shot you've logged, weighting recent and flush strikes highest. Drift shows how far reality has moved from your original guess.</div>
    </section>

    <div class="home-section-title">Gapping Check</div>
    <section style="padding-top:2px;">
      ${flags.length
        ? flags.map(f=>`<div class="gap-flag">${f.text}</div>`).join('')
        : `<div class="gap-flag ok">Your gaps are even top to bottom — no dead yardages and no redundant clubs.</div>`}
    </section>

    <div class="home-section-title">Partial Swing Matrix — learned per swing, not just multiplied</div>
    <div class="ledger-wrap">
      <table class="matrix">
        <thead><tr><th style="text-align:left;">Club</th><th>½</th><th>¾</th><th>Full</th><th>Extra</th></tr></thead>
        <tbody>
          ${wedges.map(c=>{
            return `<tr>
              <td class="cname">${escapeHtml(c.name)}</td>
              ${SWINGS.map(s=>{
                const hasData = (c.shots||[]).some(sh=>sh.swing===s.id && (sh.strike==='flush'||sh.strike==='solid'));
                const y = effectiveYardageForSwing(c, s.id);
                return `<td${s.id==='full'?' style="font-weight:600;color:var(--green-deep)"':''}>${Math.round(y)}${hasData?'<span class="data-star">●</span>':''}</td>`;
              }).join('')}
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      <div class="na-note">● marks a swing length you've actually logged shots for — those numbers are real, not just multiplied from your full-swing yardage. Memorize the ¾ column for your wedges and you stop having to manufacture half-shots on the fly.</div>
    </div>

    <div class="home-section-title">Calibration Status</div>
    <section style="padding-top:2px;">
      <div class="insights-panel" style="margin:0;">
        ${shotCount===0
          ? `<div class="empty">No shots logged yet. Log a few from the Caddie tab and these numbers start correcting themselves.</div>`
          : `<ul>
              <li><b>${shotCount}</b> shot${shotCount===1?'':'s'} logged across ${bag.filter(c=>(c.shots||[]).length).length} club${bag.filter(c=>(c.shots||[]).length).length===1?'':'s'}.</li>
              ${bag.filter(c=>clubBias(c)).map(c=>{
                const b = clubBias(c);
                return `<li><b>${escapeHtml(c.name)}</b>: averaging <b>${b.bias>0?'+':''}${b.bias.toFixed(1)} yards</b> vs. the number you aimed at over ${b.n} shots. ${b.bias < -4 ? 'You are chronically short with this club — the stock number is optimistic.' : b.bias > 4 ? 'You are consistently flying this one past the target.' : 'Well calibrated.'}</li>`;
              }).join('')}
              ${bag.filter(c=>clubDirectionBias(c) && clubDirectionBias(c).dominant).map(c=>{
                const d = clubDirectionBias(c);
                return `<li><b>${escapeHtml(c.name)}</b>: misses <b>${d.dominant}</b> ${d.domPct}% of the time it misses (${d.n} shots logged).</li>`;
              }).join('')}
              ${bag.filter(c=>clubRoll(c)).map(c=>{
                const r = clubRoll(c);
                const eff = effectiveYardage(c);
                return `<li><b>${escapeHtml(c.name)}</b>: averaging <b>${Math.round(r.roll)}y of roll</b> after landing — estimated carry ~${Math.round(eff-r.roll)}y vs. total ~${Math.round(eff)}y.</li>`;
              }).join('')}
            </ul>`}
      </div>
      <button class="save-btn" id="resetBagBtn" style="background:var(--paper-raised);color:var(--red);border:1px solid var(--line-strong);margin-top:12px;">Clear &amp; Rebuild Bag</button>
    </section>
  `;
}

  }
  const girSeries = history.slice(0,10).reverse().map(h=>h.girPct);

  return `

      ${history.map(h=>`
        <div class="round-card">
          <div class="rc-left">
