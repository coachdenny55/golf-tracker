function sparkline(values, min, max, invert){
  if(values.length<2) return `<div class="na-note">Save a couple more rounds to see a trend line.</div>`;
  const w=280,h=60,pad=6;
  const norm = v => h-pad - ((v-min)/(max-min))*(h-2*pad);
  const step = (w-2*pad)/(values.length-1);
  const pts = values.map((v,i)=>`${pad+i*step},${norm(v)}`).join(' ');
  const color = invert ? '#A8402C' : '#1F3D2E';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="max-width:100%;">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${values.map((v,i)=>`<circle cx="${pad+i*step}" cy="${norm(v)}" r="2.5" fill="${color}"/>`).join('')}
  </svg>`;
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- Event handling ----------
function attachHandlers(){
  if(inBagSetupWizard){
    const qs = document.getElementById('setupQuickStart');
    if(qs) qs.onclick = async ()=>{
      bag = BAG_PRESET.map(c=>({...c, id:c.name, shots:[]}));
      bagSetupStep = 'editing';
      await saveBag(); render();
    };
    const bo = document.getElementById('setupBuildOwn');
    if(bo) bo.onclick = async ()=>{
      bag = [];
      bagSetupStep = 'editing';
      await saveBag(); render();
    };
    const finish = document.getElementById('finishBagSetup');
    if(finish) finish.onclick = ()=>{
      inBagSetupWizard = false;
      activeTab = 'home';
      render();
    };
    wireClubListHandlers();
    return;
  }

  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab; render();});

  const courseInput = document.getElementById('courseInput');
  if(courseInput) courseInput.oninput = e => round.course = e.target.value;
  const dateInput = document.getElementById('dateInput');
  if(dateInput) dateInput.oninput = e => round.date = e.target.value;
  const slopeInput = document.getElementById('slopeInput');
  if(slopeInput) slopeInput.oninput = e => round.slope = e.target.value;
  const ratingInput = document.getElementById('ratingInput');
  if(ratingInput) ratingInput.oninput = e => round.rating = e.target.value;

  if(activeTab==='home'){
    const goNew = document.getElementById('goNewRound');
    if(goNew) goNew.onclick = ()=>{
      if(!roundInProgress){ roundStartStep = 'selectCourse'; }
      activeTab = 'round';
      render();
    };
    const goCad = document.getElementById('goCaddie');
    if(goCad) goCad.onclick = ()=>{ activeTab='caddie'; render(); };
    const goBag = document.getElementById('goBag');
    if(goBag) goBag.onclick = ()=>{ activeTab='bag'; render(); };
    const goHist = document.getElementById('goHistory');
    if(goHist) goHist.onclick = ()=>{ activeTab='history'; render(); };
    const viewAll = document.getElementById('viewAllLink');
    if(viewAll) viewAll.onclick = ()=>{ activeTab='history'; render(); };
    document.querySelectorAll('[data-focustoggle]').forEach(el=>el.onclick=()=>{
      const k = el.dataset.focustoggle;
      focusExpanded[k] = !focusExpanded[k];
      render();
    });
    document.querySelectorAll('[data-logpractice]').forEach(btn=>btn.onclick = async ()=>{
      const key = btn.dataset.logpractice;
      const label = btn.dataset.focuslabel;
      const noteInput = document.getElementById('practiceNote-'+key);
      const note = noteInput ? noteInput.value : '';
      btn.textContent = 'Saving…';
      await logPracticeEntry(key, label, note);
      render();
    });
    return;
  }

  if(activeTab==='history'){
    document.querySelectorAll('[data-delid]').forEach(b=>b.onclick = (e)=>{
      e.stopPropagation();
      deleteRound(b.dataset.delid);
    });
    return;
  }

  if(activeTab==='bag'){
    wireClubListHandlers();
    const resetBtn = document.getElementById('resetBagBtn');
    if(resetBtn) resetBtn.onclick = async ()=>{
      if(!confirm('Clear your bag and start over? All logged shot data will be erased.')) return;
      bag = [];
      inBagSetupWizard = true;
      bagSetupStep = 'choice';
      await refreshFocus(); render();
    };
    return;
  }

  if(activeTab==='caddie'){
    const ti = document.getElementById('targetInput');
    if(ti){ ti.oninput = e => shot.target = Number(e.target.value)||0; ti.onchange = ()=>render(); }
    document.querySelectorAll('[data-tstep]').forEach(b=>b.onclick = ()=>{
      shot.target = Math.max(1, shot.target + Number(b.dataset.tstep)); render();
    });
    document.querySelectorAll('[data-lie]').forEach(b=>b.onclick=()=>{ shot.lie=b.dataset.lie; render(); });
    document.querySelectorAll('[data-slope]').forEach(b=>b.onclick=()=>{ shot.slope=b.dataset.slope; render(); });
    document.querySelectorAll('[data-winddir]').forEach(b=>b.onclick=()=>{
      shot.windDir=b.dataset.winddir;
      if(shot.windDir==='none') shot.windMph=0;
      else if(shot.windMph===0) shot.windMph=10;
      render();
    });
    document.querySelectorAll('[data-windmph]').forEach(b=>b.onclick=()=>{ shot.windMph=Number(b.dataset.windmph); render(); });
    document.querySelectorAll('[data-elev]').forEach(b=>b.onclick=()=>{ shot.elev=Number(b.dataset.elev); render(); });
    document.querySelectorAll('[data-trouble]').forEach(b=>b.onclick=()=>{ shot.trouble=b.dataset.trouble; if(shot.trouble!=='short') shot.mustCarry=false; render(); });
    document.querySelectorAll('[data-mustcarry]').forEach(b=>b.onclick=()=>{ shot.mustCarry=!shot.mustCarry; render(); });

    const tempI = document.getElementById('tempInput');
    if(tempI) tempI.onchange = async e => { shot.tempF = Number(e.target.value)||70; await saveSettings(); render(); };
    const altI = document.getElementById('altInput');
    if(altI) altI.onchange = async e => { shot.alt = Number(e.target.value)||0; await saveSettings(); render(); };

    document.querySelectorAll('[data-logswing]').forEach(b=>b.onclick=()=>{ window._logSwing=b.dataset.logswing; render(); });
    document.querySelectorAll('[data-logstrike]').forEach(b=>b.onclick=()=>{ window._logStrike=b.dataset.logstrike; render(); });
    document.querySelectorAll('[data-logdir]').forEach(b=>b.onclick=()=>{ window._logDir=b.dataset.logdir; render(); });

    const logBtn = document.getElementById('logShotBtn');
    if(logBtn) logBtn.onclick = async ()=>{
      const clubId = document.getElementById('logClub').value;
      const actual = Number(document.getElementById('logDist').value);
      const rollVal = document.getElementById('logRoll').value;
      const msg = document.getElementById('logMsg');
      if(!clubId || !actual){ msg.textContent = 'Pick a club and enter how far it finished.'; return; }
      const club = bag.find(c=>c.id===clubId);
      const swingId = window._logSwing || 'full';
      const sw = SWINGS.find(s=>s.id===swingId);
      const strike = window._logStrike || 'flush';
      const direction = window._logDir || 'center';

      // Strip today's conditions back out to recover the neutral-condition yardage,
      // then divide out the swing length to get a comparable full-swing number.
      const m = conditionMultiplier(shot, swingId);
      const neutralAtSwing = (actual + shot.elev/3) * m;
      const neutral = neutralAtSwing / sw.mult;

      club.shots = club.shots || [];
      club.shots.push({
        date: new Date().toISOString().slice(0,10),
        swing: swingId, strike, direction, lie: shot.lie,
        target: shot.target, actual, neutral,
        roll: rollVal!=='' ? Number(rollVal) : undefined
      });
      if(club.shots.length > 40) club.shots = club.shots.slice(-40);
      await saveBag();
      await refreshFocus();
      const before = club.yards;
      const after = effectiveYardageForSwing(club, swingId);
      msg.innerHTML = `Logged. Neutral-condition value for that swing: <b>${Math.round(neutral)}y</b>. ${club.name} ${sw.label} learned yardage is now <b>${Math.round(after)}y</b>.`;
      document.getElementById('logDist').value = '';
      document.getElementById('logRoll').value = '';
      window._logDir = 'center';
      render();
    };
    return;
  }

  if(activeTab==='round' && roundStartStep==='selectCourse'){
    const ff = document.getElementById('startFreeformRound');
    if(ff) ff.onclick = ()=>{
      round = newRound();
      currentHole = 0;
      roundStartStep = null;
      render();
    };
    document.querySelectorAll('[data-starttee]').forEach(b=>b.onclick = async ()=>{
      const [courseId, teeIdxStr] = b.dataset.starttee.split(':');
      const teeIdx = Number(teeIdxStr);
      try{
        const res = await window.storage.get('course:'+courseId);
        if(!res || !res.value) return;
        const course = JSON.parse(res.value);
        const tee = course.tees[teeIdx];
        if(!tee) return;
        round = newRound();
        round.course = course.name;
        round.courseId = course.id;
        round.teeId = tee.id;
        round.holes = tee.holes.map(h=>({...blankHole(h.par), refYardage: h.yardage}));
        currentHole = 0;
        roundStartStep = null;
        render();
      }catch(e){ console.error('failed to load course', e); }
    });
    return;
  }

  if(activeTab==='courses'){
    if(courseEditor){
      const nameInput = document.getElementById('courseEditorName');
      if(nameInput) nameInput.oninput = e => courseEditor.name = e.target.value;
      document.querySelectorAll('[data-teelabel]').forEach(inp=>inp.oninput = e=>{
        courseEditor.tees[Number(inp.dataset.teelabel)].label = e.target.value;
      });
      document.querySelectorAll('[data-removetee]').forEach(b=>b.onclick = ()=>{
        courseEditor.tees.splice(Number(b.dataset.removetee), 1);
        render();
      });
      document.querySelectorAll('[data-holepar]').forEach(sel=>sel.onchange = ()=>{
        const [ti, hi] = sel.dataset.holepar.split(':').map(Number);
        courseEditor.tees[ti].holes[hi].par = Number(sel.value);
      });
      document.querySelectorAll('[data-holeyardage]').forEach(inp=>inp.oninput = ()=>{
        const [ti, hi] = inp.dataset.holeyardage.split(':').map(Number);
        courseEditor.tees[ti].holes[hi].yardage = inp.value!=='' ? Number(inp.value) : null;
      });
      const addTee = document.getElementById('addTeeSetBtn');
      if(addTee) addTee.onclick = ()=>{
        courseEditor.tees.push({id:'tee-'+Date.now(), label:'', holes: blankCourseHoles()});
        render();
      };
      const saveBtn = document.getElementById('saveCourseBtn');
      if(saveBtn) saveBtn.onclick = async ()=>{
        if(!courseEditor.name.trim()){ alert('Give the course a name first.'); return; }
        const fullCourse = {
          id: courseEditor.id || ('course-'+Date.now()),
          name: courseEditor.name.trim(),
          tees: courseEditor.tees.map(t=>({...t, label: t.label.trim()}))
        };
        await saveCourseToStorage(fullCourse);
        courseEditor = null;
        render();
      };
      const cancelBtn = document.getElementById('cancelCourseEditorBtn');
      if(cancelBtn) cancelBtn.onclick = ()=>{ courseEditor = null; render(); };
      return;
    }
    const addCourse = document.getElementById('addCourseBtn');
    if(addCourse) addCourse.onclick = ()=>{
      courseEditor = {id:null, name:'', tees:[{id:'tee-'+Date.now(), label:'', holes: blankCourseHoles()}]};
      render();
    };
    document.querySelectorAll('[data-editcourse]').forEach(b=>b.onclick = async ()=>{
      try{
        const res = await window.storage.get('course:'+b.dataset.editcourse);
        if(res && res.value) courseEditor = JSON.parse(res.value);
        render();
      }catch(e){ console.error('failed to load course', e); }
    });
    document.querySelectorAll('[data-delcourse]').forEach(b=>b.onclick = (e)=>{
      e.stopPropagation();
      deleteCourse(b.dataset.delcourse);
    });
    return;
  }

  if(activeTab!=='round' || roundStartStep) return;

  const h = round.holes[currentHole];

  const prevBtn = document.getElementById('prevHole');
  if(prevBtn) prevBtn.onclick = ()=>{ if(currentHole>0){currentHole--; render();} };
  const nextBtn = document.getElementById('nextHole');
  if(nextBtn) nextBtn.onclick = ()=>{ if(currentHole<17){currentHole++; render();} };

  document.getElementById('scoreUp').onclick = ()=>{ h.score = Math.min(h.score+1,12); roundInProgress=true; render(); };
  document.getElementById('scoreDown').onclick = ()=>{ h.score = Math.max(h.score-1,1); roundInProgress=true; render(); };

  document.querySelectorAll('#parRow button').forEach(b=>b.onclick=()=>{
    h.par = Number(b.dataset.par);
    if(h.par===3){ h.fir=null; }
    roundInProgress=true;
    render();
  });
  const firRow = document.getElementById('firRow');
  if(firRow) firRow.querySelectorAll('button').forEach(b=>b.onclick=()=>{ h.fir = b.dataset.fir; roundInProgress=true; render(); });

  document.querySelectorAll('#approachRow button').forEach(b=>b.onclick=()=>{ h.approach = b.dataset.approach; roundInProgress=true; render(); });

  const ayInput = document.getElementById('approachYardsInput');
  if(ayInput) ayInput.onchange = e => {
    const v = Number(e.target.value);
    h.approachYards = e.target.value==='' ? null : v;
    if(h.approachYards!=null) h.approach = approachBucketFromYards(h.approachYards);
    roundInProgress=true;
    render();
  };
  const getClubBtn = document.getElementById('getClubBtn');
  if(getClubBtn) getClubBtn.onclick = ()=>{ caddieOpenHole = currentHole; render(); };
  const closeInline = document.getElementById('closeInlineCaddie');
  if(closeInline) closeInline.onclick = ()=>{ caddieOpenHole = null; render(); };
  document.querySelectorAll('[data-inlielie]').forEach(b=>b.onclick=()=>{ shot.lie=b.dataset.inlielie; render(); });
  document.querySelectorAll('[data-inlietrouble]').forEach(b=>b.onclick=()=>{ shot.trouble=b.dataset.inlietrouble; render(); });
  document.querySelectorAll('[data-userec]').forEach(b=>b.onclick=()=>{
    const recs = recommendClubs(shot);
    const r = recs[Number(b.dataset.userec)];
    if(r){
      h.club = r.club.name;
      h.recClub = r.club.name;
      h.recSwing = r.swing.label;
      h.followedRec = true;
    }
    caddieOpenHole = null;
    roundInProgress = true;
    render();
  });

  const blowupRow = document.getElementById('blowupRow');
  if(blowupRow) blowupRow.querySelectorAll('button').forEach(b=>b.onclick=()=>{ h.blowup = b.dataset.blowup; roundInProgress=true; render(); });

  const clubSelect = document.getElementById('clubSelect');
  if(clubSelect) clubSelect.onchange = e => {
    h.club = e.target.value;
    if(h.recClub){ h.followedRec = (e.target.value === h.recClub); }
    roundInProgress=true;
  };

  document.querySelectorAll('#girRow button').forEach(b=>b.onclick=()=>{
    h.gir = b.dataset.gir;
    if(h.gir==='hit') h.ud=null;
    roundInProgress=true;
    render();
  });
  const udRow = document.getElementById('udRow');
  if(udRow) udRow.querySelectorAll('button').forEach(b=>b.onclick=()=>{ h.ud = b.dataset.ud; roundInProgress=true; render(); });

  document.querySelectorAll('#puttsRow button').forEach(b=>b.onclick=()=>{ h.putts = Number(b.dataset.putts); roundInProgress=true; render(); });
  const puttDistRow = document.getElementById('puttDistRow');
  if(puttDistRow) puttDistRow.querySelectorAll('button').forEach(b=>b.onclick=()=>{ h.puttDist = b.dataset.puttdist; roundInProgress=true; render(); });

  document.querySelectorAll('[data-jump]').forEach(row=>row.onclick=()=>{ currentHole = Number(row.dataset.jump); caddieOpenHole=null; render(); });

  const saveBtn = document.getElementById('saveRoundBtn');
  if(saveBtn) saveBtn.onclick = async ()=>{
    const stats = computeStats(round);
    const id = Date.now().toString();
    const summary = {
      id, course: round.course, date: round.date, slope: round.slope, rating: round.rating,
      courseId: round.courseId,
      score: stats.totalScore, toPar: stats.toPar,
      girPct: stats.girPct, puttsAvg: stats.puttsAvg
    };
    saveBtn.textContent = 'Saving…';
    await saveRoundToStorage(summary, round);

    // Freeform rounds (no saved course tied to them) already have par for
    // every hole entered — offer to turn that into a reusable course template.
    const offerCourseSave = !round.courseId;
    const prefillName = round.course;
    const prefillHoles = round.holes.map(hh=>({par:hh.par, yardage:null}));

    round = newRound();
    currentHole = 0;
    caddieOpenHole = null;
    roundInProgress = false;

    if(offerCourseSave && confirm('Save this course\'s pars for next time?')){
      courseEditor = {id:null, name: prefillName, tees:[{id:'tee-'+Date.now(), label:'', holes: prefillHoles}]};
      activeTab = 'courses';
    } else {
      activeTab = 'home';
    }
    render();
    await refreshFocus();
    render();
  };
}

loadHistory();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', {updateViaCache:'none'})
      .then(reg => console.log('Round Log SW registered:', reg.scope))
      .catch(err => console.warn('Round Log SW registration failed:', err));
  });
}
</script>
</body>
</html>
