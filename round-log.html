<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Round Log">
<meta name="theme-color" content="#1F3D2E">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Round Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2EEE2;
    --paper-raised:#FBF9F2;
    --line:#D8D2BE;
    --line-strong:#B9B29A;
    --ink:#26261F;
    --ink-soft:#5B5A4E;
    --green-deep:#1F3D2E;
    --green-mid:#3F6B4F;
    --green-pale:#DCE6DC;
    --red:#A8402C;
    --red-pale:#F1DAD3;
    --gold:#A6822F;
    --gold-pale:#EFE4C4;
    --radius:10px;
    /* Four bands, light to dark, matching what the tap classifier actually
       reports: green -> fairway -> first cut -> heavy rough (the background). */
    --turf-green:#CFE3A6; --turf-green-edge:#9FBE74;
    /* The fringe is a SHADE OF FAIRWAY, not a lie of its own — it is drawn
       strictly inside the fairway's rounded mouth so it never straddles the
       fairway/first-cut boundary (see GREEN_FRINGE_YARDS). */
    --turf-fringe:#C0D89B;
    --turf-fairway:#A9C486; --turf-fairway-edge:#8AAB69;
    --turf-firstcut:#7E9C61;
    --turf-rough:#4E6B41;
    --turf-tee:#EFE4C4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--paper), var(--paper)),
      repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(31,61,46,0.035) 28px);
    background-color:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .app{max-width:480px;margin:0 auto;padding:0 0 40px;}

  /* Masthead */
  header.mast{
    position:relative;
    background:var(--green-deep);
    color:var(--paper-raised);
    padding:20px 20px 16px;
    border-bottom:4px solid var(--gold);
  }
  .ham-btn{
    position:absolute;
    top:18px; right:16px;
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.25);
    border-radius:6px;
    color:var(--paper-raised);
    font-size:17px;
    line-height:1;
    cursor:pointer;
  }
  .ham-overlay{
    position:fixed; inset:0; z-index:999;
    display:none;
  }
  .ham-overlay.on{ display:block; }
  .ham-dim{
    position:absolute; inset:0;
    background:rgba(24,30,26,0.45);
  }
  .ham-panel{
    position:absolute; top:0; right:0; bottom:0;
    width:78%; max-width:300px;
    background:var(--paper-raised);
    box-shadow:-6px 0 24px rgba(0,0,0,0.25);
    display:flex; flex-direction:column;
    overflow-y:auto;
  }
  .ham-hdr{
    padding:20px;
    background:var(--green-deep);
    border-bottom:4px solid var(--gold);
  }
  .ham-hdr .ht{
    font-family:'Fraunces',serif;
    font-size:20px; font-weight:600;
    color:var(--paper-raised);
  }
  .ham-item{
    padding:15px 20px;
    font-family:'Inter',sans-serif;
    font-size:14px; font-weight:500;
    color:var(--ink);
    cursor:pointer;
    border-bottom:1px solid var(--line);
  }
  .ham-item:active{ background:var(--paper); }
  .ham-version{
    margin-top:auto;
    padding:14px 20px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--ink-soft);
    text-align:center;
  }
  header.mast .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold-pale);
    opacity:0.85;
  }
  header.mast h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:30px;
    margin:2px 0 12px;
    letter-spacing:-0.01em;
  }
  .mast-row{display:flex;gap:10px;}
  .mast-input{
    flex:1;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.25);
    border-radius:6px;
    color:var(--paper-raised);
    padding:8px 10px;
    font-family:'Inter',sans-serif;
    font-size:13px;
  }
  .mast-input::placeholder{color:rgba(251,249,242,0.5);}

  /* Compact masthead — shown instead of the full header while a round is
     actively being played, so the hole diagram gets its vertical space back
     instead of losing it to the headline and course/date/slope inputs you
     only ever touch once, at round start. */
  header.mast.mast-compact{
    padding:14px 46px 14px 16px;
    display:flex; align-items:center; min-height:0;
  }
  header.mast.mast-compact .ham-btn{ top:13px; }
  header.mast.mast-compact .mc-info{
    flex:1; min-width:0;
    font-family:'Fraunces',serif; font-weight:600; font-size:15.5px;
    color:var(--paper-raised); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  header.mast.mast-compact .mc-info .mc-date{
    font-family:'IBM Plex Mono',monospace; font-weight:500; font-size:11px;
    color:var(--gold-pale); opacity:0.85;
  }

  /* Tabs */
  nav.tabs{
    display:flex;
    border-bottom:1px solid var(--line-strong);
    background:var(--paper-raised);
  }
  nav.tabs button{
    flex:1;
    padding:12px 2px;
    border:none;
    background:none;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--ink-soft);
    border-bottom:3px solid transparent;
    cursor:pointer;
  }

  /* ---- My Bag ---- */
  .bag-row{
    display:flex;align-items:center;gap:8px;
    background:var(--paper-raised);border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;margin-bottom:6px;
  }
  .bag-row .bn{flex:1;font-size:13.5px;font-weight:500;}
  .bag-row .by{
    width:64px;padding:6px 4px;text-align:center;
    font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;
    border:1px solid var(--line-strong);border-radius:6px;
    background:var(--paper);color:var(--green-deep);
  }
  .bag-row .beff{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;
    color:var(--gold);width:58px;text-align:right;line-height:1.25;
  }
  .bag-row .brm{
    background:none;border:none;color:var(--line-strong);
    font-size:18px;cursor:pointer;padding:0 2px;line-height:1;
  }
  .bag-add{display:flex;gap:6px;margin-top:10px;}
  .bag-add input{
    flex:1;padding:8px 10px;border:1px solid var(--line-strong);
    border-radius:6px;background:var(--paper-raised);font-size:13px;
  }
  .bag-add input.num{flex:0 0 70px;text-align:center;font-family:'IBM Plex Mono',monospace;}
  .bag-add button{
    flex:0 0 54px;border:none;border-radius:6px;background:var(--green-deep);
    color:var(--paper-raised);font-weight:600;font-size:13px;cursor:pointer;
  }
  .gap-flag{
    font-family:'IBM Plex Mono',monospace;font-size:11px;
    padding:3px 0 3px 10px;border-left:2px solid var(--red);
    color:var(--ink-soft);margin:2px 0 6px 8px;
  }
  .gap-flag.ok{border-left-color:var(--green-mid);}
  table.matrix{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:12px;}
  table.matrix th{
    font-size:10px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);
    padding:6px 4px;border-bottom:1px solid var(--line-strong);font-weight:500;
  }
  table.matrix td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line);}
  table.matrix td.cname{text-align:left;font-family:'Inter',sans-serif;font-size:12.5px;}

  /* ---- Caddie ---- */
  .target-box{
    background:var(--green-deep);color:var(--paper-raised);
    padding:16px 20px;text-align:center;
  }
  .target-box .tlabel{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;
    letter-spacing:0.12em;text-transform:uppercase;color:var(--gold-pale);
  }
  .target-box .tinput{
    width:120px;background:transparent;border:none;border-bottom:2px solid var(--gold);
    color:var(--paper-raised);font-family:'IBM Plex Mono',monospace;
    font-size:42px;font-weight:600;text-align:center;padding:2px 0;
  }
  .target-steps{display:flex;justify-content:center;gap:8px;margin-top:10px;}
  .target-steps button{
    padding:6px 12px;border-radius:6px;border:1px solid rgba(255,255,255,0.3);
    background:rgba(255,255,255,0.08);color:var(--paper-raised);
    font-family:'IBM Plex Mono',monospace;font-size:12px;cursor:pointer;
  }
  .plays-like{
    background:var(--gold-pale);border-bottom:1px solid var(--gold);
    padding:12px 20px;text-align:center;
  }
  .plays-like .pl-num{
    font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:600;color:var(--green-deep);
  }
  .plays-like .pl-lbl{
    font-size:10.5px;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-soft);
  }
  .breakdown{
    display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:8px;
  }
  .breakdown span{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;
    background:var(--paper-raised);border:1px solid var(--line);
    border-radius:4px;padding:2px 6px;color:var(--ink-soft);
  }
  .rec-card{
    background:var(--paper-raised);border:1px solid var(--line);
    border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;
    display:flex;align-items:center;gap:12px;
  }
  .rec-card.primary{border:2px solid var(--green-deep);background:var(--green-pale);}
  .rec-rank{
    font-family:'IBM Plex Mono',monospace;font-size:10px;
    width:22px;height:22px;border-radius:50%;flex:0 0 22px;
    display:flex;align-items:center;justify-content:center;
    background:var(--green-deep);color:var(--paper-raised);
  }
  .rec-card.primary .rec-rank{background:var(--gold);color:var(--green-deep);}
  .rec-body{flex:1;}
  .rec-club{font-family:'Fraunces',serif;font-size:16px;font-weight:600;}
  .rec-swing{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:0.05em;margin-top:1px;
  }
  .rec-yards{text-align:right;font-family:'IBM Plex Mono',monospace;}
  .rec-yards .ry{font-size:19px;font-weight:600;color:var(--green-deep);}
  .rec-yards .rd{font-size:10.5px;color:var(--ink-soft);}
  .lie-note{
    font-size:12.5px;line-height:1.5;color:var(--ink);
    background:var(--red-pale);border-left:3px solid var(--red);
    padding:9px 12px;border-radius:0 6px 6px 0;margin-bottom:10px;
  }
  .compact-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .mini-input{
    width:100%;padding:8px;border:1px solid var(--line-strong);border-radius:6px;
    background:var(--paper-raised);font-family:'IBM Plex Mono',monospace;
    font-size:13px;text-align:center;
  }
  nav.tabs button.active{color:var(--green-deep);border-bottom-color:var(--green-deep);font-weight:600;}

  section{padding:18px 20px;}

  /* Score-to-par big readout */
  .headline-stats{
    display:flex;
    gap:10px;
    padding:16px 20px 4px;
  }
  .stat-tile{
    flex:1;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:10px 6px;
    text-align:center;
  }
  .stat-tile .num{
    font-family:'IBM Plex Mono',monospace;
    font-size:22px;
    font-weight:600;
    color:var(--green-deep);
  }
  .stat-tile .lbl{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--ink-soft);
    margin-top:2px;
  }

  /* Hole navigator */
  .hole-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px 6px;
  }
  .hole-nav button.arrow{
    width:38px;height:38px;
    border-radius:50%;
    border:1px solid var(--line-strong);
    background:var(--paper-raised);
    font-size:16px;
    color:var(--green-deep);
    cursor:pointer;
  }
  .hole-nav button.arrow:disabled{opacity:0.3;cursor:default;}
  .hole-badge{
    font-family:'Fraunces',serif;
    font-size:15px;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .hole-badge .hnum{
    font-size:34px;
    font-weight:700;
    color:var(--ink);
    line-height:1;
  }
  .hole-dots{display:flex;gap:3px;flex-wrap:wrap;max-width:120px;}
  .hole-dots span{
    width:7px;height:7px;border-radius:50%;
    background:var(--line-strong);
  }
  .hole-dots span.done{background:var(--green-mid);}
  .hole-dots span.current{background:var(--red);}

  /* Score display with golf scoring convention shapes */
  .score-display{
    display:flex;justify-content:center;align-items:center;
    padding:6px 20px 14px;
  }
  .score-shape{
    width:64px;height:64px;
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:26px;font-weight:600;
    position:relative;
  }
  .score-shape .core{
    width:52px;height:52px;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
  }
  .shape-eagle .core{border:2px solid var(--gold);border-radius:50%;box-shadow:0 0 0 4px var(--paper) inset, 0 0 0 5px var(--gold);}
  .shape-birdie .core{border:2px solid var(--gold);border-radius:50%;}
  .shape-par .core{border:none;}
  .shape-bogey .core{border:2px solid var(--red);border-radius:4px;}
  .shape-double .core{border:2px solid var(--red);border-radius:4px;box-shadow:0 0 0 4px var(--paper) inset, 0 0 0 5px var(--red);}
  .score-caption{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.08em;
    text-align:center;margin-top:-6px;
  }
  .score-steppers{display:flex;justify-content:center;gap:16px;margin-top:8px;}
  .score-steppers button{
    width:34px;height:34px;border-radius:50%;
    border:1px solid var(--line-strong);background:var(--paper-raised);
    font-size:18px;color:var(--green-deep);cursor:pointer;
  }

  /* Field groups */
  .field{margin-bottom:16px;}
  .field-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;text-transform:uppercase;letter-spacing:0.08em;
    color:var(--ink-soft);margin-bottom:6px;display:block;
  }
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}
  .btn-row button{
    flex:1;
    min-width:56px;
    padding:9px 6px;
    border-radius:8px;
    border:1px solid var(--line-strong);
    background:var(--paper-raised);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:13px;font-weight:500;
    cursor:pointer;
  }
  .btn-row button.sel{
    background:var(--green-deep);
    border-color:var(--green-deep);
    color:var(--paper-raised);
  }
  .btn-row button.sel.bad{background:var(--red);border-color:var(--red);}
  select.field-select{
    width:100%;padding:9px 10px;border-radius:8px;
    border:1px solid var(--line-strong);background:var(--paper-raised);
    font-family:'Inter',sans-serif;font-size:13px;color:var(--ink);
  }
  .na-note{font-size:12px;color:var(--ink-soft);font-style:italic;padding:8px 2px;}

  .save-btn{
    width:100%;padding:13px;border-radius:8px;border:none;
    background:var(--green-deep);color:var(--paper-raised);
    font-family:'Inter',sans-serif;font-weight:600;font-size:14px;
    cursor:pointer;margin-top:6px;
  }
  .finish-btn{
    width:100%;padding:13px;border-radius:8px;border:2px solid var(--gold);
    background:var(--gold-pale);color:var(--green-deep);
    font-family:'Inter',sans-serif;font-weight:700;font-size:14px;
    cursor:pointer;margin-top:10px;
  }

  /* ---- Live shot-by-shot tracking (course-tied holes) ---- */
  .live-hdr{ display:flex; align-items:center; justify-content:space-between; padding:10px 20px 6px; gap:8px; }
  .live-hdr .lh-arrow{ background:none; border:none; font-size:18px; color:var(--green-deep); padding:2px 6px; cursor:pointer; }
  .live-hdr .lh-arrow:disabled{ opacity:0.3; }
  .live-hdr .lh-info{ flex:1; text-align:center; font-family:'Fraunces',serif; font-size:14.5px; font-weight:600; color:var(--green-deep); }
  .live-hdr .lh-info .lh-yard{ font-family:'IBM Plex Mono',monospace; font-weight:500; font-size:11.5px; color:var(--ink-soft); }
  .live-hdr .lh-edit{ background:none; border:none; color:var(--ink-soft); font-size:10.5px; text-decoration:underline; cursor:pointer; padding:2px; white-space:nowrap; }

  .diagram-card{
    border-radius:12px; overflow:hidden; border:1px solid var(--line); margin:0 auto;
    box-shadow:0 8px 20px -14px rgba(31,61,46,0.4); position:relative; background:var(--turf-rough);
  }
  .diagram-card svg{ display:block; width:100%; height:100%; cursor:crosshair; touch-action:none; }
  .view-fab{
    position:absolute; top:7px; right:7px; background:rgba(15,25,15,0.55); color:#fff; border:none;
    border-radius:100px; padding:5px 9px; font-size:10px; font-weight:700; cursor:pointer; backdrop-filter:blur(2px);
  }
  .tap-hint{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); pointer-events:none; text-align:center;
    color:#fff; text-shadow:0 2px 8px rgba(0,0,0,0.55); font-size:12px; font-weight:600; opacity:0.92; width:80%;
  }
  .drag-ring{
    position:absolute; left:0; top:0; width:46px; height:46px; margin:-23px 0 0 -23px;
    border-radius:50%; border:2px solid rgba(255,255,255,0.9); box-shadow:0 0 0 1.5px rgba(0,0,0,0.35), 0 2px 8px rgba(0,0,0,0.3);
    pointer-events:none; display:none; z-index:4;
  }
  .drag-ring.on{ display:block; }
  .drag-ring::after{
    content:""; position:absolute; left:50%; top:50%; width:8px; height:8px; margin:-4px 0 0 -4px;
    border-radius:50%; background:var(--gold); box-shadow:0 0 0 1px rgba(0,0,0,0.45);
  }
  .drag-tooltip{
    position:absolute; left:0; top:0; pointer-events:none; background:rgba(15,25,18,0.92); color:#fff;
    border-radius:10px; padding:7px 10px; white-space:nowrap; box-shadow:0 8px 20px -6px rgba(0,0,0,0.55);
    display:none; z-index:5; --tail-x:50%;
  }
  .drag-tooltip.on{ display:block; }
  /* Horizontal position is a JS-computed, clamped `left` (see paintLive) so the
     bubble stays inside .diagram-card's overflow:hidden instead of getting cut
     off near the edges of a narrow card — so only the vertical flip is a transform. */
  .drag-tooltip.above{ transform:translateY(-100%); }
  .drag-tooltip.below{ transform:translateY(0); }
  .drag-tooltip.above::after{
    content:""; position:absolute; left:var(--tail-x); bottom:-6px; width:0; height:0; margin-left:-6px;
    border-left:6px solid transparent; border-right:6px solid transparent; border-top:6px solid rgba(15,25,18,0.92);
  }
  .drag-tooltip.below::after{
    content:""; position:absolute; left:var(--tail-x); top:-6px; width:0; height:0; margin-left:-6px;
    border-left:6px solid transparent; border-right:6px solid transparent; border-bottom:6px solid rgba(15,25,18,0.92);
  }
  .drag-tooltip .dt-main{ font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:700; line-height:1.2; }
  .drag-tooltip .dt-main .dt-lie{ font-family:'Inter',sans-serif; font-size:10px; font-weight:700; margin-left:5px; padding:1px 5px; border-radius:100px; background:rgba(255,255,255,0.18); vertical-align:1px; }
  .drag-tooltip .dt-sub{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:rgba(255,255,255,0.75); }

  .live-bottom{ padding:0 20px; display:flex; flex-direction:column; }
  .caddie-line{
    flex:0 0 auto; margin-top:10px; padding:9px 11px; border-radius:9px; background:var(--gold-pale);
    display:flex; align-items:center; gap:8px; border:1px solid #E2CE97;
  }
  .caddie-line .cbadge{
    font-size:9px; letter-spacing:0.07em; text-transform:uppercase; font-weight:700; color:var(--green-deep);
    background:rgba(31,61,46,0.08); padding:3px 6px; border-radius:5px; flex:0 0 auto;
  }
  .caddie-line .ctext{ font-size:12.5px; color:var(--ink); line-height:1.35; }

<body>
<div class="app" id="app"></div>

<script>
const CLUBS = ["Driver","Fairway Wood","Hybrid","Long Iron (3-5)","Mid Iron (6-7)","Short Iron (8-9)","Wedge"];
const APPROACH_RANGES = ["<50","50-100","100-150","150-200","200+"];
const APP_VERSION = '2.2.0';

function blankHole(par){
  return {
    par: par||4, score: par||4, fir:null, approach:null, approachYards:null,
    club:null, gir:null, ud:null, putts:2, puttDist:null,
    blowup:null, recClub:null, recSwing:null, followedRec:null,
    girMissDist:null, girMissDir:null, girTap:null, girMissSeverity:null, approachLie:null,
    firMissDir:null, firTap:null, firMissSeverity:null, teeClub:null,
    // Shot-by-shot log for course-tied rounds (see buildHole/renderLiveHoleView).
    // {club, xh, yh, lie, distYards, remainYards} per shot, tee to green. When
    // this is non-empty, deriveHoleSummaryFields() keeps the fields above in
    // sync so every existing insight/ledger/spray-chart still works unchanged.
    // Freeform rounds never populate this — they keep the tap-diagram flow.
    shots: [],
    quickMode: false, // pace-of-play escape hatch: score+putts only, skip shot detail
    setupDone: false  // true once par/yardage/shape are confirmed for this hole — gates renderHoleSetupView
  };
}
function newRound(){
  return {course:"", date: new Date().toISOString().slice(0,10), slope:"", rating:"", courseId:null, teeId:null, holes: Array.from({length:18},()=>blankHole(4))};
}
function blankCourseHoles(){
  return Array.from({length:18},()=>({par:4, yardage:null, shape:null}));
}
// Fairway shape templates for the on-course tap diagram. Par 3 always plays
// 'straight' (tee shot goes right at the green, no dogleg concept applies);
// par 4/5 pick any of these five, rendered at whatever yardage the hole is.
const HOLE_SHAPES = {
  straight:  { label:'Straight',          style:'straight' },
  // The centreline SHIFTS sideways by offsetYards between shiftFrom and shiftTo
  // (as a fraction of the hole), and runs vertically before and after. That's
  // the shape of a real dogleg — two roughly parallel legs with a lateral step
  // between them — and it's what the reference drawing does.
  //
  // A previous version made this a bulge that peaked and returned to zero,
  // which doubled the apparent swing (out AND back) and read as a banana.
  // Offsets are tuned so that AFTER the lateral exaggeration the bend occupies
  // the same fraction of the frame as the reference (~15% of hole length).
  // A dogleg turns ONCE at the corner and then runs straight at the green on the
  // new line — it does not straighten back up. Using the shift model for these
  // gave a vertical-diagonal-vertical S, which is not what a dogleg looks like.
  // cornerT sits past halfway so you drive well up the hole before the turn,
  // and the shorter remaining leg makes the angle sharper for the same offset.
  dogleg_l:  { label:'Dogleg Left',        style:'corner', dir:-1, offsetYards:55, cornerT:0.52, filletT:0.13 },
  dogleg_r:  { label:'Dogleg Right',       style:'corner', dir: 1, offsetYards:55, cornerT:0.52, filletT:0.13 },
  bend_l:    { label:'Slight Bend Left',   style:'shift', dir:-1, offsetYards:20, shiftFrom:0.10, shiftTo:0.90 },
  bend_r:    { label:'Slight Bend Right',  style:'shift', dir: 1, offsetYards:20, shiftFrom:0.10, shiftTo:0.90 },
  // Same shift model as a slight bend, but over a tighter middle stretch and a
  // bigger step — so it reads as a distinct S: straight, shift across, straight
  // again into the green. A dogleg by contrast turns once and stays angled.
  scurve_l:  { label:'S-Curve Left',       style:'shift', dir:-1, offsetYards:40, shiftFrom:0.34, shiftTo:0.74 },
  scurve_r:  { label:'S-Curve Right',      style:'shift', dir: 1, offsetYards:40, shiftFrom:0.34, shiftTo:0.74 }
};
const HOLE_SHAPE_ORDER = ['straight','dogleg_l','dogleg_r','bend_l','bend_r','scurve_l','scurve_r'];
function girMissAbbrev(h){
  const dist = {short:'S', long:'Lg'}[h.girMissDist||''] || '';
  const dir = {left:'L', right:'R'}[h.girMissDir||''] || '';
  return (dist+dir) || '✕';
}
function girMissLabel(h){
  const dist = {short:'Short', pin:'Pin high', long:'Long'}[h.girMissDist||''];
  const dir = {left:'Left', center:'Center', right:'Right'}[h.girMissDir||''];
  const parts = [dist, dir].filter(Boolean);
  return parts.length ? 'Missed ' + parts.join(', ').toLowerCase() : 'Missed green';
}

// ---------- Tap-to-mark diagrams ----------
// No more Hit/Miss buttons — you tap where the ball actually finished, on a
// generic (not to-scale) diagram, and the app reads hit/miss and the miss
// location straight off the tap position. Both diagrams share the same
// 200x200 SVG unit square and yard-per-diagram scale; only the shape drawn
// (circle green vs. fairway corridor) and the classification differ.
const TARGET_DIAGRAM_YARDS = 45;   // green diagram: ±45y from the pin, in every direction
const GREEN_RADIUS_YARDS = 15;     // tap inside this radius of the pin = green in regulation
const GREEN_NEAR_MISS_YARDS = 25;  // between the green edge and here = a "near" miss; beyond = "bad"
const FAIRWAY_DIAGRAM_YARDS = 45;  // fairway diagram: ±45y of lateral spread, tee to the near edge of view
const FAIRWAY_HALF_WIDTH_YARDS = 17; // tap within this many yards of the center line = fairway hit
const FAIRWAY_NEAR_MISS_YARDS = 27;  // between the fairway edge and here = "near" (first cut); beyond = "bad"
const MISS_DEADZONE_YARDS = 3;

function svgTapToYards(svgId, e, diagramYards){
  const svg = document.getElementById(svgId);
  const rect = svg.getBoundingClientRect();
  if(rect.width===0 || rect.height===0) return null;
  const px = ((e.clientX-rect.left)/rect.width)*200;
  const py = ((e.clientY-rect.top)/rect.height)*200;
  const scalePx = 200/(diagramYards*2);
  return { lateral: (px-100)/scalePx, long: (100-py)/scalePx };
}
function attachDiagramTapHandler(svgId, diagramYards, onTap){
  const svg = document.getElementById(svgId);
  if(!svg) return;
  svg.onclick = e => {
    const tap = svgTapToYards(svgId, e, diagramYards);
    if(tap) onTap(tap);
  };
}

function classifyGreenTap(tap){
  const {long, lateral} = tap;
  const radius = Math.sqrt(long*long + lateral*lateral);
  if(radius <= GREEN_RADIUS_YARDS) return {gir:'hit', dir:null, dist:null, severity:null};
  const dir = lateral > MISS_DEADZONE_YARDS ? 'right' : lateral < -MISS_DEADZONE_YARDS ? 'left' : 'center';
  const dist = long > MISS_DEADZONE_YARDS ? 'long' : long < -MISS_DEADZONE_YARDS ? 'short' : 'pin';
  const severity = radius <= GREEN_NEAR_MISS_YARDS ? 'near' : 'bad';
  return {gir:'miss', dir, dist, severity};
}
function classifyFairwayTap(tap){
  const abs = Math.abs(tap.lateral);
  if(abs <= FAIRWAY_HALF_WIDTH_YARDS) return {fir:'hit', dir:null, severity:null};
  const dir = tap.lateral > 0 ? 'right' : 'left';
  const severity = abs <= FAIRWAY_NEAR_MISS_YARDS ? 'near' : 'bad';
  return {fir:'miss', dir, severity};
}

// opts: {current:{long,lateral}|null, dots:[{long,lateral,severity}]}
function renderGreenDiagram(id, opts){
  opts = opts || {};
  const scalePx = 200/(TARGET_DIAGRAM_YARDS*2);
  const toPx = t => ({x: 100+t.lateral*scalePx, y: 100-t.long*scalePx});
  const greenR = (GREEN_RADIUS_YARDS*scalePx).toFixed(1);
  const nearR = (GREEN_NEAR_MISS_YARDS*scalePx).toFixed(1);
  const dotsSvg = (opts.dots||[]).map(d=>{
    const p = toPx(d);
    const color = d.severity==='bad' ? 'var(--red)' : d.severity==='near' ? 'var(--gold)' : 'var(--green-deep)';
    return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="${color}" fill-opacity="0.8" stroke="var(--paper-raised)" stroke-width="0.75"/>`;
  }).join('');
  const currentSvg = opts.current ? (()=>{
    const p = toPx(opts.current);
    return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="6" fill="var(--green-deep)" stroke="var(--paper-raised)" stroke-width="1.5"/>`;
  })() : '';
  return `
    <svg id="${id}" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet"
      style="width:100%;max-width:320px;display:block;margin:6px auto;touch-action:manipulation;cursor:crosshair;background:var(--paper-raised);border:1px solid var(--line);border-radius:8px;">
      <circle cx="100" cy="100" r="${nearR}" fill="none" stroke="var(--line-strong)" stroke-dasharray="4,3"/>
      <circle cx="100" cy="100" r="${greenR}" fill="var(--green-mid)" fill-opacity="0.32" stroke="var(--green-deep)" stroke-width="1"/>
      <line x1="100" y1="4" x2="100" y2="196" stroke="var(--line)" stroke-width="0.5"/>
      <line x1="4" y1="100" x2="196" y2="100" stroke="var(--line)" stroke-width="0.5"/>
      <g>
        <line x1="100" y1="100" x2="100" y2="88" stroke="var(--green-deep)" stroke-width="2"/>
        <path d="M100,88 L110,92 L100,96 Z" fill="var(--gold)"/>
      </g>
      ${dotsSvg}
      ${currentSvg}
    </svg>
  `;
}
// opts: {current:{long,lateral}|null, dots:[{long,lateral,severity}]}
function renderFairwayDiagram(id, opts){
  opts = opts || {};
  const scalePx = 200/(FAIRWAY_DIAGRAM_YARDS*2);
  const toPx = t => ({x: 100+t.lateral*scalePx, y: 100-t.long*scalePx});
  const halfW = (FAIRWAY_HALF_WIDTH_YARDS*scalePx).toFixed(1);
  const nearHalfW = (FAIRWAY_NEAR_MISS_YARDS*scalePx).toFixed(1);
  const dotsSvg = (opts.dots||[]).map(d=>{
    const p = toPx(d);
    const color = d.severity==='bad' ? 'var(--red)' : d.severity==='near' ? 'var(--gold)' : 'var(--green-deep)';
    return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="${color}" fill-opacity="0.8" stroke="var(--paper-raised)" stroke-width="0.75"/>`;
  }).join('');
  const currentSvg = opts.current ? (()=>{
    const p = toPx(opts.current);
    return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="6" fill="var(--green-deep)" stroke="var(--paper-raised)" stroke-width="1.5"/>`;
  })() : '';
  return `
    <svg id="${id}" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet"
      style="width:100%;max-width:320px;display:block;margin:6px auto;touch-action:manipulation;cursor:crosshair;background:var(--paper-raised);border:1px solid var(--line);border-radius:8px;">
      <rect x="${100-nearHalfW}" y="4" width="${nearHalfW*2}" height="192" fill="none" stroke="var(--line-strong)" stroke-dasharray="4,3"/>
      <rect x="${100-halfW}" y="4" width="${halfW*2}" height="192" fill="var(--green-mid)" fill-opacity="0.32" stroke="var(--green-deep)" stroke-width="1"/>
      <line x1="100" y1="4" x2="100" y2="196" stroke="var(--line)" stroke-width="0.5" stroke-dasharray="2,3"/>
      <g><path d="M96,190 L104,190 L100,180 Z" fill="var(--gold)"/></g>
      ${dotsSvg}
      ${currentSvg}
    </svg>
  `;
}
// ---------- Whole-hole shape diagrams (course-tied rounds) ----------
// A second, separate diagram system from the bullseye/corridor taps above,
// which stay exactly as they were for freeform rounds. This one draws the
// hole's actual chosen shape (see HOLE_SHAPES) tee-to-green and is shared by
// the hole-setup preview and the live shot-by-shot tracking screen.
const HOLE_CANVAS_PAD = 30;        // yards of tap-room kept clear beyond the fairway's own footprint, on every side
const HOLE_MIN_CANVAS_WIDTH = 150; // even a straight hole gets at least this much lateral room
const HOLE_MARGIN_TEE = 44;        // room shown below the tee marker (must clear the rough's bottom lobe AND the tee pad)
const HOLE_MARGIN_GREEN = 40;      // room shown PAST the green, in case of a long hit through it
const HOLE_DISTANCE_MARKERS = [250,200,150,100];
// The first cut is drawn as its own rounded silhouette hugging the fairway; the
// darker background beyond it is heavy rough — a big miss. The band's width is
// the SAME constant nearestHoleLie uses for its 'First cut' test, so the three
// colours you see are exactly the three lies the app will record.
const HOLE_FIRST_CUT_YARDS = 16;
// Width of the fringe collar around the green. It plays as fairway and IS
// classified as fairway; the ring is only a shade, drawn strictly inside the
// fairway mouth so it can never span a lie boundary. The mouth is kept wide
// enough that the ring and the mouth's own rounded edge stay clearly apart —
// at nearly equal radii the two outlines collided into mush in the green view.
const GREEN_FRINGE_YARDS = 3;
// The first-cut ribbon's own semicircular cap already reaches ~28y below its
// last point, so a short tail is all that's needed to get a big round lobe —
// a longer one just pushed the cap off the bottom of the canvas.
const HOLE_ROUGH_TAIL = 12;        // how far the first-cut lobe extends below the tee
const HOLE_TEE_YH = -28;           // tee pad sits BELOW the fairway's rounded start, in its own lobe
const HOLE_ROUGH_HEAD = 24;        // ...and beyond the green

function holeSmoothstep(t){ return t*t*(3-2*t); }
// Joins a sampled point list with cubic Béziers (Catmull-Rom control points)
// instead of straight `L` segments. The outline used to be 65 samples joined
// corner-to-corner, which read as a faceted hand-drawn polygon — most visibly
// as a hard kink at a dogleg's corner. Same sample points, curved joins.
function holeSmoothSegs(pts, tension){
  const k = (tension==null?1:tension)/6;
  let d = '';
  for(let i=0;i<pts.length-1;i++){
    const p0 = pts[i-1] || pts[i];
    const p1 = pts[i], p2 = pts[i+1];
    const p3 = pts[i+2] || p2;
    const c1x = p1.x + (p2.x-p0.x)*k, c1y = p1.y + (p2.y-p0.y)*k;
    const c2x = p2.x - (p3.x-p1.x)*k, c2y = p2.y - (p3.y-p1.y)*k;
    d += `C${c1x.toFixed(2)},${c1y.toFixed(2)} ${c2x.toFixed(2)},${c2y.toFixed(2)} ${p2.x.toFixed(2)},${p2.y.toFixed(2)}`;
  }
  return d;
}
// A closed "ribbon" running tee-to-green: up the left edge, a semicircular cap
// over the green end, back down the right edge, another cap under the tee end.
// The rounded caps are what stop the fairway and the rough looking like they've
// been cut off with scissors at both ends.
// pts: [{cx, yh, hw}] ordered tee -> green.
function holeRibbonPath(pts, svgY){
  const left  = pts.map(p=>({x:p.cx-p.hw, y:svgY(p.yh)}));
  const right = pts.map(p=>({x:p.cx+p.hw, y:svgY(p.yh)})).reverse();
  const rHead = pts[pts.length-1].hw, rTail = pts[0].hw;
  // sweep=1 on both: from the left edge it arcs over the top, and from the
  // right edge it arcs under the bottom.
  return `M${left[0].x.toFixed(2)},${left[0].y.toFixed(2)}`
    + holeSmoothSegs(left)
    + `A${rHead.toFixed(2)},${rHead.toFixed(2)} 0 0 1 ${right[0].x.toFixed(2)},${right[0].y.toFixed(2)}`
    + holeSmoothSegs(right)
    + `A${rTail.toFixed(2)},${rTail.toFixed(2)} 0 0 1 ${left[0].x.toFixed(2)},${left[0].y.toFixed(2)}Z`;
}
// Lateral exaggeration. A 400-yard hole is ~8:1 long-to-wide in reality, which
// on a portrait phone card renders as a thin ribbon with a screenful of wasted
// rough either side. Scorecard and yardage-book hole diagrams don't draw to
// true scale either — each hole is fitted to its own roughly-portrait box, with
// length compressed and width exaggerated. Same approach here: the viewBox is
// narrowed to the hole's own footprint plus a margin, then stretched to fill
// the card (see renderLiveHoleView). Capped so a straight hole doesn't get
// blown out, and so a dogleg's turn stays the severity it actually is.
const HOLE_LATERAL_MARGIN = 30;  // yards of rough kept either side of the hole's footprint (also the tap room for a wild miss)
// Only ever binds on narrow holes (a straight one is a plain ribbon, so
// widening it invents nothing). Holes with real lateral travel — the doglegs —
// are limited by their own footprint well before this, so raising it doesn't
// touch how severe a dogleg looks.
const HOLE_MAX_STRETCH = 1.75;  // chosen so the silhouette fills the same fraction of the card as the reference does of its page
// Lateral offset of the fairway centreline from the straight tee-to-green line,
// at a point yh yards up the hole. Zero at the tee and zero again at the green
// (the green sits directly up the line from the tee, so a hole's stated yardage
// IS its tee-to-green distance), peaking at the dogleg/bend.
//
// sin(pi*u/2) rises almost linearly off each end and flattens to zero slope at
// the peak, so the two legs read straight-ish and the corner is rounded — and
// because the slope is zero on both sides of the peak, the joint is smooth
// rather than a kink.
// Lateral position of the fairway centreline at fraction t up the hole. Zero at
// the tee, the shape's full offset at the green, with a smoothstep in between —
// so both legs run vertically and the turn is a rounded step, not a kink.
function holeCenterlineX(t, shape){
  if(!shape.offsetYards) return 0;
  if(shape.style==='corner'){
    // Straight off the tee to the corner, then one turn onto a straight angled
    // leg that runs at the green. The fillet is parabolic so it leaves the
    // first leg at slope 0 and joins the second at exactly its slope — tangent
    // to both, so the corner is rounded rather than kinked.
    const c = shape.cornerT, h = shape.filletT;
    const k = shape.offsetYards/(1-c);         // lateral yards gained per unit t on the second leg
    if(t <= c-h) return 0;
    if(t >= c+h) return shape.dir * k * (t-c);
    const u = (t-(c-h))/(2*h);
    return shape.dir * u*u * h*k;
  }
  // A gentle bend: one continuous curve, vertical at both ends.
  const span = shape.shiftTo - shape.shiftFrom;
  const u = span>0 ? Math.min(Math.max((t-shape.shiftFrom)/span, 0), 1) : (t>=shape.shiftTo?1:0);
  return shape.dir * shape.offsetYards * holeSmoothstep(u);
}
// A fairway ribbon: narrow off the tee, up to full width quickly, then flaring
// a little to meet the green. The old profile was sin(pi*t) — narrow at both
// ends, widest in the middle — which is a lens, and once the diagram was
// stretched laterally that bulge read as a bloated pod rather than a fairway.
// The flare at the top also stops the green sitting on the corridor like a bulb
// on a stick; it now opens into a mouth that's wider than the green itself.
// Measured off the reference drawing: at ~4px/yard its fairway is ~38 yards
// across with a ~16-yard band of first cut either side (70 yards overall).
function holeCorridorWidth(t, isPar3){
  const wTee   = isPar3 ? 20 : 24;
  const wFull  = isPar3 ? 28 : 38;
  const wGreen = isPar3 ? 42 : 44;
  const inRamp  = holeSmoothstep(Math.min(Math.max(t,0)/0.15, 1));
  const outRamp = holeSmoothstep(Math.min(Math.max((t-0.78)/0.22, 0), 1));
  return wTee + (wFull-wTee)*inRamp + (wGreen-wFull)*outRamp;
}
// Builds the fairway polygon, green/tee position, a sampled centerline (for
// lie lookups), and an adaptive viewBox padded on BOTH sides of wherever the
// fairway actually ends up — a hard dogleg needs real room on the corner
// side, but also on the "wrong" side for a big miss, regardless of which way
// it turns.
function buildHoleLayout(shapeId, yardage, isPar3){
  const shape = HOLE_SHAPES[shapeId] || HOLE_SHAPES.straight;
  // The green ends up offset sideways, so it can't also sit `yardage` yards
  // straight up — that would make the real tee-to-green distance longer than
  // the hole's own yardage (a 410y dogleg used to measure 433y from the tee).
  // Pull its vertical position in so the straight-line distance IS the yardage.
  const greenCx = holeCenterlineX(1, shape);
  const greenYh = Math.sqrt(Math.max(yardage*yardage - greenCx*greenCx, 1));
  const totalH = greenYh + HOLE_MARGIN_TEE + HOLE_MARGIN_GREEN;
  const svgY = yh => totalH - HOLE_MARGIN_TEE - yh;
  const N = 120; // enough resolution that a dogleg's rounded corner is actually sampled
  const samples = [];
  for(let i=0;i<=N;i++){
    const t = i/N;
    samples.push({t, yh: t*greenYh, cx: holeCenterlineX(t, shape), w: holeCorridorWidth(t, isPar3)});
  }
  const fairwayD = holeRibbonPath(samples.map(s=>({cx:s.cx, yh:s.yh, hw:s.w/2})), svgY);

  // The first cut hugs the fairway at a constant margin and runs past both
  // ends, giving the rounded lobes the tee sits in and the green nestles into.
  const roughPts = [];
  const M = 24;
  for(let i=M;i>0;i--){ // tail, below the tee
    roughPts.push({cx: 0, yh: -HOLE_ROUGH_TAIL*(i/M), hw: holeCorridorWidth(0,isPar3)/2 + HOLE_FIRST_CUT_YARDS});
  }
  samples.forEach(s=>roughPts.push({cx:s.cx, yh:s.yh, hw:s.w/2 + HOLE_FIRST_CUT_YARDS}));
  for(let i=1;i<=M;i++){ // head, past the green
    roughPts.push({cx: greenCx, yh: greenYh + HOLE_ROUGH_HEAD*(i/M), hw: holeCorridorWidth(1,isPar3)/2 + HOLE_FIRST_CUT_YARDS});
  }
  const roughD = holeRibbonPath(roughPts, svgY);

  let minX = Infinity, maxX = -Infinity;
  roughPts.forEach(p=>{ minX = Math.min(minX, p.cx-p.hw); maxX = Math.max(maxX, p.cx+p.hw); });
  const greenY = svgY(greenYh);
  minX = Math.min(minX, greenCx-GREEN_RADIUS_YARDS);
  maxX = Math.max(maxX, greenCx+GREEN_RADIUS_YARDS);
  const teeCx = 0, teeY = svgY(HOLE_TEE_YH);
  let viewMinX = minX-HOLE_CANVAS_PAD, viewMaxX = maxX+HOLE_CANVAS_PAD;
  const rawW = viewMaxX-viewMinX;
  if(rawW < HOLE_MIN_CANVAS_WIDTH){
    const extra = (HOLE_MIN_CANVAS_WIDTH-rawW)/2;
    viewMinX -= extra; viewMaxX += extra;
  }
  // holeMinX/holeMaxX are the hole's own tight footprint (fairway + green, no
  // padding) — what the lateral-exaggeration fit measures against.
  // viewMinX/viewMaxX stay the padded, true-scale bounds used by the setup
  // preview and as the floor for the live view's own width math.
  // yardage = the hole's stated (straight-line tee-to-green) distance.
  // greenYh = how far UP the canvas the green sits, which is less than the
  // yardage whenever the green is offset sideways. All distance math uses
  // greenYh; only labels use yardage.
  return { shapeId, shape, isPar3, totalH, svgY, samples, fairwayD, roughD, greenCx, greenY, greenYh, teeCx, teeY, yardage,
           holeMinX:minX, holeMaxX:maxX, viewMinX, viewMaxX };
}
function nearestHoleLie(hole, xh, yh){
  let best=null, bestD=Infinity;
  for(const s of hole.samples){
    const d = Math.abs(s.yh - yh);
    if(d<bestD){ bestD=d; best=s; }
  }
  if(!best) return {lie:'Fairway', lateral:0};
  const lateral = xh - best.cx;
  const half = best.w/2;
  const a = Math.abs(lateral);
  let lie;
  if(a<=half) lie='Fairway';
  else if(a<=half+HOLE_FIRST_CUT_YARDS) lie='First cut';
  else lie='Rough';
  return {lie, lateral};
}
// Classifies a tapped shot position against the whole hole: which LIES id it
// landed in (or 'green' if it reached the putting surface), plus a near/bad
// severity relative to the green — used by deriveHoleSummaryFields to keep
// the existing GIR/FIR/lie insight fields populated from shots[].
function classifyHoleShot(hole, xh, yh){
  const distToGreen = Math.sqrt((xh-hole.greenCx)**2 + (yh-hole.greenYh)**2);
  const onGreen = distToGreen <= GREEN_RADIUS_YARDS;
  const near = nearestHoleLie(hole, xh, yh);
  const lieId = onGreen ? 'green' : ({Fairway:'fairway','First cut':'lightrough',Rough:'heavyrough'}[near.lie] || 'heavyrough');
  const severity = distToGreen<=GREEN_NEAR_MISS_YARDS ? 'near' : 'bad';
  return { lieId, onGreen, distToGreen, lateral:near.lateral };
}
// Yardage-to-the-green markers, drawn as a short tick across the fairway with
// the number beside it rather than a full sweeping arc — the arcs read as
// clutter across the whole canvas, and their labels sat mid-fairway in the way
// of the shot you're trying to place.
//
// u: one screen pixel expressed in user units (see renderHoleShapeSvg), so type
// is a real px size instead of a size in yards — sizing in yards is why a short
// par 3 was rendering a giant "100" and a long par 5 a tiny one.
// kx: the lateral exaggeration, divided back out of anything that is type.
function holeDistanceRingsSvg(hole, u, kx){
  u = u || 1; kx = kx || 1;
  const distTo = s => Math.sqrt((s.cx-hole.greenCx)**2 + (s.yh-hole.greenYh)**2);
  return HOLE_DISTANCE_MARKERS.filter(d => d < hole.yardage-25 && d > 60).map(d=>{
    // Walk the centreline to where the straight-line distance to the green is
    // actually d — on a dogleg that is NOT simply d yards down the canvas.
    const s = hole.samples.reduce((a,b)=>Math.abs(distTo(b)-d)<Math.abs(distTo(a)-d)?b:a);
    const lx = s.cx;
    const ly = hole.svgY(s.yh);
    const half = s.w/2;
    const fs = 10*u;
    return `<line x1="${(lx-half).toFixed(2)}" y1="${ly.toFixed(2)}" x2="${(lx+half).toFixed(2)}" y2="${ly.toFixed(2)}" stroke="rgba(255,255,255,0.5)" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray="4,4"/>
      <text x="${(lx+half).toFixed(2)}" y="${ly.toFixed(2)}" text-anchor="start" dominant-baseline="middle" font-size="${fs.toFixed(2)}" font-family="IBM Plex Mono, monospace" font-weight="600" fill="rgba(255,255,255,0.82)" transform="translate(${(lx+half).toFixed(2)},${ly.toFixed(2)}) scale(${(1/kx).toFixed(4)},1) translate(${(-(lx+half)).toFixed(2)},${(-ly).toFixed(2)})"><tspan dx="${(5*u).toFixed(2)}">${d}</tspan></text>`;
  }).join('');
}
// opts: {id, viewBox, zoom, stretch, shots:[{xh,yh}], pending:{xh,yh}|null, small:bool}
function renderHoleShapeSvg(hole, opts){
  opts = opts || {};
  const vb = opts.viewBox || `${hole.viewMinX} 0 ${hole.viewMaxX-hole.viewMinX} ${hole.totalH}`;
  const vbn = vb.trim().split(/\s+/).map(Number);
  const vX = vbn[0], vY = vbn[1], vW = vbn[2], vH = vbn[3];

  // Lateral exaggeration in force (1 = true scale). The whole map stretches
  // sideways, so anything that's a real-world AREA — fairway, green, apron —
  // stretches with it and stays proportionally honest against its
  // surroundings. Anything that's a SYMBOL rather than terrain (ball markers,
  // the flag, the cup, tee blocks, type) gets its x-dimensions divided back
  // out, so a marker stays a round dot instead of smearing into an oval.
  const kx = opts.stretch || 1;
  // One rendered pixel, in user units. Sizing symbols and type in YARDS is why
  // a short par 3 rendered a giant "100" and yardage labels came out ~5px on a
  // phone: a fixed yard size is a different screen size on every hole and at
  // every zoom. Everything non-terrain is sized off this instead.
  const u = vH / (opts.pxH || 480);
  const uid = opts.id;
  // Strokes are px-constant: under a non-uniform scale a plain stroke-width
  // renders thinner on vertical edges than horizontal ones.
  const stroke = (px, extra) => `stroke-width="${px}" vector-effect="non-scaling-stroke"${extra||''}`;
  // Counter-scales a symbol horizontally so the lateral stretch doesn't distort it.
  const unsq = (cx, cy) => `transform="translate(${cx.toFixed(2)},${cy.toFixed(2)}) scale(${(1/kx).toFixed(4)},1) translate(${(-cx).toFixed(2)},${(-cy).toFixed(2)})"`;

  const shots = (opts.shots||[]).map((s,i)=>{
    const y = hole.svgY(s.yh);
    const r = (opts.small?6:8)*u;
    return `<g ${unsq(s.xh, y)}>
      <circle cx="${s.xh.toFixed(2)}" cy="${y.toFixed(2)}" r="${r.toFixed(2)}" fill="var(--green-deep)" ${stroke(1.5, ' stroke="#fff"')}/>
      ${opts.small?'':`<text x="${s.xh.toFixed(2)}" y="${y.toFixed(2)}" text-anchor="middle" dominant-baseline="central" font-size="${(9*u).toFixed(2)}" font-family="IBM Plex Mono, monospace" fill="#fff" font-weight="700">${i+1}</text>`}
    </g>`;
  }).join('');

  const pendingPos = opts.pending || {xh:0, yh:0};
  const pr = 9*u;
  const pendingDot = opts.small ? '' : `<g id="${uid}-pendingMarker" transform="translate(${pendingPos.xh.toFixed(2)},${hole.svgY(pendingPos.yh).toFixed(2)})" opacity="${opts.pending?1:0}">
      <g transform="scale(${(1/kx).toFixed(4)},1)">
        <circle cx="0" cy="0" r="${pr.toFixed(2)}" fill="var(--gold)" ${stroke(2, ' stroke="#fff"')}/>
      </g>
    </g>`;

  // The green is drawn as a perfect circle on screen, so its lateral radius is
  // counter-scaled like the other symbols. In the stretched whole-hole view
  // that makes it a marker for "the green is here" rather than a to-scale
  // footprint — fine placement is what the 1:1 green view is for, and there the
  // stretch is 1 so the drawn circle IS the real 15-yard radius.
  //
  // The fringe collar around it is a shade of fairway, not a lie of its own,
  // and is sized to sit well inside the fairway mouth's own rounded cap — an
  // earlier version drew it at almost exactly the cap's radius, so the two
  // outlines collided into mush once you zoomed into the green view.
  const gr = GREEN_RADIUS_YARDS;
  const flagH = 26*u, flagW = 13*u;

  return `<svg id="${uid}" viewBox="${vb}" preserveAspectRatio="none" style="display:block;width:100%;height:100%;">
    <rect x="${(vX-vW).toFixed(1)}" y="${(vY-vH).toFixed(1)}" width="${(vW*3).toFixed(1)}" height="${(vH*3).toFixed(1)}" fill="var(--turf-rough)"/>
    <path d="${hole.roughD}" fill="var(--turf-firstcut)"/>
    <path d="${hole.fairwayD}" fill="var(--turf-fairway)"/>

    ${opts.small?'':holeDistanceRingsSvg(hole, u, kx)}

    <ellipse cx="${hole.greenCx}" cy="${hole.greenY}" rx="${((gr+GREEN_FRINGE_YARDS)/kx).toFixed(2)}" ry="${(gr+GREEN_FRINGE_YARDS).toFixed(2)}" fill="var(--turf-fringe)"/>
    <ellipse cx="${hole.greenCx}" cy="${hole.greenY}" rx="${(gr/kx).toFixed(2)}" ry="${gr.toFixed(2)}" fill="var(--turf-green)"/>

    ${opts.small?'':`<g ${unsq(hole.greenCx, hole.greenY)}>
      <circle cx="${hole.greenCx}" cy="${hole.greenY}" r="${(1.6*u).toFixed(2)}" fill="rgba(34,50,32,0.55)"/>
      <line x1="${hole.greenCx}" y1="${hole.greenY}" x2="${hole.greenCx}" y2="${(hole.greenY-flagH).toFixed(2)}" ${stroke(1.6, ' stroke="#FBF9F2"')}/>
      <path d="M${hole.greenCx},${(hole.greenY-flagH).toFixed(2)} l${flagW.toFixed(2)},${(flagH*0.24).toFixed(2)} l${(-flagW).toFixed(2)},${(flagH*0.24).toFixed(2)}z" fill="var(--red)"/>
    </g>`}

    <g ${unsq(hole.teeCx, hole.teeY)}>
      ${(()=>{ const tw = (opts.small?20:24)*u, th = (opts.small?17:20)*u, dr = th*0.10, dx = tw*0.34;
        return `<rect x="${(hole.teeCx-tw/2).toFixed(2)}" y="${(hole.teeY-th/2).toFixed(2)}" width="${tw.toFixed(2)}" height="${th.toFixed(2)}" rx="${(th*0.34).toFixed(2)}" fill="var(--turf-green)"/>
        <circle cx="${(hole.teeCx-dx).toFixed(2)}" cy="${hole.teeY.toFixed(2)}" r="${dr.toFixed(2)}" fill="var(--turf-rough)"/>
        <circle cx="${(hole.teeCx+dx).toFixed(2)}" cy="${hole.teeY.toFixed(2)}" r="${dr.toFixed(2)}" fill="var(--turf-rough)"/>`;
      })()}
    </g>

    ${shots}
    ${pendingDot}
  </svg>`;
}

function approachBucketFromYards(y){
  if(y==null || isNaN(y)) return null;
  if(y<50) return "<50";
  if(y<100) return "50-100";
  if(y<150) return "100-150";
  if(y<200) return "150-200";
  return "200+";
}
// Reads the lie for the approach shot straight off the tee shot tap instead of
// making you tag it separately. On a par 3 the tee shot IS the approach, so
// it's always 'tee'. Otherwise: found the fairway = 'fairway', a near miss
// (first-cut band just outside the fairway edge) = 'lightrough', a bad miss =
// 'heavyrough' as the best generic guess — the tap can't tell a fairway bunker
// or trees from deep rough, so this is a default, not a fact; the Lie for the
// Approach buttons stay tappable to correct it when that matters.
function inferApproachLie(h){
  if(h.par===3) return 'tee';
  if(h.fir==='hit') return 'fairway';
  if(h.fir==='miss') return h.firMissSeverity==='bad' ? 'heavyrough' : 'lightrough';
  return null;
}
// On a hit green, the approach tap's distance from the pin already tells us
// roughly how far the first putt is — no reason to make you tap it again.
// Only applies to hits: a missed green gets chipped/pitched first, and we
// don't have a tap for that recovery shot, so it stays manual there.
function inferFirstPuttDist(h){
  if(h.gir!=='hit' || !h.girTap) return null;
  const feet = Math.sqrt(h.girTap.long*h.girTap.long + h.girTap.lateral*h.girTap.lateral) * 3;
  if(feet <= 10) return 'in10';
  if(feet <= 25) return '10to25';
  return '25plus';
}
// Most golfers reach for the same tee club most holes — default to whatever
// was used most recently in this round instead of making you pick it fresh
// every time. Still just a starting point: tap a different club to override.
function defaultTeeClubForHole(idx){
  for(let i=idx-1; i>=0; i--){
    if(round.holes[i] && round.holes[i].teeClub) return round.holes[i].teeClub;
  }
  return null;
}

// Keeps the pre-existing summary fields (fir/gir/teeClub/club/approachLie/
// girTap/etc.) in sync with the new shots[] log on a course-tied hole, so
// every existing insight, the ledger, and the spray charts keep reading
// exactly what they already expect — shots[] is the detailed record, this
// is the same "headline" shape everything else was already built against.
function deriveHoleSummaryFields(h){
  if(!h.shape || !h.shots || !h.shots.length) return;
  const hole = buildHoleLayout(h.shape, h.refYardage, h.par===3);

  if(h.par!==3){
    const t = h.shots[0];
    const c = classifyHoleShot(hole, t.xh, t.yh);
    h.teeClub = t.club;
    h.fir = c.onGreen || c.lieId==='fairway' ? 'hit' : 'miss';
    if(h.fir==='miss'){
      h.firMissDir = t.xh >= 0 ? 'right' : 'left'; // fairway miss has no "center" — matches the original classifyFairwayTap
      h.firMissSeverity = c.severity;
    } else { h.firMissDir=null; h.firMissSeverity=null; }
  }

  // The approach is whichever shot first reaches the green, or the most
  // recent shot logged if none has gotten there yet.
  let approachShot = null, approachIdx = -1;
  for(let i=0;i<h.shots.length;i++){
    if(classifyHoleShot(hole, h.shots[i].xh, h.shots[i].yh).onGreen){ approachShot = h.shots[i]; approachIdx = i; break; }
  }
  if(!approachShot){ approachIdx = h.shots.length-1; approachShot = h.shots[approachIdx]; }
  const ac = classifyHoleShot(hole, approachShot.xh, approachShot.yh);

  h.club = approachShot.club;
  h.gir = ac.onGreen ? 'hit' : 'miss';
  h.girTap = { long: approachShot.yh-hole.greenYh, lateral: approachShot.xh-hole.greenCx };
  if(h.gir==='miss'){
    h.girMissDir = h.girTap.lateral>3 ? 'right' : h.girTap.lateral<-3 ? 'left' : 'center';
    h.girMissDist = h.girTap.long>3 ? 'long' : h.girTap.long<-3 ? 'short' : 'pin';
    h.girMissSeverity = ac.severity;
    h.ud = h.ud===undefined ? null : h.ud;
  } else {
    h.girMissDir=null; h.girMissDist=null; h.girMissSeverity=null; h.ud=null;
    h.puttDist = inferFirstPuttDist(h);
  }

  const origin = approachIdx>0 ? h.shots[approachIdx-1] : {xh:0, yh:0};
  if(approachIdx>0){
    h.approachLie = classifyHoleShot(hole, origin.xh, origin.yh).lieId;
  } else {
    h.approachLie = h.par===3 ? 'tee' : 'fairway';
  }
  const remainAtOrigin = Math.sqrt((origin.xh-hole.greenCx)**2 + (origin.yh-hole.greenYh)**2);
  h.approachYards = Math.round(remainAtOrigin);
  h.approach = approachBucketFromYards(h.approachYards);
}

// ---------- Bag & Caddie model ----------
// Half/three-quarter swings default to a flat yardage gap off the club's stock
// number (offset) rather than a percentage (mult) — a fixed 10-20y club-to-club
// gap matches reality much better than a percentage does (a 20% cut off a
// driver is a wildly different animal than 20% off a wedge). This is only the
// starting assumption: effectiveYardageForSwing blends it with real logged
// shots at that swing length and gets replaced by actual data fast. Full/extra
// stay percentage-based since nobody's asked to change those.
const SWINGS = [
  {id:'half',  label:'½ swing',  short:'½',    offset:-20, penalty:5, knock:0.35},
  {id:'three', label:'¾ swing',  short:'¾',    offset:-10, penalty:2, knock:0.65},
  {id:'full',  label:'Full',     short:'Full', mult:1.00,  penalty:0, knock:1.00},
  {id:'extra', label:'Extra',    short:'Extra',mult:1.05,  penalty:7, knock:1.15}
];
// Scales a baseline (usually a club's stock/effective full-swing yardage) down
// to what a given swing length is expected to produce.
function scaleToSwing(yards, sw){
  return sw.offset!=null ? yards + sw.offset : yards * sw.mult;
}
// Inverse of scaleToSwing: given a distance actually achieved AT that swing
// length, project the comparable full-swing distance — used to fold a partial-
// swing shot into the club's overall (full-swing) learned yardage.
function scaleFromSwing(yardsAtSwing, sw){
  return sw.offset!=null ? yardsAtSwing - sw.offset : yardsAtSwing / sw.mult;
}

// Learned yardage PER SWING TYPE: blends the swing's stock estimate (a prior
// worth ~3 shots) with actual logged shots hit at that specific swing length.
// Falls back to the full-swing learned number, scaled to this swing, when a
// swing bucket has no data of its own yet.
function effectiveYardageForSwing(club, swingId){
  const sw = SWINGS.find(s=>s.id===swingId) || SWINGS.find(s=>s.id==='full');
  const allShots = (club.shots||[]).filter(s => s.strike==='flush' || s.strike==='solid');
  const bucketShots = allShots.filter(s => s.swing===swingId);
  const PRIOR = 3;
  if(bucketShots.length){
    let num = scaleToSwing(club.yards, sw)*PRIOR, den = PRIOR;
    const recent = bucketShots.slice(-15);
    recent.forEach((s,i)=>{
      const strikeW = s.strike==='flush' ? 1 : 0.4;
      const recencyW = 0.5 + 0.5*((i+1)/recent.length);
      const w = strikeW*recencyW;
      // s.neutral is stored as a full-swing-equivalent number (practice-log
      // entries run it through scaleFromSwing) so it can be pooled across
      // swing lengths elsewhere (effectiveYardage, dispersion, bias). Scale it
      // back down to this swing's own distance before blending it with the
      // swing-scaled prior above — otherwise real data would drag the ¾/½
      // number up toward the full-swing distance instead of refining it.
      num += scaleToSwing(s.neutral, sw)*w; den += w;
    });
    return num/den;
  }
  // No data for this swing bucket specifically — fall back to full-swing learned value, scaled.
  return scaleToSwing(effectiveYardage(club), sw);
}
// Learned yardage: blends your entered stock number with real logged shots,
// weighting recent + flush strikes highest. Stock acts as a prior worth ~4 shots.
function effectiveYardage(club){
  const shots = (club.shots||[]).filter(s => s.strike==='flush' || s.strike==='solid');
  if(!shots.length) return club.yards;
  const PRIOR = 4;
  let num = club.yards * PRIOR, den = PRIOR;
  const recent = shots.slice(-20);
  recent.forEach((s,i)=>{
    const strikeW = s.strike==='flush' ? 1 : 0.4;
    const recencyW = 0.5 + 0.5*((i+1)/recent.length);
    const w = strikeW * recencyW;
    num += s.neutral * w; den += w;
  });
  return num/den;
}
function clubDispersion(club){
  const shots = (club.shots||[]).filter(s => s.strike==='flush' || s.strike==='solid');
  if(shots.length < 3) return null;
  const v = shots.map(s=>s.neutral);
  const mean = v.reduce((a,b)=>a+b,0)/v.length;
  const sd = Math.sqrt(v.reduce((a,b)=>a+Math.pow(b-mean,2),0)/v.length);
  return {sd, n:v.length};
}
// Chronic short/long bias vs. the number you were actually trying to hit
function clubBias(club){
  const shots = (club.shots||[]).filter(s => typeof s.target === 'number');
  if(shots.length < 3) return null;
  const diffs = shots.map(s => s.actual - s.target);
  return {bias: diffs.reduce((a,b)=>a+b,0)/diffs.length, n:diffs.length};
}
// Average roll-out after landing, so we can estimate carry = neutral - roll
function clubRoll(club){
  const shots = (club.shots||[]).filter(s => typeof s.roll === 'number');
  if(shots.length < 3) return null;
  return {roll: shots.reduce((a,s)=>a+s.roll,0)/shots.length, n:shots.length};
}
// Miss-direction tendency: only counts shots where a direction other than 'center' was logged
function clubDirectionBias(club){
  const shots = (club.shots||[]).filter(s => s.direction);
  if(shots.length < 5) return null;
  const misses = shots.filter(s=>s.direction!=='center');
  if(misses.length < 3) return {n:shots.length, dominant:null};
  const left = misses.filter(s=>s.direction==='left').length;
  const right = misses.filter(s=>s.direction==='right').length;
  const dom = left>right ? 'left' : right>left ? 'right' : null;
  const domPct = dom ? Math.round(Math.max(left,right)/misses.length*100) : 0;
  const shortCount = shots.filter(s=>typeof s.target==='number' && (s.actual-s.target) < -3).length;
  const longCount = shots.filter(s=>typeof s.target==='number' && (s.actual-s.target) > 3).length;
  const distDom = shortCount>longCount ? 'short' : longCount>shortCount ? 'long' : null;
  const distPct = distDom ? Math.round(Math.max(shortCount,longCount)/shots.length*100) : 0;
  return {n:shots.length, missN:misses.length, dominant: domPct>=60 ? dom : null, domPct,
    distDominant: distPct>=50 ? distDom : null, distPct};
}
// Compound pattern: a specific lie tends to produce a specific miss direction/short-long result
function lieShotPattern(lieId){
  let shots = [];
  bag.forEach(c=>(c.shots||[]).forEach(s=>{ if(s.lie===lieId && s.direction) shots.push(s); }));
  if(shots.length < 5) return null;
  const misses = shots.filter(s=>s.direction!=='center');
  if(misses.length < 4) return null;
  const left = misses.filter(s=>s.direction==='left').length;
  const right = misses.filter(s=>s.direction==='right').length;
  const dom = left>right ? 'left' : right>left ? 'right' : null;
  const domPct = dom ? Math.round(Math.max(left,right)/misses.length*100) : 0;
  const shortCount = shots.filter(s=>typeof s.target==='number' && (s.actual-s.target) < -3).length;
  const shortPct = Math.round(shortCount/shots.length*100);
  return {n:shots.length, dominant: domPct>=60?dom:null, domPct, shortPct};
}
// On-course approach miss pattern: uses the Miss Distance/Miss Direction logged
// against Green In Regulation on actual rounds, grouped by club into the green.
function approachMissPattern(clubName, fullRounds){
  let misses = [];
  (fullRounds||[]).forEach(r=>(r.holes||[]).forEach(h=>{
    if(h.club===clubName && h.gir==='miss' && (h.girMissDist || h.girMissDir)) misses.push(h);
  }));
  if(misses.length < 5) return null;
  const left = misses.filter(h=>h.girMissDir==='left').length;
  const right = misses.filter(h=>h.girMissDir==='right').length;
  const dirDom = left>right ? 'left' : right>left ? 'right' : null;
  const dirPct = dirDom ? Math.round(Math.max(left,right)/misses.length*100) : 0;
  const short = misses.filter(h=>h.girMissDist==='short').length;
  const long = misses.filter(h=>h.girMissDist==='long').length;
  const distDom = short>long ? 'short' : long>short ? 'long' : null;
  const distPct = distDom ? Math.round(Math.max(short,long)/misses.length*100) : 0;
  return {n:misses.length, dirDom: dirPct>=50?dirDom:null, dirPct, distDom: distPct>=50?distDom:null, distPct};
}
// On-course approach miss pattern grouped by the lie the approach was hit from,
// instead of by club — ties the practice-log lie tendency to real rounds.
function onCourseLiePattern(lieId, fullRounds){
  let misses = [];
  (fullRounds||[]).forEach(r=>(r.holes||[]).forEach(h=>{
    if(h.approachLie===lieId && h.gir==='miss' && (h.girMissDist || h.girMissDir)) misses.push(h);
  }));
  if(misses.length < 5) return null;
  const left = misses.filter(h=>h.girMissDir==='left').length;
  const right = misses.filter(h=>h.girMissDir==='right').length;
  const dirDom = left>right ? 'left' : right>left ? 'right' : null;
  const dirPct = dirDom ? Math.round(Math.max(left,right)/misses.length*100) : 0;
  const short = misses.filter(h=>h.girMissDist==='short').length;
  const long = misses.filter(h=>h.girMissDist==='long').length;
  const distDom = short>long ? 'short' : long>short ? 'long' : null;
  const distPct = distDom ? Math.round(Math.max(short,long)/misses.length*100) : 0;
  return {n:misses.length, dirDom: dirPct>=50?dirDom:null, dirPct, distDom: distPct>=50?distDom:null, distPct};
}
// On-course tee shot miss pattern, grouped by club off the tee. Fairway misses
// are lateral-only (no long/short axis), so this tracks direction plus how
// often the miss was a "bad" one (well off the fairway) vs. just the first cut.
function teeMissPattern(clubName, fullRounds){
  let misses = [];
  (fullRounds||[]).forEach(r=>(r.holes||[]).forEach(h=>{
    if(h.teeClub===clubName && h.fir==='miss' && h.firMissDir) misses.push(h);

  const badCount = misses.filter(h=>h.firMissSeverity==='bad').length;
  const badPct = Math.round(badCount/misses.length*100);
  return {n:misses.length, dom: domPct>=60?dom:null, domPct, badPct};
}
function allShotsCount(){

}

// Condition multiplier for a given swing's trajectory. Wind is the only component
// that's trajectory-dependent — a knockdown ¾ swing flies lower and holds wind better,
// so its wind term is attenuated by the swing's knockdown factor.
function conditionMultiplier(s, swingId){
  const sw = SWINGS.find(x=>x.id===swingId) || {knock:1};
  const lie = LIES.find(l=>l.id===s.lie) || LIES[0];
  const slope = SLOPES.find(l=>l.id===s.slope) || SLOPES[0];
  let m = 1;
  const knock = sw.knock!==undefined ? sw.knock : 1;
  if(s.windDir==='head')      m *= (1 + 0.010*s.windMph*knock);
  else if(s.windDir==='tail') m *= (1 - 0.005*s.windMph*knock);
  else if(s.windDir==='cross')m *= (1 + 0.0015*s.windMph*knock);
  m *= lie.mult;
  m *= slope.mult;
  m *= (1 + 0.0015*(70 - s.tempF));      // cold air = plays longer
  m /= (1 + 0.02*(s.alt/1000));          // altitude = plays shorter
  return m;
}
function computePlaysLike(s, swingId){
  const elevYds = s.elev/3;              // ~1 yard per 3 feet
  const m = conditionMultiplier(s, swingId||'full');
  const pl = (s.target + elevYds) * m;
  const parts = [];
  if(Math.abs(elevYds) >= 1) parts.push(`${s.elev>0?'Uphill':'Downhill'} ${s.elev>0?'+':''}${Math.round(elevYds)}y`);
  if(s.windDir!=='none' && s.windMph>0){
    const sw = SWINGS.find(x=>x.id===(swingId||'full'));
    const knock = sw ? sw.knock : 1;
    const w = (s.windDir==='head' ? 0.010 : s.windDir==='tail' ? -0.005 : 0.0015) * knock;
    parts.push(`${s.windDir==='head'?'Into':s.windDir==='tail'?'Down':'Cross'} ${s.windMph}mph ${w>0?'+':''}${Math.round(s.target*w*s.windMph)}y`);
  }
  const lie = LIES.find(l=>l.id===s.lie);
  if(lie && lie.mult!==1) parts.push(`${lie.label} ${lie.mult>1?'+':''}${Math.round(s.target*(lie.mult-1))}y`);
  const slope = SLOPES.find(l=>l.id===s.slope);
  if(slope && slope.mult!==1) parts.push(`${slope.label} ${slope.mult>1?'+':''}${Math.round(s.target*(slope.mult-1))}y`);
  if(s.tempF!==70) parts.push(`${s.tempF}°F ${s.tempF<70?'+':''}${Math.round(s.target*0.0015*(70-s.tempF))}y`);
  if(s.alt>0) parts.push(`${s.alt}ft alt −${Math.round(s.target*0.02*(s.alt/1000))}y`);
  return {playsLike: pl, parts};
}

function recommendClubs(shotState){
  let opts = [];
  bag.forEach(club=>{
    SWINGS.forEach(sw=>{
      // Half swings are a wedge shot. Three-quarters works for wedges and short irons.
      // Nobody manufactures a half 5-iron, so don't offer one.
      const stockEff = effectiveYardageForSwing(club, sw.id);
      if(sw.id==='half'  && club.cat!=='wedge') return;
      if(sw.id==='three' && !(club.cat==='wedge' || (club.cat==='iron' && stockEff <= 150))) return;
      if(sw.id==='extra' && (club.cat==='wood' || club.cat==='hybrid')) return;

      const y = stockEff;
      const {playsLike} = computePlaysLike(shotState, sw.id);
      const diff = y - playsLike;
      let score = Math.abs(diff)*1.0 + sw.penalty;
      const n = (club.shots||[]).length;
      score += Math.max(0, 3-n) * 1.5;                          // trust well-tested clubs more
      if(shotState.trouble!=='none' && sw.id==='extra') score += 6;  // no hero swings near trouble
      const roll = clubRoll(club);
      const carryY = roll ? y - roll.roll : null;
      if(shotState.mustCarry && carryY!==null){
        if(shotState.trouble==='short' && carryY < playsLike+2) score += 10;
      } else {
        if(shotState.trouble==='short' && diff < 2)  score += 10;
        if(shotState.trouble==='long'  && diff > -2) score += 10;
      }
      opts.push({club, swing:sw, yards:y, diff, score, playsLike, carryY});
    });
  });
  opts.sort((a,b)=>a.score-b.score);
  const seen = new Set(); const out = [];
  for(const o of opts){
    if(seen.has(o.club.name)) continue;
    seen.add(o.club.name); out.push(o);
    if(out.length===3) break;
  }
  return out;
}

function gapAnalysis(){
  const sorted = bag.map(c=>({name:c.name, y:effectiveYardage(c)})).sort((a,b)=>b.y-a.y);
  const flags = [];
  for(let i=0;i<sorted.length-1;i++){
    const gap = sorted[i].y - sorted[i+1].y;
    if(gap > 16) flags.push({type:'hole', text:`${Math.round(gap)}y gap between ${sorted[i].name} and ${sorted[i+1].name} — that's a yardage you can't cover with a full swing.`});
    else if(gap < 6) flags.push({type:'dupe', text:`Only ${Math.round(gap)}y between ${sorted[i].name} and ${sorted[i+1].name} — those two clubs overlap.`});
  }
  return flags;
}

function causeToDrill(cause){
