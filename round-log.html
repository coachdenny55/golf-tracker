function domainsLinked(d1, d2){
  if(d1.startsWith('clubBias:') || d1.startsWith('clubDirection:')){
    const clubId = d1.split(':').slice(1).join(':');
    const club = bag.find(c=>c.id===clubId);
    if(!club) return false;
    if(club.cat==='wedge' && (d2==='shortgame' || d2.startsWith('girBucket:<50') || d2.startsWith('girBucket:50-100'))) return true;
    if(club.cat==='iron' && d2.startsWith('girBucket:')) return true;
    return false;
  }
  if(d1.startsWith('lieDirection:')){
    if(d2==='shortgame' || d2.startsWith('girBucket:')) return true;
    return false;
  }
  if(d1.startsWith('girMissPattern:')){
    if(d2==='shortgame' || d2.startsWith('girBucket:')) return true;
    return false;
  }
  if(d1.startsWith('girByLie:') || d1.startsWith('lieDirectionCourse:')){
    if(d2==='shortgame' || d2.startsWith('girBucket:') || d2.startsWith('girMissPattern:') || d1.split(':')[1]===d2.split(':')[1]) return true;
    return false;
  }
  if(d1.startsWith('teeClubFIR:') || d1.startsWith('teeMissPattern:')){
    if(d2==='blowup:teeshot' || d1.split(':').slice(1).join(':')===d2.split(':').slice(1).join(':')) return true;
    return false;
  }
  return false;
}

function computeFocusCandidates(fullRounds){
  const coldStart = history.length < 8;
  let candidates = [];

  let girByBucket = {}, girByLie = {}, girHitTotal=0, girAttemptsTotal=0;
  let teeClubStats = {};
  let scrambleHit=0, scrambleAttempts=0;
  let puttsIn10={made:0,total:0}, putts25={threePlus:0,total:0};
  let blowupCounts = {}, blowupTotal = 0;
  let parStats = {3:{n:0,sumToPar:0},4:{n:0,sumToPar:0},5:{n:0,sumToPar:0}};

  fullRounds.forEach(r=>{
    (r.holes||[]).forEach(h=>{
      if(h.gir!==null){
        girAttemptsTotal++;
        if(h.gir==='hit') girHitTotal++;
        if(h.approach){
          girByBucket[h.approach] = girByBucket[h.approach]||{hit:0,total:0};
          girByBucket[h.approach].total++;
          if(h.gir==='hit') girByBucket[h.approach].hit++;
        }
        if(h.approachLie){
          girByLie[h.approachLie] = girByLie[h.approachLie]||{hit:0,total:0};
          girByLie[h.approachLie].total++;
          if(h.gir==='hit') girByLie[h.approachLie].hit++;
        }
        if(h.gir==='miss' && h.ud!==null){
          scrambleAttempts++;
          if(h.ud==='yes') scrambleHit++;
        }
      }
      if(h.par!==3 && h.teeClub && h.fir!==null){
        teeClubStats[h.teeClub] = teeClubStats[h.teeClub]||{hit:0,total:0};
        teeClubStats[h.teeClub].total++;
        if(h.fir==='hit') teeClubStats[h.teeClub].hit++;
      }
      if(h.puttDist==='in10'){ puttsIn10.total++; if(h.putts===1) puttsIn10.made++; }
      if(h.puttDist==='25plus'){ putts25.total++; if(h.putts>=3) putts25.threePlus++; }
      if(h.blowup){ blowupTotal++; blowupCounts[h.blowup] = (blowupCounts[h.blowup]||0)+1; }
      if(parStats[h.par]){ parStats[h.par].n++; parStats[h.par].sumToPar += (h.score-h.par); }
    });
  });

  const girOverallPct = girAttemptsTotal? girHitTotal/girAttemptsTotal*100 : null;

  Object.entries(girByBucket).forEach(([bucket,v])=>{
    if(v.total<5) return;
    const pct = v.hit/v.total*100;
    const baseline = coldStart ? BENCH.gir : (girOverallPct!==null?girOverallPct:BENCH.gir);
    const deficit = baseline - pct;
    if(deficit>=12){
      candidates.push({
        key:`girBucket:${bucket}`, tier:'symptom', domain:`girBucket:${bucket}`,
        severity: deficit*Math.sqrt(v.total), n:v.total,
        line:`Approach shots from ${bucket}y are your weak spot — ${Math.round(pct)}% GIR vs ${coldStart?'the':'your own'} ${Math.round(baseline)}% ${coldStart?'benchmark':'average'}.`,
        detail:`Over your last ${fullRounds.length} rounds, you've hit ${v.hit} of ${v.total} greens from ${bucket} yards (${Math.round(pct)}%) — below ${coldStart?'the 44% benchmark for breaking 80':'your own overall GIR rate of '+Math.round(baseline)+'%'}.`,
        drillTitle:`Approach drill — ${bucket}y`,
        drillBody:`Hit 10 balls from ${bucket} yards. Log the carry distance and miss direction for every one — no mulligans.`,
        reassessLabel:`GIR% from ${bucket}y`
      });
    }
  });

  Object.entries(girByLie).forEach(([lieId,v])=>{
    if(v.total<5) return;
    const lie = LIES.find(l=>l.id===lieId);
    if(!lie) return;
    const pct = v.hit/v.total*100;
    const baseline = coldStart ? BENCH.gir : (girOverallPct!==null?girOverallPct:BENCH.gir);
    const deficit = baseline - pct;
    if(deficit>=12){
      candidates.push({
        key:`girByLie:${lieId}`, tier:'symptom', domain:`girByLie:${lieId}`,
        severity: deficit*Math.sqrt(v.total), n:v.total,
        line:`Approach shots from ${lie.label.toLowerCase()} are a weak spot — ${Math.round(pct)}% GIR vs ${coldStart?'the':'your own'} ${Math.round(baseline)}% ${coldStart?'benchmark':'average'}.`,
        detail:`Over your last ${fullRounds.length} rounds, you've hit ${v.hit} of ${v.total} greens from ${lie.label.toLowerCase()} (${Math.round(pct)}%) — below ${coldStart?'the 44% benchmark for breaking 80':'your own overall GIR rate of '+Math.round(baseline)+'%'}.`,
        drillTitle:`Approach drill — ${lie.label.toLowerCase()}`,
        drillBody:`Drop 10 balls in ${lie.label.toLowerCase()} and hit approach shots at a real target, tracking Miss Distance and Miss Direction the same way you do on the course.`,
        reassessLabel:`GIR% from ${lie.label.toLowerCase()}`
      });
    }
  });

  const teeClubEntries = Object.entries(teeClubStats)
    .filter(([,v])=>v.total>=5)
    .map(([name,v])=>({name, pct: v.hit/v.total*100, hit:v.hit, total:v.total}));
  if(teeClubEntries.length>=2){
    teeClubEntries.sort((a,b)=>b.pct-a.pct);
    const best = teeClubEntries[0], worst = teeClubEntries[teeClubEntries.length-1];
    const gap = best.pct - worst.pct;
    if(gap>=20){
      candidates.push({
        key:`teeClubFIR:${worst.name}`, tier:'symptom', domain:`teeClubFIR:${worst.name}`,
        severity: gap*Math.sqrt(worst.total)*0.5, n:worst.total,
        line:`Off the tee, ${worst.name} finds the fairway ${Math.round(worst.pct)}% of the time vs ${Math.round(best.pct)}% with ${best.name} — worth laying up more.`,
        detail:`Over your last ${fullRounds.length} rounds: ${worst.name} hit ${worst.hit} of ${worst.total} fairways (${Math.round(worst.pct)}%), while ${best.name} hit ${best.hit} of ${best.total} (${Math.round(best.pct)}%). That's a real enough gap to change strategy on tight driving holes.`,
        drillTitle:`${worst.name} vs ${best.name} — course strategy`,
        drillBody:`On your next tight driving hole, hit ${best.name} instead of ${worst.name} and track the fairway result. If the gap holds, make it the default.`,
        reassessLabel:`${worst.name} FIR%`
      });
    }
  }

  if(scrambleAttempts>=5){
    const pct = scrambleHit/scrambleAttempts*100;
    if(BENCH.scrambling - pct >= 12){
      candidates.push({
        key:'scrambling', tier:'symptom', domain:'shortgame',
        severity:(BENCH.scrambling-pct)*Math.sqrt(scrambleAttempts), n:scrambleAttempts,
        line:`Scrambling is costing you strokes — ${Math.round(pct)}% up-and-down vs a ${BENCH.scrambling}% target.`,
        detail:`You've saved par ${scrambleHit} of ${scrambleAttempts} times you missed the green over your last ${fullRounds.length} rounds (${Math.round(pct)}%). Solid amateur scrambling sits closer to ${BENCH.scrambling}%.`,
        drillTitle:'Up-and-down circuit',
        drillBody:'9 balls around the practice green — 3 from light rough, 3 from a bunker, 3 from a tight fairway lie. One shot each. Count how many finish inside a 6-foot circle.',
        reassessLabel:'Scrambling%'
      });
    }
  }

  if(putts25.total>=5){
    const pct = putts25.threePlus/putts25.total*100;
    if(pct - BENCH.threePutt >= 10){
      candidates.push({
        key:'threePutt', tier:'symptom', domain:'puttingLong',
        severity:(pct-BENCH.threePutt)*Math.sqrt(putts25.total), n:putts25.total,
        line:`Lag putting is leaking strokes — ${Math.round(pct)}% of your 25ft+ putts turn into 3-putts.`,
        detail:`From 25+ feet, ${putts25.threePlus} of your last ${putts25.total} first putts led to a 3-putt (${Math.round(pct)}%) — above the ~${BENCH.threePutt}% you'd expect with decent speed control.`,
        drillTitle:'Lag putting ladder',
        drillBody:'Putt 5 balls from 30, 40, and 50 feet. Count how many finish inside a 3-foot circle. Aim for 4 of 5 at each distance.',
        reassessLabel:'3-putt rate from 25+ feet'
      });
    }
  }

  if(puttsIn10.total>=5){
    const pct = puttsIn10.made/puttsIn10.total*100;
    if(BENCH.shortPutt - pct >= 15){
      candidates.push({
        key:'shortPutt', tier:'symptom', domain:'puttingShort',
        severity:(BENCH.shortPutt-pct)*Math.sqrt(puttsIn10.total), n:puttsIn10.total,
        line:`Short putts aren't dropping — ${Math.round(pct)}% made from inside 10 feet.`,
        detail:`You've holed ${puttsIn10.made} of ${puttsIn10.total} first putts from inside 10 feet (${Math.round(pct)}%), below the ~${BENCH.shortPutt}% mark that separates rounds in the 70s.`,
        drillTitle:'5-foot circuit',
        drillBody:'Putt 10 straight 5-footers in a row. Track makes out of 10. Miss one — start the count back over from 0.',
        reassessLabel:'Make rate from inside 10 feet'
      });
    }
  }

  if(blowupTotal>=3){
    const worst = Object.entries(blowupCounts).sort((a,b)=>b[1]-a[1])[0];
    const [cause,count] = worst;
    const pct = count/blowupTotal*100;
    if(pct>=40){
      const causeLabel = BLOWUP_LABELS[cause]||cause;
      candidates.push({
        key:`blowup:${cause}`, tier:'symptom', domain:`blowup:${cause}`,
        severity: pct*Math.sqrt(blowupTotal)*0.6, n:blowupTotal,
        line:`Your blow-up holes have a pattern — ${causeLabel} is behind ${count} of your last ${blowupTotal}.`,
        detail:`When you card a double-bogey or worse, it traces back to ${causeLabel} ${Math.round(pct)}% of the time over your last ${fullRounds.length} rounds.`,
        drillTitle:`Blow-up prevention — ${causeLabel}`,
        drillBody: causeToDrill(cause),
        reassessLabel:`Frequency of "${causeLabel}" blow-up holes`
      });
    }
  }

  const parEntries = Object.entries(parStats).filter(([,v])=>v.n>=5);
  if(parEntries.length>=2){
    parEntries.forEach(([par,v])=>{
      const others = parEntries.filter(([p])=>p!==par);
      if(!others.length) return;
      const othersAvg = others.reduce((a,[,ov])=>a+ov.sumToPar/ov.n,0)/others.length;
      const thisAvg = v.sumToPar/v.n;
      const gap = thisAvg - othersAvg;
      if(gap>=0.35){
        candidates.push({
          key:`parSplit:${par}`, tier:'symptom', domain:`parSplit:${par}`,
          severity: gap*10*Math.sqrt(v.n), n:v.n,
          line:`Par ${par}s are quietly costing you shots — averaging ${thisAvg>=0?'+':''}${thisAvg.toFixed(1)} vs ${othersAvg>=0?'+':''}${othersAvg.toFixed(1)} elsewhere.`,
          detail:`Across ${v.n} par-${par} holes in your last ${fullRounds.length} rounds, you're averaging ${thisAvg>=0?'+':''}${thisAvg.toFixed(1)} to par — about ${gap.toFixed(1)} strokes worse per hole than your other par types.`,
          drillTitle:`Par ${par} focus`,
          drillBody:`Track your next 5 par-${par} holes specifically — club and result off the tee, and where any miss happens. Look for one repeated mistake.`,
          reassessLabel:`Avg score to par on Par ${par}s`
        });
      }
    });
  }

  bag.forEach(c=>{
    const b = clubBias(c);
    if(b && b.n>=5 && Math.abs(b.bias)>=4){
      candidates.push({
        key:`clubBias:${c.id}`, tier:'root', domain:`clubBias:${c.id}`,
        severity: Math.abs(b.bias)*Math.sqrt(b.n)*0.8, n:b.n,
        line:`Your ${c.name} is running ${b.bias>0?'long':'short'} — averaging ${b.bias>0?'+':''}${b.bias.toFixed(1)}y vs. target.`,
        detail:`Over ${b.n} logged shots, your ${c.name} has averaged ${b.bias>0?'+':''}${b.bias.toFixed(1)} yards vs. the number you aimed at. ${b.bias<0?'Chronically short — the stock number is optimistic.':'Consistently flying it past the target.'}`,
        drillTitle:`${c.name} distance check`,
        drillBody:`Hit 10 ${c.name} shots, flush strikes only. Log actual carry every time — no eyeballing it.`,
        reassessLabel:`${c.name} distance bias`
      });
    }
    const d = clubDirectionBias(c);
    if(d && d.dominant){
      const distNote = d.distDominant ? ` and tends to finish ${d.distDominant} as well` : '';
      candidates.push({
        key:`clubDirection:${c.id}`, tier:'root', domain:`clubDirection:${c.id}`,
        severity: d.domPct*Math.sqrt(d.missN)*0.5, n:d.missN,
        line:`Your ${c.name} misses ${d.dominant} ${d.domPct}% of the time it misses${d.distDominant?`, often ${d.distDominant} and ${d.dominant}`:''}.`,
        detail:`Across ${d.n} logged ${c.name} shots, ${d.missN} were off-center, and ${d.domPct}% of those missed ${d.dominant}${distNote}. Worth favoring the opposite side of the target until it's fixed.`,
        drillTitle:`${c.name} start-line drill`,
        drillBody:`Set two alignment sticks as a gate just outside the ball on your target line. Hit 10 balls with your ${c.name} — the ball has to start through the gate. Track how many still miss ${d.dominant}.`,
        reassessLabel:`${c.name} miss direction`
      });
    }
  });

  CLUBS.forEach(clubName=>{
    const m = approachMissPattern(clubName, fullRounds);
    if(m && (m.dirDom || m.distDom)){
      const both = m.dirDom && m.distDom;
      const whereText = both ? `${m.distDom} and ${m.dirDom}` : (m.distDom || m.dirDom);
      candidates.push({
        key:`girMissPattern:${clubName}`, tier:'root', domain:`girMissPattern:${clubName}`,
        severity: Math.max(m.dirPct,m.distPct)*Math.sqrt(m.n)*0.5, n:m.n,
        line:`On the course, your ${clubName} into the green tends to miss ${whereText} of the target.`,
        detail:`Across ${m.n} logged missed greens with your ${clubName} in play, ${both ? `misses skewed ${m.distDom} ${m.distPct}% of the time and ${m.dirDom} ${m.dirPct}% of the time` : (m.distDom ? `${m.distPct}% finished ${m.distDom}` : `${m.dirPct}% missed ${m.dirDom}`)}. Worth knowing which side of the pin to bail out to before you commit to the shot.`,
        drillTitle:`${clubName} approach drill`,
        drillBody:`Hit 10 ${clubName} approach shots at a real target. Log Miss Distance and Miss Direction the same way you do on the course, and see if the pattern holds.`,
        reassessLabel:`${clubName} approach miss pattern`
      });
    }
  });

  LIES.forEach(lie=>{
    const p = lieShotPattern(lie.id);
    if(p && p.dominant){
      const shortNote = p.shortPct>=50 ? ` and comes up short ${p.shortPct}% of the time` : '';
      candidates.push({
        key:`lieDirection:${lie.id}`, tier:'root', domain:`lieDirection:${lie.id}`,
        severity: p.domPct*Math.sqrt(p.n)*0.55, n:p.n,
        line:`Shots from ${lie.label.toLowerCase()} consistently miss ${p.dominant}${shortNote}.`,
        detail:`Across ${p.n} logged shots from ${lie.label.toLowerCase()}, misses skew ${p.dominant} ${p.domPct}% of the time${shortNote}. Worth knowing before the shot, not just after.`,
        drillTitle:`${lie.label} lie drill`,
        drillBody:`Drop 9 balls in ${lie.label.toLowerCase()} — one swing each, log carry distance and direction. Compare the pattern to your fairway numbers with the same club.`,
        reassessLabel:`${lie.label} miss tendency`
      });
    }
    const oc = onCourseLiePattern(lie.id, fullRounds);
    if(oc && (oc.dirDom || oc.distDom)){
      const both = oc.dirDom && oc.distDom;
      const whereText = both ? `${oc.distDom} and ${oc.dirDom}` : (oc.distDom || oc.dirDom);
      candidates.push({
        key:`lieDirectionCourse:${lie.id}`, tier:'root', domain:`lieDirectionCourse:${lie.id}`,
        severity: Math.max(oc.dirPct,oc.distPct)*Math.sqrt(oc.n)*0.5, n:oc.n,
        line:`On the course, approach shots from ${lie.label.toLowerCase()} tend to miss ${whereText} of the target.`,
        detail:`Across ${oc.n} logged missed greens hit from ${lie.label.toLowerCase()}, ${both ? `misses skewed ${oc.distDom} ${oc.distPct}% of the time and ${oc.dirDom} ${oc.dirPct}% of the time` : (oc.distDom ? `${oc.distPct}% finished ${oc.distDom}` : `${oc.dirPct}% missed ${oc.dirDom}`)}. Worth checking whether this matches your range sessions from the same lie.`,
        drillTitle:`${lie.label} approach drill`,
        drillBody:`Drop 10 balls in ${lie.label.toLowerCase()} and hit approach shots at a real target, tracking Miss Distance and Miss Direction the same way you do on the course.`,
        reassessLabel:`${lie.label} approach miss pattern (course)`
      });
    }
  });

  CLUBS.forEach(clubName=>{
    const tm = teeMissPattern(clubName, fullRounds);
    if(tm && tm.dom){
      const badNote = tm.badPct>=50 ? `, and ${tm.badPct}% of those are well off the fairway — real trouble, not just first cut` : '';
      candidates.push({
        key:`teeMissPattern:${clubName}`, tier:'root', domain:`teeMissPattern:${clubName}`,
        severity: tm.domPct*Math.sqrt(tm.n)*0.5, n:tm.n,
        line:`Off the tee, your ${clubName} misses ${tm.dom} ${tm.domPct}% of the time it misses the fairway.`,
        detail:`Across ${tm.n} logged missed fairways with ${clubName} in play, ${tm.domPct}% missed ${tm.dom}${badNote}. Favor the opposite side of the fairway at address until this evens out.`,
        drillTitle:`${clubName} tee-shot start-line drill`,
        drillBody:`Set an alignment gate on your target line and hit 10 tee shots with your ${clubName}. Track how many still miss ${tm.dom}.`,
        reassessLabel:`${clubName} tee shot miss direction`
      });
    }
  });

  candidates.sort((a,b)=>b.severity-a.severity);
  if(!candidates.length) return [];
  // Root-cause candidates take priority over symptom candidates for the #1 slot,
  // regardless of raw severity — that was the explicit call: fix the swing pattern
  // before chasing the scoreboard number it produces.
  const roots = candidates.filter(c=>c.tier==='root');
  const symptoms = candidates.filter(c=>c.tier==='symptom');
  const first = roots.length ? roots[0] : symptoms[0];
  const picked = [first];
  for(const c of candidates){
    if(c===first) continue;
    if(domainsLinked(first.domain, c.domain)) continue;
    picked.push(c);
    break;
  }
  return picked;
}

async function refreshFocus(){
  const n = Math.min(history.length, 8);
  const recentSummaries = history.slice(0, n);
  const fullRounds = [];
  for(const s of recentSummaries){
    try{
      const r = await window.storage.get('round:'+s.id);
      if(r && r.value) fullRounds.push({...JSON.parse(r.value), id:s.id, date:s.date});
    }catch(e){ /* round data missing, skip */ }
  }
  cachedFullRounds = fullRounds;
  cachedFocus = computeFocusCandidates(fullRounds);
}

function computeMetricValue(key, roundsSubset){
  if(key.startsWith('girBucket:')){
    const bucket = key.split(':')[1];
    let hit=0,total=0;
    roundsSubset.forEach(r=>(r.holes||[]).forEach(h=>{ if(h.approach===bucket && h.gir!==null){ total++; if(h.gir==='hit') hit++; } }));
    return total>=1 ? {value:hit/total*100,n:total} : null;
  }
  if(key==='scrambling'){
    let hit=0,total=0;
    roundsSubset.forEach(r=>(r.holes||[]).forEach(h=>{ if(h.gir==='miss' && h.ud!==null){ total++; if(h.ud==='yes') hit++; } }));
    return total>=1?{value:hit/total*100,n:total}:null;
  }
  if(key==='threePutt'){
    let tp=0,total=0;
    roundsSubset.forEach(r=>(r.holes||[]).forEach(h=>{ if(h.puttDist==='25plus'){ total++; if(h.putts>=3) tp++; } }));
    return total>=1?{value:tp/total*100,n:total}:null;
  }
  if(key==='shortPutt'){
    let made=0,total=0;
    roundsSubset.forEach(r=>(r.holes||[]).forEach(h=>{ if(h.puttDist==='in10'){ total++; if(h.putts===1) made++; } }));
    return total>=1?{value:made/total*100,n:total}:null;
  }
  if(key.startsWith('blowup:')){
    const cause = key.split(':')[1];
    let count=0, totalBlow=0;
    roundsSubset.forEach(r=>(r.holes||[]).forEach(h=>{ if(h.blowup){ totalBlow++; if(h.blowup===cause) count++; } }));
    return totalBlow>=1?{value:count/totalBlow*100,n:totalBlow}:null;
  }
  if(key.startsWith('parSplit:')){
    const par = Number(key.split(':')[1]);
    let n=0,sum=0;
    roundsSubset.forEach(r=>(r.holes||[]).forEach(h=>{ if(h.par===par){ n++; sum+=(h.score-h.par); } }));
    return n>=1?{value:sum/n,n}:null;
  }
  if(key.startsWith('girMissPattern:')){
    const clubName = key.split(':').slice(1).join(':');
    let misses=[];
    roundsSubset.forEach(r=>(r.holes||[]).forEach(h=>{
      if(h.club===clubName && h.gir==='miss' && (h.girMissDist||h.girMissDir)) misses.push(h);
    }));
    if(!misses.length) return null;
    const offCenter = misses.filter(h=>h.girMissDist!=='pin' || h.girMissDir!=='center').length;
    return {value: offCenter/misses.length*100, n:misses.length};
  }
  if(key.startsWith('girByLie:')){
    const lieId = key.split(':')[1];
    let hit=0,total=0;
    roundsSubset.forEach(r=>(r.holes||[]).forEach(h=>{ if(h.approachLie===lieId && h.gir!==null){ total++; if(h.gir==='hit') hit++; } }));
    return total>=1?{value:hit/total*100,n:total}:null;
  }
  if(key.startsWith('lieDirectionCourse:')){
    const lieId = key.split(':')[1];
    let misses=[];
    roundsSubset.forEach(r=>(r.holes||[]).forEach(h=>{
      if(h.approachLie===lieId && h.gir==='miss' && (h.girMissDist||h.girMissDir)) misses.push(h);
    }));
    if(!misses.length) return null;
    const offCenter = misses.filter(h=>h.girMissDist!=='pin' || h.girMissDir!=='center').length;
    return {value: offCenter/misses.length*100, n:misses.length};
  }
  if(key.startsWith('teeClubFIR:')){
    const clubName = key.split(':').slice(1).join(':');
    let hit=0,total=0;
    roundsSubset.forEach(r=>(r.holes||[]).forEach(h=>{ if(h.par!==3 && h.teeClub===clubName && h.fir!==null){ total++; if(h.fir==='hit') hit++; } }));
    return total>=1?{value:hit/total*100,n:total}:null;
  }
  if(key.startsWith('teeMissPattern:')){
    const clubName = key.split(':').slice(1).join(':');
    let misses=[];
    roundsSubset.forEach(r=>(r.holes||[]).forEach(h=>{
      if(h.teeClub===clubName && h.fir==='miss' && h.firMissDir) misses.push(h);
    }));
    if(!misses.length) return null;
    const bad = misses.filter(h=>h.firMissSeverity==='bad').length;
    return {value: bad/misses.length*100, n:misses.length};
  }
  return null;
}
function computeClubMetric(key, dateFilterFn){
  if(key.startsWith('clubBias:')){
    const clubId = key.split(':').slice(1).join(':');
    const club = bag.find(c=>c.id===clubId);
    if(!club) return null;
    const shots = (club.shots||[]).filter(s=>typeof s.target==='number' && dateFilterFn(s.date));
    if(!shots.length) return null;
    const diffs = shots.map(s=>s.actual-s.target);
    return {value: diffs.reduce((a,b)=>a+b,0)/diffs.length, n:shots.length};
  }
  if(key.startsWith('clubDirection:') || key.startsWith('lieDirection:')){
    let shots=[];
    if(key.startsWith('clubDirection:')){
      const clubId = key.split(':').slice(1).join(':');
      const club = bag.find(c=>c.id===clubId);
      if(club) shots = (club.shots||[]).filter(s=>s.direction && dateFilterFn(s.date));
    } else {
      const lieId = key.split(':')[1];
      bag.forEach(c=>(c.shots||[]).forEach(s=>{ if(s.lie===lieId && s.direction && dateFilterFn(s.date)) shots.push(s); }));
    }
    if(!shots.length) return null;
    const misses = shots.filter(s=>s.direction!=='center');
    return {value: misses.length/shots.length*100, n:shots.length};
  }
  return null;
}
function beforeAfterFor(key){
  const entries = practiceLog.filter(p=>p.focusKey===key);
  if(!entries.length) return null;
  const firstDate = entries.map(e=>e.date).sort()[0];
  const isClubLevel = key.startsWith('clubBias:') || key.startsWith('clubDirection:') || key.startsWith('lieDirection:');
  if(isClubLevel){
    return {before: computeClubMetric(key, d=>d<firstDate), after: computeClubMetric(key, d=>d>=firstDate), firstDate};
  }
  const beforeRounds = cachedFullRounds.filter(r=>r.date<firstDate);
  const afterRounds = cachedFullRounds.filter(r=>r.date>=firstDate);
  return {before: computeMetricValue(key, beforeRounds), after: computeMetricValue(key, afterRounds), firstDate};
}

// ---------- IndexedDB-backed storage (matches the artifact window.storage shape) ----------
const DB_NAME = 'round-log-db', DB_VERSION = 1, STORE_NAME = 'kv';
let _dbPromise = null;
function openDB(){
  if(_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(STORE_NAME, {keyPath:'key'}); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return _dbPromise;
}
window.storage = {
  async get(key){
    const db = await openDB();
    return new Promise((resolve, reject)=>{
      const req = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).get(key);
      req.onsuccess = ()=> resolve(req.result ? {key: req.result.key, value: req.result.value} : null);
      req.onerror = ()=> reject(req.error);
    });
  },
  async set(key, value){
    const db = await openDB();
    return new Promise((resolve, reject)=>{
      const req = db.transaction(STORE_NAME, 'readwrite').objectStore(STORE_NAME).put({key, value});
      req.onsuccess = ()=> resolve();
      req.onerror = ()=> reject(req.error);
    });
  },
  async delete(key){
    const db = await openDB();
    return new Promise((resolve, reject)=>{
      const req = db.transaction(STORE_NAME, 'readwrite').objectStore(STORE_NAME).delete(key);
      req.onsuccess = ()=> resolve();
      req.onerror = ()=> reject(req.error);
    });
  },
  async list(prefix){
    const db = await openDB();
    return new Promise((resolve, reject)=>{
      const results = [];
      const req = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).openCursor();
      req.onsuccess = e=>{
        const cursor = e.target.result;
        if(cursor){
          if(!prefix || cursor.value.key.startsWith(prefix)) results.push({key: cursor.value.key, value: cursor.value.value});
          cursor.continue();
        } else resolve(results);
      };
      req.onerror = ()=> reject(req.error);
    });
  }
};

function careerStats(hist){
  if(hist.length===0) return null;
  const scores = hist.map(h=>h.score);
  const girs = hist.map(h=>h.girPct);
  const putts = hist.map(h=>h.puttsAvg*18);
  const toPars = hist.map(h=>h.toPar);
  const avg = arr => arr.reduce((a,b)=>a+b,0)/arr.length;
  return {
    rounds: hist.length,
    best: Math.min(...scores),
    bestToPar: toPars[scores.indexOf(Math.min(...scores))],
    avgScore: avg(scores),
    avgGir: Math.round(avg(girs)),
    avgPutts: avg(putts)
  };
}

// ---------- Stat computation ----------
function computeStats(r){
  let totalScore=0, totalPar=0, girHit=0, girAttempts=0, firHit=0, firAttempts=0;
  let putts=0, udHit=0, udAttempts=0;
  let scoreOnGirHit=[], scoreOnGirMiss=[];
  r.holes.forEach(h=>{
    totalScore += Number(h.score)||0;
    totalPar += Number(h.par)||0;
    if(h.gir!==null){
      girAttempts++;
      if(h.gir==='hit'){ girHit++; scoreOnGirHit.push(h.score-h.par); }
      else { scoreOnGirMiss.push(h.score-h.par); if(h.ud!==null){ udAttempts++; if(h.ud==='yes') udHit++; } }
    }
    if(h.par!==3 && h.fir!==null){ firAttempts++; if(h.fir==='hit') firHit++; }
    putts += Number(h.putts)||0;
  });
  const avg = arr => arr.length? (arr.reduce((a,b)=>a+b,0)/arr.length) : null;
  return {
    totalScore, totalPar, toPar: totalScore-totalPar,
    girHit, girAttempts, girPct: girAttempts? Math.round(girHit/girAttempts*100):0,
    firHit, firAttempts, firPct: firAttempts? Math.round(firHit/firAttempts*100):0,
    putts, puttsAvg: (putts/18),
    udHit, udAttempts, udPct: udAttempts? Math.round(udHit/udAttempts*100):0,
    avgOnGirHit: avg(scoreOnGirHit), avgOnGirMiss: avg(scoreOnGirMiss)
  };
}

// Rough, heuristic "where did the strokes go" split — not a rigorous strokes-gained
// model (that needs distance-based PGA baseline tables), just a proportional estimate
// against the same benchmarks used elsewhere, so it's directionally honest, not exact.
function computeStrokesSummary(stats){
  const driving = stats.firAttempts>=3 ? (stats.firPct-60)/100*stats.firAttempts*0.25 : 0;
  const approach = stats.girAttempts>=3 ? (stats.girPct-BENCH.gir)/100*18*0.45 : 0;
  const missedGir = stats.girAttempts - stats.girHit;
  const shortGame = missedGir>0 ? (stats.udPct-BENCH.scrambling)/100*missedGir*0.9 : 0;
  const putting = stats.putts>0 ? (BENCH.putts - stats.putts)*0.85 : 0;
  return {driving, approach, shortGame, putting};
}

function scoreShapeClass(score, par){
  const diff = score - par;
  if(diff<=-2) return 'shape-eagle';
  if(diff===-1) return 'shape-birdie';
  if(diff===0) return 'shape-par';
  if(diff===1) return 'shape-bogey';
  return 'shape-double';
}
function scoreCaption(score,par){
  const diff=score-par;
  if(diff<=-2) return 'Eagle or better';
  if(diff===-1) return 'Birdie';
  if(diff===0) return 'Par';
  if(diff===1) return 'Bogey';
  return diff===2? 'Double bogey' : diff+' over par';
}

// ---------- Insights ----------
function buildInsights(r, stats, hist){
  const holesEntered = r.holes.filter(h=>h.gir!==null).length;
  if(holesEntered < 3){
    return null;
  }
  const insights = [];

  // GIR vs break-80 benchmark
  const girTarget = 8;
  if(stats.girAttempts>0){
    if(stats.girHit < girTarget){
      insights.push(`You've hit <b>${stats.girHit} of ${stats.girAttempts}</b> greens so far (${stats.girPct}%). Rounds in the 70s tend to average around <b>8 of 18</b> — you need roughly ${Math.max(girTarget-stats.girHit,0)} more today to hit that pace.`);
    } else {
      insights.push(`You're at <b>${stats.girHit} of ${stats.girAttempts}</b> greens (${stats.girPct}%) — right in the range that supports scores in the 70s. Keep feeding approach shots.`);
    }
  }

  // Putts benchmark
  if(stats.putts>0){
    const projected = Math.round(stats.puttsAvg*18);
    if(projected>32){
      insights.push(`You're averaging <b>${stats.puttsAvg.toFixed(1)} putts/hole</b>, projecting to about <b>${projected} for 18</b>. Breaking 80 usually means getting closer to <b>31-32 total putts</b>.`);
    } else {
      insights.push(`Your putting pace (<b>~${projected} for 18</b>) is already inside the range that supports low-80s/70s scoring.`);
    }
  }

  // The correlation the user is looking for: GIR vs actual scoring result
  if(stats.avgOnGirHit!==null && stats.avgOnGirMiss!==null){
    const gap = (stats.avgOnGirMiss - stats.avgOnGirHit);
    insights.push(`Here's the correlation: when you hit the green, you're averaging <b>${stats.avgOnGirHit>=0?'+':''}${stats.avgOnGirHit.toFixed(1)} to par</b> on that hole. When you miss it, you're averaging <b>${stats.avgOnGirMiss>=0?'+':''}${stats.avgOnGirMiss.toFixed(1)} to par</b> — a <b>${gap.toFixed(1)}-stroke gap</b>. That gap is your scrambling tax.`);
  }

  // Scrambling
  if(stats.udAttempts>=2){
    insights.push(`Scrambling: you've saved par <b>${stats.udHit} of ${stats.udAttempts}</b> times you missed the green (${stats.udPct}%). Tour average is around 50-60%.`);
  }

  // FIR correlation to GIR
  if(stats.firAttempts>=3){
    const firHoles = r.holes.filter(h=>h.par!==3 && h.fir!==null);
    const hitFir = firHoles.filter(h=>h.fir==='hit');
    const missFir = firHoles.filter(h=>h.fir==='miss');
    const girRate = arr => arr.length? Math.round(arr.filter(h=>h.gir==='hit').length/arr.length*100):null;
    const g1=girRate(hitFir), g2=girRate(missFir);
    if(g1!==null && g2!==null){
      insights.push(`When you find the fairway, your GIR rate is <b>${g1}%</b>. When you miss it, that drops to <b>${g2}%</b>. ${g1-g2>=15?'Driving accuracy is clearly feeding your approach game today.':'The gap is smaller than most golfers assume — your irons may matter more than the driver right now.'}`);
    }
  }

  // Approach distance pattern
  const distBuckets = {};
  r.holes.forEach(h=>{
    if(h.approach && h.gir!==null){
      distBuckets[h.approach] = distBuckets[h.approach]||{hit:0,total:0};
      distBuckets[h.approach].total++;
      if(h.gir==='hit') distBuckets[h.approach].hit++;
    }
  });
  const bucketEntries = Object.entries(distBuckets).filter(([,v])=>v.total>=2);
  if(bucketEntries.length){
    let worst = bucketEntries.reduce((a,b)=> (a[1].hit/a[1].total) < (b[1].hit/b[1].total) ? a : b);
    const pct = Math.round(worst[1].hit/worst[1].total*100);
    if(pct<50){
      insights.push(`Your weakest approach range today is <b>${worst[0]} yards</b> — only ${pct}% GIR from there. That's worth range time this week.`);
    }
  }

  // Cross-round trend
  if(hist.length>=2){
    const recent = hist.slice(0,3);
    const girTrend = recent.map(x=>x.girPct);
    const puttsTrend = recent.map(x=>x.puttsAvg);
    if(girTrend.length>=2){
      const delta = girTrend[0]-girTrend[girTrend.length-1];
      insights.push(`Across your last ${girTrend.length} saved rounds, GIR% has ${delta>0?'improved':delta<0?'dropped':'held steady'} (${girTrend.slice().reverse().join('% → ')}%).`);
    }
  }

  return insights;
}

async function checkForAppUpdate(){
  updateChecking = true;
  updateStatusMsg = 'Checking for updates…';
  render();

  if(!('serviceWorker' in navigator)){
    updateChecking = false;
    updateStatusMsg = 'Service workers are not supported in this browser.';
    render();
    return;
  }

  // Ask the server directly for the live file, bypassing every cache layer
  // this page can bypass — the one check that can't be fooled by a service
  // worker stuck mid-lifecycle (installed PWAs, especially on iOS, are known
  // to be flaky about this). If the live version disagrees with what's
  // running, force a full reset immediately instead of trusting the SW's own
  // update dance to notice.
  let liveVersion = null;
  try{
    const res = await fetch('round-log.html?_check=' + Date.now(), {cache:'no-store'});
    const text = await res.text();
    const match = text.match(/APP_VERSION\s*=\s*'([^']+)'/);
    if(match) liveVersion = match[1];
  }catch(e){ /* offline, or the fetch got blocked — fall back to the SW check below */ }

  if(liveVersion && liveVersion !== APP_VERSION){
    updateStatusMsg = `Found v${liveVersion} — forcing update…`;
    render();
    await forceHardReload();
    return;
  }

  let reg;
  try{ reg = await navigator.serviceWorker.getRegistration(); }catch(e){ /* fall through */ }

  if(!reg){
    updateStatusMsg = 'No service worker found — installing…';
    render();
    try{ await navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}); }catch(e){ /* best effort */ }
    location.reload();
    return;
  }

  // Attach the listener BEFORE triggering the check. On a fast connection the
  // whole install -> activate -> claim cycle can finish inside reg.update(),
  // so checking reg.installing/reg.waiting only afterward can miss it
  // entirely and wrongly report "up to date" even though it just updated.
  navigator.serviceWorker.addEventListener('controllerchange', forceHardReload, {once:true});

  try{
    await reg.update();
  }catch(e){
    navigator.serviceWorker.removeEventListener('controllerchange', forceHardReload);
    updateChecking = false;
    updateStatusMsg = 'Could not reach the server — check your connection and try again.';
    render();
    return;
  }

  const incoming = reg.installing || reg.waiting;
  if(incoming){
    updateStatusMsg = 'Update found — applying now…';
    render();
    setTimeout(forceHardReload, 6000); // safety net if controllerchange never fires
    return;
  }

  navigator.serviceWorker.removeEventListener('controllerchange', forceHardReload);
  updateChecking = false;
  updateStatusMsg = `You're up to date — v${APP_VERSION}.`;
  render();
}

// The actual "force it": unregister the service worker, wipe every Cache
// Storage entry it owns, then hard-navigate with a cache-busting query string
// so neither the browser's HTTP cache nor a CDN edge cache in front of it can
// hand back anything stale. Slower than trusting the SW lifecycle, but it
// can't get stuck the way that can.
async function forceHardReload(){
  try{
    const reg = await navigator.serviceWorker.getRegistration();
    if(reg) await reg.unregister();
  }catch(e){ /* best effort */ }
  try{
    const keys = await caches.keys();
    await Promise.all(keys.map(k => caches.delete(k)));
  }catch(e){ /* best effort */ }
  window.location.href = window.location.pathname + '?_v=' + Date.now();
}

function renderClubRows(){
  const sorted = [...bag].sort((a,b)=>effectiveYardage(b)-effectiveYardage(a));
  return sorted.map(c=>{
    const eff = effectiveYardage(c);
    const disp = clubDispersion(c);
    const drift = eff - c.yards;
    return `
    <div class="bag-row">
      <div class="bn">${escapeHtml(c.name)}</div>
      <input class="by" type="number" inputmode="numeric" data-clubyards="${escapeHtml(c.id)}" value="${c.yards}">
      <div class="beff">
        ${(c.shots||[]).length ? `${Math.round(eff)}y real<br>${Math.abs(drift)>=2?`${drift>0?'+':''}${Math.round(drift)} drift`:'on stock'}${disp?`<br>±${Math.round(disp.sd)}`:''}` : `<span style="color:var(--line-strong)">no data</span>`}
      </div>
      <button class="brm" data-removeclub="${escapeHtml(c.id)}">&times;</button>
    </div>`;
  }).join('');
}
function renderAddClubForm(){
  return `
    <div class="bag-add">
      <input id="newClubName" placeholder="Club name" value="${escapeHtml(newClubName)}">
      <input id="newClubYards" class="num" type="number" inputmode="numeric" placeholder="Yds" value="${escapeHtml(String(newClubYards))}">
    </div>
    <div class="field" style="margin-top:8px;">
      <span class="field-label">Category</span>
      <div class="btn-row" id="newClubCatRow" style="gap:6px;">
        ${CLUB_CATS.map(cc=>`<button data-newclubcat="${cc.id}" class="${newClubCat===cc.id?'sel':''}" style="flex:0 0 auto;padding:8px 10px;font-size:12px;">${cc.label}</button>`).join('')}
      </div>
    </div>
    <button class="save-btn" id="addClubBtn" style="margin-top:8px;">Add Club</button>
  `;
}
function wireClubListHandlers(){
  document.querySelectorAll('[data-clubyards]').forEach(inp=>inp.onchange = async ()=>{
    const c = bag.find(x=>x.id===inp.dataset.clubyards);
    if(c){ c.yards = Number(inp.value)||c.yards; await saveBag(); render(); }
  });
  document.querySelectorAll('[data-removeclub]').forEach(b=>b.onclick = async ()=>{
    const c = bag.find(x=>x.id===b.dataset.removeclub);
    if(c && confirm(`Remove ${c.name} from your bag?`)){
      bag = bag.filter(x=>x.id!==b.dataset.removeclub);
      await saveBag(); await refreshFocus(); render();
    }
  });
  const nn = document.getElementById('newClubName');
  if(nn) nn.oninput = e => newClubName = e.target.value;
  const ny = document.getElementById('newClubYards');
  if(ny) ny.oninput = e => newClubYards = e.target.value;
  document.querySelectorAll('[data-newclubcat]').forEach(b=>b.onclick = ()=>{
    newClubCat = b.dataset.newclubcat; render();
  });
  const addBtn = document.getElementById('addClubBtn');
  if(addBtn) addBtn.onclick = async ()=>{
    if(!newClubName.trim() || !Number(newClubYards) || !newClubCat) return;
    const nm = newClubName.trim();
    bag.push({id: nm+'-'+Date.now(), name:nm, yards:Number(newClubYards), cat:newClubCat, shots:[]});
    newClubName=''; newClubYards=''; newClubCat=null;
    await saveBag(); render();
  };
}

  return `

      ${renderClubRows()}

      ${flags.length
        ? flags.map(f=>`<div class="gap-flag">${f.text}</div>`).join('')
        : `<div class="gap-flag ok">Your gaps are even top to bottom — no dead yardages and no redundant clubs.</div>`}
    </section>

    <div class="home-section-title">Partial Swing Matrix — learned per swing, not just estimated</div>
    <div class="ledger-wrap">
      <table class="matrix">
        <thead><tr><th style="text-align:left;">Club</th><th>½</th><th>¾</th><th>Full</th><th>Extra</th></tr></thead>
        <tbody>
          ${wedges.map(c=>{
            return `<tr>
              <td class="cname">${escapeHtml(c.name)}</td>
              ${SWINGS.map(s=>{
                const hasData = (c.shots||[]).some(sh=>sh.swing===s.id && (sh.strike==='flush'||sh.strike==='solid'));

                return `<td${s.id==='full'?' style="font-weight:600;color:var(--green-deep)"':''}>${Math.round(y)}${hasData?'<span class="data-star">●</span>':''}</td>`;

            </tr>`;
          }).join('')}
        </tbody>
      </table>
      <div class="na-note">● marks a swing length you've actually logged shots for — those numbers are real, not just estimated from your full-swing yardage. Memorize the ¾ column for your wedges and you stop having to manufacture half-shots on the fly.</div>

    <div class="home-section-title">Calibration Status</div>

      <div class="insights-panel" style="margin:0;">
        ${shotCount===0
          ? `<div class="empty">No shots logged yet. Log a few from the Caddie tab and these numbers start correcting themselves.</div>`
          : `<ul>
              <li><b>${shotCount}</b> shot${shotCount===1?'':'s'} logged across ${bag.filter(c=>(c.shots||[]).length).length} club${bag.filter(c=>(c.shots||[]).length).length===1?'':'s'}.</li>
              ${bag.filter(c=>clubBias(c)).map(c=>{
                const b = clubBias(c);
                return `<li><b>${escapeHtml(c.name)}</b>: averaging <b>${b.bias>0?'+':''}${b.bias.toFixed(1)} yards</b> vs. the number you aimed at over ${b.n} shots. ${b.bias < -4 ? 'You are chronically short with this club — the stock number is optimistic.' : b.bias > 4 ? 'You are consistently flying this one past the target.' : 'Well calibrated.'}</li>`;
              }).join('')}
              ${bag.filter(c=>clubDirectionBias(c) && clubDirectionBias(c).dominant).map(c=>{
                const d = clubDirectionBias(c);
                return `<li><b>${escapeHtml(c.name)}</b>: misses <b>${d.dominant}</b> ${d.domPct}% of the time it misses (${d.n} shots logged).</li>`;
              }).join('')}
              ${bag.filter(c=>clubRoll(c)).map(c=>{
                const r = clubRoll(c);
                const eff = effectiveYardage(c);
                return `<li><b>${escapeHtml(c.name)}</b>: averaging <b>${Math.round(r.roll)}y of roll</b> after landing — estimated carry ~${Math.round(eff-r.roll)}y vs. total ~${Math.round(eff)}y.</li>`;

}

        </div>

}

const LIVE_BOTTOM_SECTION_H = 240; // caddie-line + confirm-box(max) + shot-log, fixed
const LIVE_MAX_DIAGRAM_H = 480;
const LIVE_DIAGRAM_SIDE_MARGIN = 20; // matches .live-bottom's own side padding so the diagram lines up with the caddie/confirm/shot-log boxes below it
// Allowance for the chrome above renderRoundView's own content — the compact
// masthead (~52px) + tab bar (~40px). A real device screenshot showed the
// old full-size masthead ate far more than this, starving the diagram — the
// fix was to switch to .mast-compact during play (see render()) rather than
// keep inflating this number. Computed from the compact masthead's own CSS,
// not measured on-device, so still worth rechecking if it looks off.
const LIVE_CHROME_ESTIMATE = 100;

function currentLiveOrigin(h){
  if(!h.shots.length) return {xh:0, yh:0};
  return h.shots[h.shots.length-1];
}
function liveClubLabel(id){
  const c = bag.find(x=>x.id===id);
  return c ? c.name : id;
}
function liveLieLabel(lieId){
  if(lieId==='green') return 'On the green';
  if(lieId==='tee') return 'Tee';
  const l = LIES.find(x=>x.id===lieId);
  return l ? l.label : lieId;
}
function liveLieColor(lieId){
  if(lieId==='fairway' || lieId==='tee') return {bg:'var(--turf-fairway)', fg:'#26361a'};
  if(lieId==='green') return {bg:'var(--turf-green)', fg:'#26361a'};
  if(lieId==='lightrough') return {bg:'var(--gold-pale)', fg:'#26361a'};
  return {bg:'var(--turf-rough)', fg:'#fff'};
}

const SETUP_DEFAULT_YARDAGE = {3:155, 4:400, 5:530};
const SETUP_PREVIEW_W = 260, SETUP_PREVIEW_H = 300; // must match .setup-preview's CSS box

// Fits a hole into a fixed-size preview box using the same lateral-exaggeration
// rule as the live view, so what you see while picking a shape is what you get
// once you start the hole.
function holePreviewFit(hole, boxW, boxH){
  const pxPerYard = boxH / hole.totalH;
  const trueScaleViewW = boxW / pxPerYard;
  const footprintW = hole.holeMaxX - hole.holeMinX;
  const viewW = Math.max(footprintW + HOLE_LATERAL_MARGIN*2, trueScaleViewW / HOLE_MAX_STRETCH);
  const cx = (hole.holeMinX + hole.holeMaxX) / 2;
  return { viewBox: `${cx - viewW/2} 0 ${viewW} ${hole.totalH}`, stretch: trueScaleViewW / viewW };
}

// Shown when you arrive at a hole that hasn't been set up yet — no shape
// picked (freeform rounds, or a course hole nobody configured), no shots
// logged, and quick-entry hasn't been chosen. A course-tied hole that
// already has a shape skips this entirely (see round-start and
// data-starttee wiring, which set setupDone straight to true there).
function renderHoleSetupView(h, stats){
  if(h.par===3){ h.shape = 'straight'; }
  else if(!h.shape){ h.shape = 'straight'; } // sensible pre-pick so "Start This Hole" works with zero taps if you're happy with it

  return `
    <div class="live-hdr">
      <button class="lh-arrow" id="prevHole" ${currentHole===0?'disabled':''}>&#8592;</button>
      <div class="lh-info">Hole ${currentHole+1} Setup</div>
      <button class="lh-arrow" id="nextHole" ${currentHole===17?'disabled':''}>&#8594;</button>
    </div>
    <section style="padding-top:4px;">
      <div class="field">
        <span class="field-label">Par</span>
        <div class="btn-row" id="setupParRow">
          ${[3,4,5].map(p=>`<button data-setuppar="${p}" class="${h.par===p?'sel':''}">${p}</button>`).join('')}
        </div>
      </div>
      <div class="field">
        <span class="field-label">Yardage</span>
        <input class="mini-input" id="setupYardageInput" type="number" inputmode="numeric" placeholder="e.g. ${SETUP_DEFAULT_YARDAGE[h.par]}" value="${h.refYardage!=null?h.refYardage:''}" style="text-align:left;padding-left:12px;">
      </div>
      ${h.par!==3 ? `
      <div class="field">
        <span class="field-label">Shape</span>
        <div class="btn-row" id="setupShapeRow" style="flex-wrap:wrap;">
          ${HOLE_SHAPE_ORDER.map(id=>`<button data-setupshape="${id}" class="${h.shape===id?'sel':''}" style="flex:0 0 auto;padding:7px 9px;font-size:11.5px;">${HOLE_SHAPES[id].label}</button>`).join('')}
        </div>
      </div>` : `<div class="na-note">Par 3 — tee shot goes straight at the green, no shape to pick.</div>`}
      <div class="setup-preview">${(()=>{
        const ph = buildHoleLayout(h.shape, h.refYardage||SETUP_DEFAULT_YARDAGE[h.par], h.par===3);
        const fit = holePreviewFit(ph, SETUP_PREVIEW_W, SETUP_PREVIEW_H);
        return renderHoleShapeSvg(ph, {id:'setupPreviewSvg', viewBox:fit.viewBox, stretch:fit.stretch, pxH:SETUP_PREVIEW_H});
      })()}</div>
      <button class="finish-btn" id="startHoleBtn">Start This Hole</button>
      <button class="save-btn" id="setupQuickBtn" style="background:var(--paper-raised);color:var(--ink-soft);border:1px solid var(--line-strong);margin-top:8px;">Quick Entry Instead (score &amp; putts only)</button>
    </section>
  `;
}

function renderLiveHoleView(h, stats){
  deriveHoleSummaryFields(h);
  const hole = buildHoleLayout(h.shape, h.refYardage, h.par===3);

  const header = `
    <div class="live-hdr">
      <button class="lh-arrow" id="prevHole" ${currentHole===0?'disabled':''}>&#8592;</button>
      <div class="lh-info">Hole ${currentHole+1} <span class="lh-yard">· Par ${h.par}${h.refYardage!=null?` · ${h.refYardage}y`:''}</span></div>
      <button class="lh-arrow" id="nextHole" ${currentHole===17?'disabled':''}>&#8594;</button>
    </div>
    <div style="display:flex;justify-content:center;gap:14px;margin:-2px 0 4px;flex-wrap:wrap;">
      ${h.shots.length ? `<button class="quick-mode-link" style="margin:0;" id="resetShotsBtn">Reset shots</button>` : ``}
      <button class="quick-mode-link" style="margin:0;" id="toggleQuickBtn">${h.quickMode ? 'Track shots for this hole' : 'Quick entry instead'}</button>
      <button class="quick-mode-link" style="margin:0;" id="editHoleSetupBtn">Edit hole setup</button>
    </div>
  `;

  if(h.quickMode){
    return header + `
      <section style="padding-top:4px;">
        <div class="score-display">
          <div style="text-align:center;">
            <div class="score-shape ${scoreShapeClass(h.score,h.par)}"><div class="core">${h.score}</div></div>
            <div class="score-caption">${scoreCaption(h.score,h.par)}</div>
            <div class="score-steppers">
              <button id="scoreDown">&minus;</button>
              <button id="scoreUp">&plus;</button>
            </div>
          </div>
        </div>
        <div class="field">
          <span class="field-label">Putts</span>
          <div class="btn-row" id="puttsRow">
            ${[0,1,2,3,4,5].map(n=>`<button data-putts="${n}" class="${h.putts===n?'sel':''}">${n===5?'5+':n}</button>`).join('')}
          </div>
        </div>
      </section>
      <div class="ledger-wrap">
        <table class="ledger">
          <thead><tr><th>H</th><th>Par</th><th>Score</th><th>FIR</th><th>GIR</th><th>Putts</th></tr></thead>
          <tbody>
            ${round.holes.map((hh,i)=>{
              const diff = hh.score-hh.par;
              const scoreCls = diff>0?'score-over':(diff<0?'score-under':'');
              return `<tr class="${i===currentHole?'current-row':''}" data-jump="${i}">
                <td>${i+1}</td><td>${hh.par}</td>
                <td class="${scoreCls}">${hh.score}</td>
                <td>${hh.par===3?'—':(hh.fir==='hit'?'✓':hh.fir==='miss'?`<span title="${hh.firMissDir?('Missed '+hh.firMissDir):'Missed fairway'}" style="${hh.firMissSeverity==='bad'?'color:var(--red);font-weight:600;':''}">${hh.firMissDir==='left'?'L':hh.firMissDir==='right'?'R':'✕'}</span>`:'')}</td>
                <td>${hh.gir==='hit'?'✓':hh.gir==='miss'?`<span title="${escapeHtml(girMissLabel(hh))}" style="${hh.girMissSeverity==='bad'?'color:var(--red);font-weight:600;':''}">${girMissAbbrev(hh)}</span>`:''}</td>
                <td>${hh.putts}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
      <div class="insights-panel">
        <h3>What today's numbers say</h3>
        ${renderInsightsList(stats)}
      </div>
      <section><button class="finish-btn" id="saveRoundBtn">Save This Round</button></section>
    `;
  }

  const origin = currentLiveOrigin(h);
  const originLie = h.shots.length ? classifyHoleShot(hole, origin.xh, origin.yh) : {lieId:'tee'};
  const remainFromOrigin = Math.sqrt((origin.xh-hole.greenCx)**2 + (origin.yh-hole.greenYh)**2);
  const onGreenNow = h.shots.length>0 && originLie.onGreen;

  shot.target = Math.max(1, Math.round(remainFromOrigin));
  shot.lie = onGreenNow ? 'fairway' : (originLie.lieId==='green' ? 'fairway' : originLie.lieId);
  const recs = (!onGreenNow && bag.length) ? recommendClubs(shot) : [];
  if(liveShotPending && !liveShotClub && recs[0]) liveShotClub = recs[0].club.id;

  let caddieHtml;
  if(onGreenNow){
    caddieHtml = `<div class="cbadge">On</div><div class="ctext">On the green — putting stays as the simple entry below once you finish this hole.</div>`;
  } else if(!liveShotPending){
    const top = recs[0];
    caddieHtml = top
      ? `<div class="cbadge">Caddie</div><div class="ctext"><b>${shot.target}y</b> to the pin from ${liveLieLabel(shot.lie).toLowerCase()} — try the <b>${escapeHtml(top.club.name)}</b> (${top.swing.label}). Tap the diagram where it finishes.</div>`
      : `<div class="cbadge">Caddie</div><div class="ctext"><b>${shot.target}y</b> to the pin. ${bag.length?'':'Add clubs to your bag for a recommendation.'} Tap the diagram where it finishes.</div>`;
  } else {
    caddieHtml = `<div class="cbadge">Confirm</div><div class="ctext">Correct the yardage if you've got a precise number, check the club, then log it.</div>`;
  }

  const chromeH = LIVE_CHROME_ESTIMATE + 60; // + this view's own .live-hdr and quick-link row
  const diagramHeightPx = Math.min(LIVE_MAX_DIAGRAM_H, Math.max(160,
    (typeof window!=='undefined'?window.innerHeight:700) - chromeH - LIVE_BOTTOM_SECTION_H));
  const pxPerYard = diagramHeightPx / hole.totalH;

  // The card always fills the available width. What varies is how many yards
  // of ground that width represents: the viewBox is narrowed to the hole's own
  // footprint plus HOLE_LATERAL_MARGIN of rough either side, then stretched to
  // fill — the scorecard/yardage-book convention (see HOLE_MAX_STRETCH). At
  // true 1:1 a 400y hole left the fairway as a ~15%-of-width ribbon.
  //
  // The tap math needs nothing special for this: svgToHoleSpace inverts the
  // viewBox mapping one axis at a time, so hole-space stays in true yards and
  // every distance/lie calculation is unaffected by the stretch.
  const cardWidthPx = Math.min(typeof window!=='undefined'?window.innerWidth:390, 480) - LIVE_DIAGRAM_SIDE_MARGIN*2;
  const trueScaleViewW = cardWidthPx / pxPerYard;          // yards the width would span at 1:1
  const footprintW = hole.holeMaxX - hole.holeMinX;
  const wholeViewW = Math.max(footprintW + HOLE_LATERAL_MARGIN*2, trueScaleViewW / HOLE_MAX_STRETCH);
  const footprintCx = (hole.holeMinX + hole.holeMaxX) / 2;

  let viewBox, zoom = 1, stretch = 1;
  if(liveView==='whole'){
    viewBox = `${footprintCx - wholeViewW/2} 0 ${wholeViewW} ${hole.totalH}`;
    stretch = trueScaleViewW / wholeViewW;
  } else {
    // 65 (was 50) yards tall — the green (~26y across) was dominating the
    // frame with barely any fringe/rough showing around it. Kept at true 1:1
    // (gw matches the card's aspect) so a green looks like a green.
    const gh = 65, gw = gh*(cardWidthPx/diagramHeightPx);
    viewBox = `${hole.greenCx-gw/2} ${Math.max(hole.greenY-gh*0.4,0)} ${gw} ${gh}`;
    zoom = hole.totalH / gh;
  }

  const shotListHtml = h.shots.length
    ? h.shots.map((s,i)=>`<div class="shot-row">
        <div class="sn">${i+1}</div>
        <div class="sclub">${escapeHtml(liveClubLabel(s.club))}</div>
        <div class="slie">${liveLieLabel(s.lie)}</div>
        <div class="sdist">${Math.round(s.distYards)}y</div>
      </div>`).join('')
    : `<div class="empty-log">No shots logged yet on this hole.</div>`;

  const confirmHtml = liveShotPending ? (()=>{
    const distJustHit = Math.sqrt((liveShotPending.xh-origin.xh)**2 + (liveShotPending.yh-origin.yh)**2);
    const c = classifyHoleShot(hole, liveShotPending.xh, liveShotPending.yh);
    const remain = Math.sqrt((liveShotPending.xh-hole.greenCx)**2 + (liveShotPending.yh-hole.greenYh)**2);
    const lc = liveLieColor(c.lieId);
    const chipRecs = recs.length ? recs : (bag.length ? [{club:bag[0]}] : []);
    return `<div class="confirm-box">
      <div class="confirm-grid">
        <div class="confirm-stat">
          <div class="cs-label">Shot distance</div>
          <div class="cs-value">${Math.round(distJustHit)}y</div>
        </div>
        <div class="confirm-stat override">
          <div class="cs-label">To pin (override)</div>
          <input type="number" id="remainOverride" value="${Math.round(remain)}">
        </div>
      </div>
      <div class="confirm-lie">
        <span class="field-label" style="margin:0;">Lie</span>
        <span class="lie-chip" style="background:${lc.bg};color:${lc.fg};">${liveLieLabel(c.lieId)}</span>
      </div>
      ${chipRecs.length ? `
      <span class="field-label">Club</span>
      <div class="club-chip-row">
        ${chipRecs.map(r=>`<button class="club-chip ${liveShotClub===r.club.id?'sel':''}" data-liveclub="${r.club.id}">${escapeHtml(r.club.name)}</button>`).join('')}
      </div>` : `<div class="na-note" style="padding:0 0 8px;">No clubs in your bag yet — set up your bag to get club recommendations.</div>`}
      <button class="log-btn" id="logShotBtn">Log this shot</button>
    </div>`;
  })() : '';

  return header + `
    <div class="diagram-card" id="diagramCard" style="width:${cardWidthPx.toFixed(1)}px;height:${diagramHeightPx.toFixed(1)}px;">
      ${renderHoleShapeSvg(hole,{id:'liveHoleSvg', viewBox, zoom, stretch, pxH:diagramHeightPx, shots:h.shots, pending:liveShotPending})}
      <button class="view-fab" id="viewToggleBtn">${liveView==='whole' ? '⤢ Green' : '⤡ Whole'}</button>
      <div class="drag-ring" id="liveDragRing"></div>
      <div class="drag-tooltip" id="liveDragTooltip"><div class="dt-main"><span id="liveDtDist">0y</span><span class="dt-lie" id="liveDtLie">Fairway</span></div><div class="dt-sub" id="liveDtRemain">0y to pin</div></div>
      ${(!h.shots.length && !liveShotPending) ? `<div class="tap-hint">Tap — or press and drag — where your ${h.par===3?'tee shot':(h.shots.length?'next shot':'tee shot')} finished</div>` : ''}
    </div>
    <div class="live-bottom">
      <div class="caddie-line">${caddieHtml}</div>
      ${confirmHtml}
      <div class="shot-log">
        <div class="sl-title">This hole</div>
        <div class="shot-log-list">${shotListHtml}</div>
      </div>
    </div>

    <section style="padding-top:14px;">
      <div class="score-display">
        <div style="text-align:center;">
          <div class="score-shape ${scoreShapeClass(h.score,h.par)}"><div class="core">${h.score}</div></div>
          <div class="score-caption">${scoreCaption(h.score,h.par)}</div>
          <div class="score-steppers">
            <button id="scoreDown">&minus;</button>
            <button id="scoreUp">&plus;</button>
          </div>
        </div>
      </div>

      ${(h.score-h.par)>=2 ? `
      <div class="blowup-box">
        <span class="field-label">What happened on this one?</span>
        <div class="btn-row" id="blowupRow" style="gap:6px;margin-top:6px;">
          ${[['penalty','Penalty/OB'],['shortgame','Short Game'],['threeputt','3-Putt'],['teeshot','Tee Shot'],['other','Other']].map(([v,l])=>
            `<button data-blowup="${v}" class="${h.blowup===v?'sel bad':''}" style="flex:0 0 auto;padding:7px 9px;font-size:11.5px;">${l}</button>`).join('')}
        </div>
      </div>` : ``}

      ${h.gir==='miss' ? `
      <div class="field">
        <span class="field-label">Up &amp; Down</span>
        <div class="btn-row" id="udRow">
          <button data-ud="yes" class="${h.ud==='yes'?'sel':''}">Saved It</button>
          <button data-ud="no" class="${h.ud==='no'?'sel bad':''}">No</button>
        </div>
      </div>` : ``}

      <div class="field">
        <span class="field-label">Putts</span>

// Aggregates every tapped approach shot (hit or miss — the tap is captured
// either way now) across the rounds already loaded for the Focus engine
// (cachedFullRounds — last 8 rounds, same window the rest of the insights use)
// into one filterable dispersion chart.
function renderSprayChartSection(){
  const allShots = [];
  cachedFullRounds.forEach(r=>(r.holes||[]).forEach(h=>{
    if(h.girTap) allShots.push(h);
  }));
  if(allShots.length < 3){
    return `
      <div class="sparkline-block">
        <h4>Approach Spray Chart</h4>
        <div class="na-note">Tap the approach diagram on a few holes during your rounds and your dispersion pattern will build up here (last ${Math.min(history.length,8)} rounds).</div>
      </div>`;
  }
  const filtered = allShots.filter(h =>
    (sprayFilterClub==='all' || h.club===sprayFilterClub) &&
    (sprayFilterApproach==='all' || h.approach===sprayFilterApproach)
  );
  const clubsInPlay = CLUBS.filter(c => allShots.some(h=>h.club===c));
  const approachesInPlay = APPROACH_RANGES.filter(a => allShots.some(h=>h.approach===a));
  const missesOnly = filtered.filter(h=>h.gir==='miss');
  const badCount = missesOnly.filter(h=>h.girMissSeverity==='bad').length;
  return `
    <div class="sparkline-block">
      <h4>Approach Spray Chart</h4>
      <div class="compact-grid">
        <select class="field-select" id="sprayClubFilter">
          <option value="all" ${sprayFilterClub==='all'?'selected':''}>All Clubs</option>
          ${clubsInPlay.map(c=>`<option value="${c}" ${sprayFilterClub===c?'selected':''}>${c}</option>`).join('')}
        </select>
        <select class="field-select" id="sprayApproachFilter">
          <option value="all" ${sprayFilterApproach==='all'?'selected':''}>All Distances</option>
          ${approachesInPlay.map(a=>`<option value="${a}" ${sprayFilterApproach===a?'selected':''}>${a}y</option>`).join('')}
        </select>
      </div>
      ${filtered.length
        ? renderGreenDiagram('sprayChartDiagram', {dots: filtered.map(h=>({...h.girTap, severity: h.gir==='hit' ? null : h.girMissSeverity}))})
        : `<div class="na-note">No approach shots logged for that filter yet.</div>`}
      <div class="na-note" style="text-align:center;">${filtered.length} shot${filtered.length===1?'':'s'} plotted, ${missesOnly.length} missed the green · <span style="color:var(--green-deep);">●</span> hit · <span style="color:var(--gold);">●</span> near miss · <span style="color:var(--red);">●</span> bad miss (${badCount} of ${missesOnly.length||1})</div>
    </div>
  `;
}

// Same idea for tee shots — filterable by club off the tee.
function renderFairwaySprayChartSection(){
  const allShots = [];
  cachedFullRounds.forEach(r=>(r.holes||[]).forEach(h=>{
    if(h.par!==3 && h.firTap) allShots.push(h);
  }));
  if(allShots.length < 3){
    return `
      <div class="sparkline-block">
        <h4>Tee Shot Spray Chart</h4>
        <div class="na-note">Tap the fairway diagram on a few tee shots during your rounds and your dispersion pattern will build up here (last ${Math.min(history.length,8)} rounds).</div>
      </div>`;
  }
  const filtered = allShots.filter(h => sprayFairwayFilterClub==='all' || h.teeClub===sprayFairwayFilterClub);
  const clubsInPlay = CLUBS.filter(c => allShots.some(h=>h.teeClub===c));
  const missesOnly = filtered.filter(h=>h.fir==='miss');
  const badCount = missesOnly.filter(h=>h.firMissSeverity==='bad').length;
  return `
    <div class="sparkline-block">
      <h4>Tee Shot Spray Chart</h4>
      <select class="field-select" id="sprayFairwayClubFilter">
        <option value="all" ${sprayFairwayFilterClub==='all'?'selected':''}>All Clubs</option>
        ${clubsInPlay.map(c=>`<option value="${c}" ${sprayFairwayFilterClub===c?'selected':''}>${c}</option>`).join('')}
      </select>
      ${filtered.length
        ? renderFairwayDiagram('fairwaySprayChartDiagram', {dots: filtered.map(h=>({...h.firTap, severity: h.fir==='hit' ? null : h.firMissSeverity}))})
        : `<div class="na-note">No tee shots logged for that filter yet.</div>`}
      <div class="na-note" style="text-align:center;">${filtered.length} tee shot${filtered.length===1?'':'s'} plotted, ${missesOnly.length} missed the fairway · <span style="color:var(--green-deep);">●</span> hit · <span style="color:var(--gold);">●</span> near miss · <span style="color:var(--red);">●</span> bad miss (${badCount} of ${missesOnly.length||1})</div>
    </div>
  `;
}

function sparkline(values, min, max, invert){
  if(values.length<2) return `<div class="na-note">Save a couple more rounds to see a trend line.</div>`;
  const w=280,h=60,pad=6;
  const norm = v => h-pad - ((v-min)/(max-min))*(h-2*pad);
  const step = (w-2*pad)/(values.length-1);
  const pts = values.map((v,i)=>`${pad+i*step},${norm(v)}`).join(' ');
  const color = invert ? '#A8402C' : '#1F3D2E';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="max-width:100%;">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${values.map((v,i)=>`<circle cx="${pad+i*step}" cy="${norm(v)}" r="2.5" fill="${color}"/>`).join('')}
  </svg>`;
}

function wireSprayChartHandlers(){
  const clubSel = document.getElementById('sprayClubFilter');
  if(clubSel) clubSel.onchange = e => { sprayFilterClub = e.target.value; render(); };
  const approachSel = document.getElementById('sprayApproachFilter');
  if(approachSel) approachSel.onchange = e => { sprayFilterApproach = e.target.value; render(); };
  const fairwayClubSel = document.getElementById('sprayFairwayClubFilter');
  if(fairwayClubSel) fairwayClubSel.onchange = e => { sprayFairwayFilterClub = e.target.value; render(); };
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

  if(h.shape && !h.quickMode){
    const liveSvg = document.getElementById('liveHoleSvg');
    const diagramCardEl = document.getElementById('diagramCard');
    if(liveSvg && diagramCardEl){
      const hole = buildHoleLayout(h.shape, h.refYardage, h.par===3);
      const svgToHoleSpace = (clientX, clientY) => {
        const rect = liveSvg.getBoundingClientRect();
        const vb = liveSvg.viewBox.baseVal;
        const xFrac = (clientX-rect.left)/rect.width, yFrac = (clientY-rect.top)/rect.height;
        const xSvg = vb.x + xFrac*vb.width, ySvg = vb.y + yFrac*vb.height;
        const yhRaw = hole.totalH - HOLE_MARGIN_TEE - ySvg;
        return { xh: xSvg, yh: Math.max(-HOLE_MARGIN_TEE+2, Math.min(hole.greenYh+HOLE_MARGIN_GREEN-3, yhRaw)) };
      };
      const markerEl = () => document.getElementById('liveHoleSvg-pendingMarker');
      const ringEl = document.getElementById('liveDragRing');
      const tooltipEl = document.getElementById('liveDragTooltip');
      const dtDist = document.getElementById('liveDtDist'), dtLie = document.getElementById('liveDtLie'), dtRemain = document.getElementById('liveDtRemain');
      const FINGER_CLEARANCE = 58, TOOLTIP_H_EST = 46;

      function paintLive(pos, clientX, clientY){
        const m = markerEl();
        // The marker is a <g> (dot + its drop shadow), so it moves by transform
        // — setting cx/cy here would silently do nothing on a group.
        if(m){ m.setAttribute('transform', `translate(${pos.xh.toFixed(2)},${hole.svgY(pos.yh).toFixed(2)})`); m.setAttribute('opacity','1'); }
        const cardRect = diagramCardEl.getBoundingClientRect();
        const localX = clientX-cardRect.left, localY = clientY-cardRect.top;
        ringEl.style.left = localX+'px'; ringEl.style.top = localY+'px'; ringEl.classList.add('on');

        const origin = currentLiveOrigin(h);
        const distSoFar = Math.sqrt((pos.xh-origin.xh)**2+(pos.yh-origin.yh)**2);
        const remain = Math.sqrt((pos.xh-hole.greenCx)**2+(pos.yh-hole.greenYh)**2);
        const c = classifyHoleShot(hole, pos.xh, pos.yh);
        dtDist.textContent = Math.round(distSoFar)+'y';
        dtLie.textContent = liveLieLabel(c.lieId);
        const lc = liveLieColor(c.lieId);
        dtLie.style.background = lc.bg; dtLie.style.color = lc.fg;
        dtRemain.textContent = Math.round(remain)+'y to pin';

        const anchorAbove = localY > FINGER_CLEARANCE + TOOLTIP_H_EST;
        tooltipEl.classList.remove('above','below');
        tooltipEl.classList.add(anchorAbove?'above':'below','on');
        tooltipEl.style.top = (anchorAbove ? localY-FINGER_CLEARANCE : localY+FINGER_CLEARANCE)+'px';

        // Center the bubble on the touch point, then clamp so it can't be cut
        // off by .diagram-card's overflow:hidden on a narrow card. Measured
        // after the text above is set (and the .on class applied) so ttW
        // reflects the bubble's real rendered width, not a stale/zero one.
        const ttW = tooltipEl.offsetWidth || 120;
        const pad = 6;
        const ttLeft = Math.max(pad, Math.min(cardRect.width - ttW - pad, localX - ttW/2));
        tooltipEl.style.left = ttLeft+'px';
        tooltipEl.style.setProperty('--tail-x', Math.max(12, Math.min(ttW-12, localX-ttLeft))+'px');
      }

      const MIN_ZOOM=1, MAX_ZOOM=6;
      const activePointers = new Map();
      let singleDragActive = false;
      let pinch = null;
      const currentVb = () => { const b = liveSvg.viewBox.baseVal; return {x:b.x,y:b.y,w:b.width,h:b.height}; };
      const pairDist = pts => Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      const pairMid = pts => ({x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2});
      function endSingleDrag(){ tooltipEl.classList.remove('on'); ringEl.classList.remove('on'); singleDragActive=false; }

      liveSvg.onpointerdown = e=>{
        e.preventDefault();
        liveSvg.setPointerCapture(e.pointerId);
        activePointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
        if(activePointers.size===1){
          singleDragActive = true;
          liveShotClub = null; // re-defaults to the top recommendation for this fresh tap
          paintLive(svgToHoleSpace(e.clientX,e.clientY), e.clientX, e.clientY);
        } else if(activePointers.size===2){
          if(singleDragActive) endSingleDrag();
          const pts=[...activePointers.values()];
          const startVb=currentVb(), midClient=pairMid(pts);
          const rect=liveSvg.getBoundingClientRect();
          const anchor={ x:startVb.x+((midClient.x-rect.left)/rect.width)*startVb.w, y:startVb.y+((midClient.y-rect.top)/rect.height)*startVb.h };
          pinch = { startVb, initialDist:pairDist(pts), anchor };
        }
      };
      liveSvg.onpointermove = e=>{
        if(!activePointers.has(e.pointerId)) return;
        activePointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
        if(pinch && activePointers.size===2){
          const pts=[...activePointers.values()];
          const scale=Math.min(MAX_ZOOM,Math.max(MIN_ZOOM,pairDist(pts)/pinch.initialDist));
          const newW=pinch.startVb.w/scale, newH=pinch.startVb.h/scale;
          const rect=liveSvg.getBoundingClientRect(), mid=pairMid(pts);
          const xFrac=(mid.x-rect.left)/rect.width, yFrac=(mid.y-rect.top)/rect.height;
          const newX=pinch.anchor.x-xFrac*newW, newY=pinch.anchor.y-yFrac*newH;
          liveSvg.setAttribute('viewBox', `${newX.toFixed(2)} ${newY.toFixed(2)} ${newW.toFixed(2)} ${newH.toFixed(2)}`);
        } else if(singleDragActive && activePointers.size===1){
          paintLive(svgToHoleSpace(e.clientX,e.clientY), e.clientX, e.clientY);
        }
      };
      const onPointerEnd = e=>{
        activePointers.delete(e.pointerId);
        if(pinch){ if(activePointers.size<2) pinch=null; return; }
        if(singleDragActive && activePointers.size===0){
          endSingleDrag();
          liveShotPending = svgToHoleSpace(e.clientX, e.clientY);
          render();
        }
      };
      liveSvg.onpointerup = onPointerEnd;
      liveSvg.onpointercancel = onPointerEnd;
    }

    const logShotBtn = document.getElementById('logShotBtn');
    if(logShotBtn) logShotBtn.onclick = async ()=>{
      if(!liveShotPending) return;
      const hole = buildHoleLayout(h.shape, h.refYardage, h.par===3);
      const origin = currentLiveOrigin(h);
      const distJustHit = Math.sqrt((liveShotPending.xh-origin.xh)**2 + (liveShotPending.yh-origin.yh)**2);
      const overrideEl = document.getElementById('remainOverride');
      const remain = (overrideEl && overrideEl.value!=='') ? Number(overrideEl.value)
        : Math.sqrt((liveShotPending.xh-hole.greenCx)**2 + (liveShotPending.yh-hole.greenYh)**2);
      const c = classifyHoleShot(hole, liveShotPending.xh, liveShotPending.yh);
      const clubId = liveShotClub || (bag[0] && bag[0].id) || null;
      const originLieId = h.shots.length ? classifyHoleShot(hole, origin.xh, origin.yh).lieId : 'tee';
      const targetAtOrigin = Math.round(Math.sqrt((origin.xh-hole.greenCx)**2 + (origin.yh-hole.greenYh)**2));

      h.shots.push({ xh: liveShotPending.xh, yh: liveShotPending.yh, club: clubId, lie: c.lieId, distYards: distJustHit, remainYards: remain });

      // Feeds the learned-yardage model straight from the round — the whole
      // reason for this rebuild. No swing/strike prompt (keeps this to one
      // tap): a full, solid-contact swing is the reasonable assumption for
      // an on-course shot, same as the practice log's own defaults.
      if(clubId){
        const club = bag.find(x=>x.id===clubId);
        if(club){
          club.shots = club.shots || [];
          club.shots.push({
            date: new Date().toISOString().slice(0,10), swing:'full', strike:'solid',
            lie: originLieId==='green' ? 'fairway' : originLieId,
            target: targetAtOrigin, actual: Math.round(distJustHit), neutral: Math.round(distJustHit)
          });
          if(club.shots.length>40) club.shots = club.shots.slice(-40);
          await saveBag();
        }
      }

      deriveHoleSummaryFields(h);
      liveShotPending = null; liveShotClub = null;
      roundInProgress = true;
      render();
    };
  }

  document.querySelectorAll('[data-jump]').forEach(row=>row.onclick=()=>{ currentHole = Number(row.dataset.jump); caddieOpenHole=null; render(); });

  const saveBtn = document.getElementById('saveRoundBtn');
  if(saveBtn) saveBtn.onclick = async ()=>{
    const stats = computeStats(round);
    const id = Date.now().toString();
    const summary = {
      id, course: round.course, date: round.date, slope: round.slope, rating: round.rating,
      courseId: round.courseId,
      score: stats.totalScore, toPar: stats.toPar,
      girPct: stats.girPct, puttsAvg: stats.puttsAvg
    };
    saveBtn.textContent = 'Saving…';
    await saveRoundToStorage(summary, round);
    await clearInProgressRound();

    // Freeform rounds (no saved course tied to them) already have par for
    // every hole entered — offer to turn that into a reusable course template.
    const offerCourseSave = !round.courseId;
    const prefillName = round.course;
    const prefillHoles = round.holes.map(hh=>({par:hh.par, yardage:null}));

    round = newRound();
    currentHole = 0;
    caddieOpenHole = null;
    roundInProgress = false;

    if(offerCourseSave && confirm('Save this course\'s pars for next time?')){
      courseEditor = {id:null, name: prefillName, tees:[{id:'tee-'+Date.now(), label:'', holes: prefillHoles}]};
      activeTab = 'courses';
    } else {
      activeTab = 'home';
    }
    render();
    await refreshFocus();
    render();
  };
}

loadHistory();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', {updateViaCache:'none'})
      .then(reg => console.log('Round Log SW registered:', reg.scope))
      .catch(err => console.warn('Round Log SW registration failed:', err));
  });
}
</script>
</body>
</html>
